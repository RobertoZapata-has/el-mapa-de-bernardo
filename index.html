<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b120d">
<meta name="description" content="Un juego de combinar fichas por los lugares de Mendoza, con la historia del abuelo Bernardo.">
<title>El mapa de Bernardo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mapa de Bernardo">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Figtree:wght@400;600;700;800&family=Caveat:wght@500;700&display=swap">
<style>
/* Base: márgenes seguros del celular */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: app de una pantalla; fondo = el lugar (se "despierta" con el progreso), arriba HUD, abajo tablero; diálogos como hoja inferior */
:root{
  color-scheme:dark;
  --ink:#2a1a12; --cream:#fff6e6; --cream-dim:#e9dcc6; --malbec:#8c2346; --malbec-deep:#5e1430;
  --gold:#f2b632; --glass:rgba(32,20,14,.62); --glass-strong:rgba(28,16,10,.86); --line:rgba(255,236,200,.28);
  --memory:#c9965a; --ok:#5fcf86;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  --paper:#f3e3c3; --paper-ink:#3b2a1c;
}
html,body{height:100%;overflow:hidden}
body{background:#1b120d;color:var(--cream);font-family:var(--body);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font-family:var(--body);cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{position:relative;height:100%;overflow:hidden}
#bg{position:absolute;inset:0;background:#1b120d center/cover no-repeat;transition:filter .7s ease, background-image .3s;filter:saturate(.3) brightness(.78)}
#app.memory #bg{filter:sepia(.75) saturate(.6) brightness(.85)!important}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.screen.off{visibility:hidden;pointer-events:none}

/* Portada */
#title{justify-content:flex-end;background:linear-gradient(to top,rgba(20,10,6,.92) 0%,rgba(20,10,6,.55) 32%,rgba(20,10,6,0) 58%)}
.title-inner{padding-inline:20px;padding-block:0 34px;display:flex;flex-direction:column;gap:12px;max-width:520px;margin:0 auto;width:100%;box-sizing:border-box}
.kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:800}
h1{font-family:var(--display);font-weight:400;font-size:clamp(44px,13vw,64px);line-height:.95;margin:0;color:var(--cream);text-shadow:0 4px 0 var(--malbec-deep),0 8px 24px rgba(0,0,0,.5);text-wrap:balance}
.title-inner p{margin:0;font-size:17px;color:var(--cream-dim);max-width:34ch}
.btn{appearance:none;border:0;border-radius:16px;font-weight:800;font-size:18px;padding:15px 22px;min-height:54px;color:var(--cream);background:var(--malbec);box-shadow:0 4px 0 var(--malbec-deep),inset 0 0 0 2px rgba(242,182,50,.55)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--malbec-deep),inset 0 0 0 2px rgba(242,182,50,.55)}
.btn.ghost{background:rgba(255,246,230,.12);box-shadow:inset 0 0 0 2px var(--line)}
.proto{font-size:13px;color:var(--cream-dim);opacity:.8}

/* Mapa de capítulos */
.link{appearance:none;background:none;border:0;color:var(--cream-dim);font-size:14px;text-decoration:underline;padding:8px}
/* Pantalla principal: mapa de Mendoza con los lugares, barra arriba y menú abajo */
#map{background:#2a3a1c}
.hub-top{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;align-items:center;gap:8px;padding-inline:12px;padding-block:10px 18px;background:linear-gradient(rgba(20,12,8,.82),rgba(20,12,8,0))}
.hub-top .spacer-x{flex:1}
.icon-btn{appearance:none;border:0;width:44px;height:44px;border-radius:50%;background:rgba(30,20,14,.85);color:var(--cream);font:800 22px/1 var(--body);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer}
.world{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative}
.world-inner{position:relative;max-width:560px;margin:0 auto;padding-block:64px 104px}
.world-inner #nodes{position:absolute;left:0;right:0;top:64px;bottom:104px}
.world-img{display:block;width:100%;height:auto;max-width:none}
.node{position:absolute;transform:translate(-50%,-50%);appearance:none;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:var(--cream)}
.node .disc{position:relative;width:58px;height:58px;border-radius:50%;background:#2b1a12 center 30%/cover no-repeat;box-shadow:0 0 0 3px #fff6e6,0 0 0 7px var(--malbec),0 8px 14px rgba(0,0,0,.55)}
.node .lbl{font:800 12px var(--body);background:rgba(30,20,14,.88);padding:3px 9px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.node .badge{position:absolute;right:-6px;bottom:-4px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:800 13px var(--body);box-shadow:0 2px 4px rgba(0,0,0,.4)}
.node.done .disc{box-shadow:0 0 0 3px #fff6e6,0 0 0 7px var(--gold),0 8px 14px rgba(0,0,0,.55)}
.node.done .badge{background:var(--ok);color:#10301c}
.node.locked .disc{filter:grayscale(1) brightness(.55)}
.node.locked .badge{background:#3b2a1c;color:var(--cream-dim)}
.node.locked .lbl{opacity:.7}
.node.current .disc{animation:pulse 1.4s ease-in-out infinite}
.node .flag{position:absolute;bottom:calc(100% + 2px);left:50%;transform:translateX(-50%);background:var(--malbec);color:var(--cream);font:800 13px var(--body);padding:5px 12px;border-radius:10px;box-shadow:0 3px 0 var(--malbec-deep),inset 0 0 0 1.5px rgba(242,182,50,.6);white-space:nowrap;animation:bob 1.2s ease-in-out infinite}
.node .flag::after{content:"";position:absolute;top:100%;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:var(--malbec)}
.node.final .disc{width:66px;height:66px}
.pips{display:flex;gap:3px;margin-top:-2px}
.pips i{width:9px;height:9px;border-radius:50%;background:rgba(30,20,14,.85);box-shadow:inset 0 0 0 1.5px rgba(255,236,200,.6)}
.pips i.on{background:var(--gold);box-shadow:0 0 6px rgba(242,182,50,.8)}
.pre-text{font-size:14px!important;color:var(--cream)!important;margin-top:-4px!important}
.lvl-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.node.edge-r .flag{left:auto;right:-6px;transform:none}
.node.edge-r .flag::after{left:auto;right:18px}
.node.edge-r .lbl{transform:translateX(-18%)}
@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 0 0 3px #fff6e6,0 0 0 7px var(--gold),0 0 22px 8px rgba(242,182,50,.6)}}
.hub-nav{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;justify-content:center;gap:10px;padding-inline:12px;padding-block:14px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(20,12,8,0),rgba(20,12,8,.9) 40%)}
.nav-b{appearance:none;position:relative;border:0;flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:2px;background:linear-gradient(#5e3a22,#3d2416);color:var(--cream);font:800 13px var(--body);border-radius:16px;padding:6px 6px 8px;box-shadow:0 4px 0 #24150d,inset 0 0 0 1.5px rgba(242,182,50,.5);cursor:pointer}
.nav-b:active{transform:translateY(2px);box-shadow:0 2px 0 #24150d,inset 0 0 0 1.5px rgba(242,182,50,.5)}
.nav-b img,.nav-b .nav-ico{width:46px;height:46px;object-fit:contain;margin-top:-18px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.45))}
.nav-b .nav-ico svg{width:100%;height:100%}
.nav-b .dot{position:absolute;top:-4px;right:-2px;width:16px;height:16px;border-radius:50%;background:#e8453c;box-shadow:0 0 0 2px #fff6e6}
.nav-b .nav-count{position:absolute;top:-6px;right:-4px;min-width:22px;height:22px;border-radius:999px;background:var(--malbec);display:grid;place-items:center;font-size:12px;box-shadow:inset 0 0 0 1.5px rgba(242,182,50,.6)}
.world-pad-top{height:0}
.bag-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%}
.bag-cell{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--cream-dim);text-align:center}
.bag-cell .bi{width:56px;height:56px;border-radius:14px;background:rgba(255,246,230,.08);display:grid;place-items:center;padding:6px;box-sizing:border-box}
.bag-cell .bi>*{width:100%;height:100%;object-fit:contain}
.bag-cell.missing .bi{opacity:.35;filter:grayscale(1) brightness(.5)}
.more-list{display:flex;flex-direction:column;gap:8px;width:100%}
.more-list button{appearance:none;border:0;border-radius:12px;background:rgba(255,246,230,.08);color:var(--cream);font:700 15px var(--body);padding:12px;text-align:left;cursor:pointer;box-shadow:inset 0 0 0 1px var(--line)}
/* Efectos grandes sobre toda la pantalla */
#fx{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.fx-img,.fx-glow,.fx-ember,.fx-rays,.fx-condor,.fx-label{position:absolute;will-change:transform,opacity}
.fx-img{object-fit:contain;filter:drop-shadow(0 12px 16px rgba(0,0,0,.45))}
.fx-glow{border-radius:50%;background:radial-gradient(circle,rgba(255,244,200,.95),rgba(242,182,50,.55) 38%,rgba(242,182,50,0) 70%)}
.fx-glow.hot{background:radial-gradient(circle,rgba(255,240,180,.95),rgba(255,120,40,.6) 40%,rgba(255,80,0,0) 70%)}
.fx-glow.cool{background:radial-gradient(circle,rgba(235,248,255,.95),rgba(150,205,255,.55) 40%,rgba(150,205,255,0) 70%)}
.fx-flash{position:absolute;inset:0}
.fx-ember{border-radius:50%;background:radial-gradient(circle,#fff3b0,#ff9a3a 55%,rgba(255,80,0,0) 72%)}
.fx-rays{border-radius:50%;background:repeating-conic-gradient(rgba(255,226,140,.85) 0 9deg,rgba(255,226,140,0) 9deg 24deg);-webkit-mask:radial-gradient(circle,#000 25%,transparent 70%);mask:radial-gradient(circle,#000 25%,transparent 70%)}
.fx-condor img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 16px 18px rgba(0,0,0,.45))}
.fx-condor .carry{position:absolute;left:30%;top:62%;width:40%;height:40%;object-fit:contain}
.fx-label{font-family:var(--display);font-size:34px;color:#fff6e6;text-shadow:0 3px 0 var(--malbec-deep),0 6px 16px rgba(0,0,0,.6);white-space:nowrap;transform:translate(-50%,-50%)}
/* Escenas de la historia */
.scene{margin:0 auto 12px;width:calc(100% - 24px);max-width:540px;aspect-ratio:16/9;border-radius:18px;overflow:hidden;box-shadow:0 0 0 3px #fff6e6,0 0 0 6px var(--malbec),0 16px 30px rgba(0,0,0,.55);background:#000}
.scene img{display:block;width:100%;height:100%;object-fit:cover;animation:kb 16s ease-in-out infinite alternate}
.scene.in{animation:sceneIn .5s ease both}
.memory .scene img{filter:sepia(.55) saturate(.8)}
@keyframes kb{from{transform:scale(1.02) translate(0,0)}to{transform:scale(1.12) translate(-2%,-1.5%)}}
@keyframes sceneIn{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.scene img{animation:none}.node.current .disc,.node .flag{animation:none}}

/* Juego */
#game{padding-inline:12px;padding-block:10px 14px;box-sizing:border-box;gap:10px}
.topbar{display:flex;align-items:center;gap:10px}
.back{appearance:none;border:0;background:var(--glass);color:var(--cream);border-radius:12px;font-weight:700;font-size:15px;padding:10px 14px;min-height:44px;box-shadow:inset 0 0 0 1px var(--line)}
.ch-title{font-family:var(--display);font-size:20px;text-shadow:0 2px 6px rgba(0,0,0,.7);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud{display:flex;gap:10px;align-items:stretch;max-width:520px;width:100%;margin:0 auto}
.moves{background:var(--malbec);border-radius:14px;padding:6px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 3px 0 var(--malbec-deep),inset 0 0 0 2px rgba(242,182,50,.5);min-width:70px}
.moves b{font-family:var(--display);font-weight:400;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.moves span{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.goals{flex:1;background:var(--glass);border-radius:14px;box-shadow:inset 0 0 0 1px var(--line);display:flex;align-items:center;justify-content:space-around;gap:6px;padding:6px 8px}
.goal{display:flex;align-items:center;gap:6px;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.goal img{width:38px;height:38px}
.goal.done{color:var(--ok)}
.spacer{flex:1;min-height:0}
.spacer.small{flex:.4}
#board{position:relative;width:min(100%, 460px, calc((100vh - 300px) * 0.875));width:min(100%, 460px, calc((100dvh - 300px) * 0.875));aspect-ratio:7/8;margin:0 auto;border-radius:20px;background:rgba(30,18,12,.45);box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 0 0 1.5px rgba(255,236,200,.3);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);touch-action:none;overflow:hidden}
#board canvas{display:block}
.toast{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);font-family:var(--display);font-size:30px;color:var(--cream);text-shadow:0 3px 0 var(--malbec-deep),0 6px 18px rgba(0,0,0,.6);pointer-events:none;white-space:nowrap;opacity:0}
.toast.show{animation:pop 1.1s ease forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.8)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}

/* Diálogo */
#dialog{justify-content:flex-end;background:linear-gradient(to top,rgba(15,8,5,.75),rgba(15,8,5,0) 55%);z-index:5}
.sheet{margin:0 auto 18px;width:calc(100% - 24px);max-width:540px;box-sizing:border-box;background:var(--glass-strong);border-radius:20px;box-shadow:inset 0 0 0 1.5px var(--line),0 12px 30px rgba(0,0,0,.5);padding:16px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;cursor:pointer}
.sheet.narr{grid-template-columns:1fr}
.portrait{width:84px;height:84px;border-radius:50%;background:#ddd center/cover no-repeat;box-shadow:0 0 0 3px var(--gold),0 4px 12px rgba(0,0,0,.4)}
.memory .portrait{box-shadow:0 0 0 3px var(--memory),0 4px 12px rgba(0,0,0,.4);filter:sepia(.35)}
.say{display:flex;flex-direction:column;gap:6px;min-width:0}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.who b{font-family:var(--display);font-weight:400;font-size:21px;color:var(--gold)}
.memory .who b{color:var(--memory)}
.chip{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;border-radius:6px;padding:3px 7px;background:var(--memory);color:var(--ink)}
.line{font-size:18px;line-height:1.45;margin:0}
.narr .line{font-style:italic;color:var(--cream-dim);text-align:center}
.next{font-size:13px;color:var(--cream-dim);text-align:right;grid-column:1/-1;margin-top:-4px}
.skip{position:absolute;top:12px;right:12px;appearance:none;border:0;background:var(--glass);color:var(--cream-dim);border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px;box-shadow:inset 0 0 0 1px var(--line);min-height:40px}

/* Modales */
#modal{align-items:center;justify-content:center;background:rgba(12,6,4,.62);z-index:6;padding-inline:16px}
.card{width:100%;max-width:380px;background:linear-gradient(#3a2418,#24150e);border-radius:22px;box-shadow:inset 0 0 0 2px rgba(242,182,50,.45),0 20px 40px rgba(0,0,0,.6);padding:22px 20px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.card .kicker{margin-bottom:-4px}
.card h3{font-family:var(--display);font-weight:400;font-size:28px;margin:0;text-wrap:balance}
.card p{margin:0;color:var(--cream-dim);font-size:16px;max-width:30ch}
.card .icon{width:120px;height:120px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.card .icon>*{width:100%;height:100%;object-fit:contain}
.card .icon.big{width:170px;height:170px}
.card .icon.small{width:72px;height:72px}
/* Monedas, vidas y premio */
.stats{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(30,20,14,.78);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;color:var(--cream);font:700 15px var(--body);min-height:40px;box-sizing:border-box;font-variant-numeric:tabular-nums}
button.pill{appearance:none;cursor:pointer}
.pill img{width:30px;height:30px;object-fit:contain}
.pill .lives-timer{font-size:12px;font-weight:600;color:var(--cream-dim);min-width:3.2em}
.pill .plus{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--ok);color:#10301c;font-weight:800;font-size:15px;line-height:1}
.pill.daily{background:linear-gradient(#7a4a1e,#5a3312);border-color:rgba(242,182,50,.6);animation:bob 1.6s ease-in-out infinite}
.pill.shop-btn{margin-left:auto}
@keyframes bob{50%{transform:translateY(-3px)}}
.price{display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.price img{width:20px;height:20px;object-fit:contain}
.reward{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-size:28px;color:var(--gold)}
.reward img{width:56px;height:56px;object-fit:contain}
.nope{animation:nope .35s}
@keyframes nope{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* Antes de jugar */
.pre-goals{display:flex;gap:14px;justify-content:center}
.pre-goal{display:inline-flex;align-items:center;gap:4px;font-family:var(--display);font-size:24px}
.pre-goal img{width:44px;height:44px}
.pre-label{font-size:13px!important;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)!important;margin-top:4px!important}
.pre-boosts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.pre-b{appearance:none;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(255,246,230,.08);border:2px solid var(--line);border-radius:14px;padding:8px 4px 10px;color:var(--cream);font:700 13px var(--body);cursor:pointer;min-width:0}
.pre-b img{width:52px;height:52px;object-fit:contain}
.pre-b.on{border-color:var(--gold);background:rgba(242,182,50,.18);box-shadow:0 0 0 2px rgba(242,182,50,.35)}
.pre-badge{position:absolute;top:-8px;right:-6px;background:var(--malbec);border-radius:999px;padding:2px 7px;font-size:12px;box-shadow:inset 0 0 0 1.5px rgba(242,182,50,.6)}
.pre-b.on .pre-badge{background:var(--ok);color:#10301c}
.pre-lives{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;font-size:15px;color:var(--cream-dim)}
.pre-lives img{width:28px;height:28px}
.mini{appearance:none;border:0;border-radius:10px;background:var(--malbec);color:var(--cream);font:700 14px var(--body);padding:8px 12px;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.btn .price img{width:22px;height:22px}
/* Herramientas */
.tools{display:flex;gap:10px;justify-content:center;max-width:460px;width:100%;margin:0 auto}
.tool{appearance:none;position:relative;flex:1;max-width:110px;display:flex;flex-direction:column;align-items:center;gap:0;background:var(--glass);border:0;border-radius:14px;box-shadow:inset 0 0 0 1px var(--line);color:var(--cream);font:700 12px var(--body);padding:6px 4px 6px;cursor:pointer;min-height:64px}
.tool img{width:40px;height:40px;object-fit:contain}
.tool .tcount{position:absolute;top:-6px;right:-4px;min-width:22px;height:22px;border-radius:999px;background:var(--malbec);display:grid;place-items:center;font-size:13px;box-shadow:inset 0 0 0 1.5px rgba(242,182,50,.6);padding-inline:4px;box-sizing:border-box}
.tool.empty .tcount{background:var(--ok);color:#10301c}

<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
<script id="logic">
/* ===== Lógica del tablero (pura, sin dibujo) ===== */
const COLS = 7, ROWS = 8;
const K = (r, c) => r * COLS + c;
const RC = (k) => [Math.floor(k / COLS), k % COLS];
// Boosters (fichas sin color, t = -1):
//  h / v  Zonda: barre la fila / la columna
//  c      Cóndor: rompe su cruz y vuela a una ficha del objetivo
//  o      Volcán: explota alrededor
//  b      Llave: se lleva todas las fichas de un color
// Efectos internos de los combos: x (fila+columna), xo (3 filas+3 columnas), o2 (volcán grande), c3 (tres cóndores)
// Obstáculos: piedra (t = -2, con vida hp) y la cajita que hay que bajar (t = -3).
// El suelo (tierra seca, nieve, ceniza...) va en una grilla aparte: floor[r][c] = capas que faltan limpiar.
const ROCK = -2, ITEM = -3;
const isSpecial = (p) => !!(p && p.s);

function findRuns(g) {
  const out = [];
  for (let r = 0; r < ROWS; r++) {
    let c = 0;
    while (c < COLS) {
      const p = g[r][c];
      if (!p || p.t < 0) { c++; continue; }
      let e = c + 1;
      while (e < COLS && g[r][e] && g[r][e].t === p.t) e++;
      if (e - c >= 3) { const cells = []; for (let i = c; i < e; i++) cells.push([r, i]); out.push({ dir: 'h', cells }); }
      c = e;
    }
  }
  for (let c = 0; c < COLS; c++) {
    let r = 0;
    while (r < ROWS) {
      const p = g[r][c];
      if (!p || p.t < 0) { r++; continue; }
      let e = r + 1;
      while (e < ROWS && g[e][c] && g[e][c].t === p.t) e++;
      if (e - r >= 3) { const cells = []; for (let i = r; i < e; i++) cells.push([i, c]); out.push({ dir: 'v', cells }); }
      r = e;
    }
  }
  return out;
}

function findSquares(g) {
  const out = [];
  for (let r = 0; r < ROWS - 1; r++) for (let c = 0; c < COLS - 1; c++) {
    const p = g[r][c];
    if (!p || p.t < 0) continue;
    const q = [g[r][c + 1], g[r + 1][c], g[r + 1][c + 1]];
    if (q.every((x) => x && x.t === p.t)) out.push({ dir: 'sq', cells: [[r, c], [r, c + 1], [r + 1, c], [r + 1, c + 1]] });
  }
  return out;
}

const hasMatch = (g) => findRuns(g).length > 0 || findSquares(g).length > 0;

function findGroups(g) {
  const runs = [...findRuns(g), ...findSquares(g)];
  const parent = runs.map((_, i) => i);
  const find = (i) => (parent[i] === i ? i : (parent[i] = find(parent[i])));
  const owner = new Map();
  runs.forEach((run, i) => run.cells.forEach(([r, c]) => {
    const k = K(r, c);
    if (owner.has(k)) parent[find(i)] = find(owner.get(k)); else owner.set(k, i);
  }));
  const groups = new Map();
  runs.forEach((run, i) => {
    const root = find(i);
    if (!groups.has(root)) groups.set(root, { runs: [], cells: new Set() });
    const G = groups.get(root);
    G.runs.push(run);
    run.cells.forEach(([r, c]) => G.cells.add(K(r, c)));
  });
  return [...groups.values()];
}

function mostCommonColor(g, exclude) {
  const count = {};
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const q = g[r][c];
    if (q && q.t >= 0 && !(exclude && exclude.has(K(r, c)))) count[q.t] = (count[q.t] || 0) + 1;
  }
  const keys = Object.keys(count);
  if (!keys.length) return null;
  return Number(keys.sort((a, b) => count[b] - count[a])[0]);
}

function pickTarget(g, r, c, ctx, taken) {
  const pref = [], any = [];
  for (let rr = 0; rr < ROWS; rr++) for (let cc = 0; cc < COLS; cc++) {
    const k = K(rr, cc);
    if ((rr === r && cc === c) || taken.has(k)) continue;
    const q = g[rr][cc];
    if (!q || q.t === ITEM) continue;
    const wanted = (q.t >= 0 && ctx.prefer && ctx.prefer.has(q.t)) || (ctx.rock && q.t === ROCK) || (ctx.floor && ctx.floor[rr][cc] > 0);
    if (wanted) pref.push(k); else any.push(k);
  }
  const list = pref.length ? pref : any;
  if (!list.length) return null;
  return list[Math.floor(ctx.rand() * list.length)];
}

function areaCells(r, c, R, D) {
  const out = [];
  for (let dr = -R; dr <= R; dr++) for (let dc = -R; dc <= R; dc++) {
    const rr = r + dr, cc = c + dc;
    if (rr < 0 || rr >= ROWS || cc < 0 || cc >= COLS) continue;
    if (Math.abs(dr) + Math.abs(dc) > D) continue;
    out.push(K(rr, cc));
  }
  return out;
}
const rowCells = (r) => Array.from({ length: COLS }, (_, i) => K(r, i));
const colCells = (c) => Array.from({ length: ROWS }, (_, i) => K(i, c));

// Qué rompe cada booster. Devuelve celdas y, si corresponde, vuelos de cóndor o rayos de la Llave.
function effect(p, r, c, g, ctx, taken) {
  const cells = [], flights = [];
  let beam = null;
  const add = (arr) => arr.forEach((k) => cells.push(k));
  const s = p.s;
  if (s === 'h') add(rowCells(r));
  else if (s === 'v') add(colCells(c));
  else if (s === 'x') { add(rowCells(r)); add(colCells(c)); }
  else if (s === 'xo') { for (let d = -1; d <= 1; d++) { if (r + d >= 0 && r + d < ROWS) add(rowCells(r + d)); if (c + d >= 0 && c + d < COLS) add(colCells(c + d)); } }
  else if (s === 'o') add(areaCells(r, c, 2, 3));
  else if (s === 'o2') add(areaCells(r, c, 3, 5));
  else if (s === 'c' || s === 'c3') {
    add(areaCells(r, c, 1, 1));
    const n = s === 'c3' ? 3 : 1;
    const local = new Set([...taken, ...cells]);
    for (let i = 0; i < n; i++) {
      const t = pickTarget(g, r, c, ctx, local);
      if (t === null) break;
      local.add(t);
      const [tr, tc] = RC(t);
      flights.push({ from: [r, c], to: [tr, tc], carry: p.carry || null });
      if (p.carry) add(effect({ s: p.carry }, tr, tc, g, ctx, local).cells);
      else cells.push(t);
    }
  } else if (s === 'b') {
    const color = p.color !== undefined ? p.color : mostCommonColor(g);
    const targets = [];
    if (color !== null) for (let rr = 0; rr < ROWS; rr++) for (let cc = 0; cc < COLS; cc++) { const q = g[rr][cc]; if (q && q.t === color) { cells.push(K(rr, cc)); targets.push([rr, cc]); } }
    beam = { from: [r, c], to: targets };
  } else if (s === 'all') {
    for (let k = 0; k < ROWS * COLS; k++) cells.push(k);
  }
  return { cells, flights, beam };
}

// Expande en cadena: todo booster alcanzado por una explosión también explota
function expandSpecials(g, clear, keep, ctx) {
  const triggered = [], flights = [], beams = [];
  const done = new Set();
  const queue = [...clear];
  while (queue.length) {
    const k = queue.shift();
    if (done.has(k)) continue;
    done.add(k);
    if (keep && keep.has(k)) continue;
    const [r, c] = RC(k);
    const p = g[r][c];
    if (p && p.s) {
      triggered.push({ r, c, s: p.s, carry: p.carry || null });
      const e = effect(p, r, c, g, ctx, clear);
      flights.push(...e.flights);
      if (e.beam) beams.push(e.beam);
      for (const x of e.cells) if (!clear.has(x)) { clear.add(x); queue.push(x); }
    }
  }
  return { triggered, flights, beams };
}

function pack(clear, created, fx, extra) {
  return Object.assign({ clear: [...clear], created, triggered: fx.triggered, flights: fx.flights, beams: fx.beams, converted: [] }, extra || {});
}

function resolveStep(g, swapPos, ctx) {
  const groups = findGroups(g);
  if (!groups.length) return null;
  const clear = new Set();
  const created = [];
  for (const G of groups) {
    const straight = G.runs.filter((r) => r.dir !== 'sq');
    const longest = straight.reduce((a, b) => (!a || b.cells.length > a.cells.length ? b : a), null);
    const hasH = straight.some((r) => r.dir === 'h'), hasV = straight.some((r) => r.dir === 'v');
    let special = null;
    if (longest && longest.cells.length >= 5) special = 'b';
    else if (hasH && hasV) special = 'o';
    else if (longest && longest.cells.length === 4) special = longest.dir === 'h' ? 'h' : 'v';
    else if (G.runs.some((r) => r.dir === 'sq')) special = 'c';
    G.cells.forEach((k) => clear.add(k));
    if (special) {
      let pos = swapPos && swapPos.find(([r, c]) => G.cells.has(K(r, c)));
      if (!pos) {
        const src = longest || G.runs[0];
        pos = src.cells[Math.floor((src.cells.length - 1) / 2)];
      }
      created.push({ r: pos[0], c: pos[1], piece: { t: -1, s: special } });
    }
  }
  const hits = [];
  for (const G of groups) G.cells.forEach((k) => {
    const [r, c] = RC(k);
    for (const [dr, dc] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const rr = r + dr, cc = c + dc;
      if (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS && g[rr][cc] && g[rr][cc].t === ROCK) hits.push(K(rr, cc));
    }
  });
  hits.forEach((k) => clear.add(k));
  const keep = new Set(created.map((o) => K(o.r, o.c)));
  const fx = expandSpecials(g, clear, keep, ctx);
  created.forEach((o) => clear.delete(K(o.r, o.c)));
  return pack(clear, created, fx);
}

// Tocar un booster (o romperlo con la pala)
function activateAt(g, cells, ctx) {
  const clear = new Set(cells.map(([r, c]) => K(r, c)));
  const fx = expandSpecials(g, clear, null, ctx);
  return pack(clear, [], fx);
}

// Deslizar un booster: solo, contra una ficha, o combinado con otro booster.
// a = de dónde salió la ficha arrastrada, b = adónde llegó (ya intercambiadas).
function activateSwap(g, a, b, ctx) {
  const pa = g[a[0]][a[1]], pb = g[b[0]][b[1]];
  const ka = K(a[0], a[1]), kb = K(b[0], b[1]);
  const both = pa.s && pb.s;
  if (!both) {
    // un solo booster: se activa donde quedó
    const pos = pa.s ? a : b;
    const other = pa.s ? pb : pa;
    const p = g[pos[0]][pos[1]];
    if (p.s === 'b' && other.t >= 0) p.color = other.t;
    return activateAt(g, [pos], ctx);
  }
  const center = b;
  const kc = K(center[0], center[1]), ko = kc === kb ? ka : kb;
  const s1 = pa.s, s2 = pb.s;
  const has = (x) => s1 === x || s2 === x;
  const line = (x) => x === 'h' || x === 'v';
  const clear = new Set([kc, ko]);
  const keep = new Set([ko]);
  let converted = [];
  if (s1 === 'b' && s2 === 'b') {
    g[center[0]][center[1]] = { t: -1, s: 'all' };
  } else if (has('b')) {
    // la Llave convierte un color entero en el otro booster
    const otherS = s1 === 'b' ? s2 : s1;
    const color = mostCommonColor(g);
    keep.add(kc);
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const q = g[r][c];
      if (q && q.t === color) {
        const s = line(otherS) ? (ctx.rand() < 0.5 ? 'h' : 'v') : otherS;
        g[r][c] = { t: -1, s };
        converted.push({ r, c, s });
        clear.add(K(r, c));
      }
    }
    converted.forEach((o) => clear.add(K(o.r, o.c)));
    const fx = expandSpecials(g, clear, keep, ctx);
    fx.beams.push({ from: center, to: converted.map((o) => [o.r, o.c]) });
    return pack(clear, [], fx, { converted });
  } else if (line(s1) && line(s2)) {
    g[center[0]][center[1]] = { t: -1, s: 'x' };
  } else if ((line(s1) && s2 === 'o') || (s1 === 'o' && line(s2))) {
    g[center[0]][center[1]] = { t: -1, s: 'xo' };
  } else if (s1 === 'o' && s2 === 'o') {
    g[center[0]][center[1]] = { t: -1, s: 'o2' };
  } else if (s1 === 'c' && s2 === 'c') {

/* ===== Estado ===== */
const fresh = () => ({ unlocked: 0, got: {}, levels: {}, coins: 300, lives: MAX_LIVES, livesTs: Date.now(), daily: '',
  inv: { zonda: 1, volcan: 1, llave: 1, pala: 2, tijera: 1, guante: 2 } });
let save = fresh();
try {
  const s = JSON.parse(localStorage.getItem('mapa-bernardo') || 'null');
  if (s && typeof s.unlocked === 'number') save = Object.assign(fresh(), s, { inv: Object.assign(fresh().inv, s.inv || {}), levels: s.levels || {} });
  Object.keys(save.got).forEach((k) => { if (save.got[k]) save.levels[k] = 3; });
} catch (e) {}
const persist = () => { try { localStorage.setItem('mapa-bernardo', JSON.stringify(save)); } catch (e) {} };

function syncLives() {
  if (save.lives >= MAX_LIVES) { save.lives = MAX_LIVES; return; }
  const now = Date.now(), n = Math.floor((now - save.livesTs) / REGEN);
  if (n > 0) {
    save.lives = Math.min(MAX_LIVES, save.lives + n);
    save.livesTs += n * REGEN;
    if (save.lives >= MAX_LIVES) save.livesTs = now;
    persist();
  }
}
function loseLife() { syncLives(); if (save.lives >= MAX_LIVES) save.livesTs = Date.now(); save.lives = Math.max(0, save.lives - 1); persist(); refreshStats(); }
const nextLifeIn = () => (save.lives >= MAX_LIVES ? 0 : Math.max(0, save.livesTs + REGEN - Date.now()));
const fmtTime = (ms) => { const s = Math.ceil(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
function spend(price) {
  if (save.coins < price) return false;
  save.coins -= price; persist(); refreshStats(); Sound.coin();
  return true;
}
function addCoins(n) { save.coins += n; persist(); refreshStats(); }
function refreshStats() {
  syncLives();
  document.querySelectorAll('.coins-count').forEach((e) => { e.textContent = save.coins; });
  document.querySelectorAll('.lives-count').forEach((e) => { e.textContent = save.lives; });
  document.querySelectorAll('.lives-timer').forEach((e) => { e.textContent = save.lives >= MAX_LIVES ? 'Llenas' : fmtTime(nextLifeIn()); });
  const dd = $('daily-dot'); if (dd) dd.hidden = save.daily === today();
  updateToolbar();
}

/* ===== Diálogos ===== */
function setScene(src) {
  const fig = $('scene'), im = $('scene-img');
  if (!src) { fig.hidden = true; im.removeAttribute('data-src'); return; }
  if (im.dataset.src === src) return;
  im.dataset.src = src;
  fig.hidden = true;
  im.onload = () => { if (im.dataset.src !== src) return; fig.hidden = false; fig.classList.remove('in'); void fig.offsetWidth; fig.classList.add('in'); };
  im.onerror = () => { fig.hidden = true; };
  im.src = src;
}
function runDialog(lines) {
  return new Promise((resolve) => {
    if (!lines || !lines.length) return resolve();
    let i = 0;
    const sheet = $('sheet');
    const render = () => {
      const L = lines[i];
      const p = L.who ? P[L.who] : null;
      sheet.classList.toggle('narr', !p);
      $('d-portrait').hidden = !p;
      if (p) { $('d-portrait').style.backgroundImage = `url(${p.img})`; $('d-name').textContent = p.n; }
      $('d-name').parentElement.hidden = !p;
      $('d-chip').hidden = !L.memory;
      $('d-text').textContent = L.text;
      app.classList.toggle('memory', !!L.memory);
      if (L.img) setScene(L.img);
    };
    setScene(null);
    const finish = () => { cleanup(); setScene(null); app.classList.remove('memory'); resolve(); };
    const next = () => { Sound.tick(); i++; if (i >= lines.length) finish(); else render(); };
    const onKey = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); next(); } };
    const cleanup = () => { sheet.removeEventListener('click', next); sheet.removeEventListener('keydown', onKey); $('btn-skip').removeEventListener('click', finish); };
    sheet.addEventListener('click', next);
    sheet.addEventListener('keydown', onKey);
    $('btn-skip').addEventListener('click', finish);
    render();
    show('dialog');
    sheet.focus({ preventScroll: true });
  });
}

/* ===== Modales ===== */
let modalCleanup = null;
function modal(html, buttons, fill) {
  return new Promise((resolve) => {
    if (modalCleanup) { modalCleanup(); modalCleanup = null; }
    const card = $('card');
    card.innerHTML = html + '<div class="actions"></div>';
    const act = card.querySelector('.actions');
    buttons.forEach(([label, val, ghost]) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'btn' + (ghost ? ' ghost' : ''); b.textContent = label;
      b.dataset.val = val;
      b.addEventListener('click', () => { if (b.disabled) return; Sound.tick(); if (modalCleanup) { modalCleanup(); modalCleanup = null; } $('modal').classList.add('off'); resolve(val); });
      act.appendChild(b);
    });
    if (fill) modalCleanup = fill(card) || null;
    $('modal').classList.remove('off');
    const first = act.querySelector('button:not([disabled])');
    if (first) first.focus({ preventScroll: true });
  });
}
const coinTag = (n) => `<span class="price"><img src="img/ui_moneda.png" alt="">${n}</span>`;
function shake(el) { el.classList.remove('nope'); void el.offsetWidth; el.classList.add('nope'); }

/* ===== Antes de jugar ===== */
function goalChips(ch, lv, remaining) {
  return lv.goals.map(([t, n], k) => { const g = goalInfo(ch, lv, t); return `<span class="pre-goal"><img src="${g.img}" alt="${g.name}"><b>${remaining ? remaining[k] : n}</b></span>`; }).join('');
}
function preLevel(ch, L) {
  const chosen = new Set();
  const lv = LEVELS[ch.id][L];
  const html = `<span class="kicker">${ch.name} · Nivel ${L + 1} de 3</span><h3></h3>
    <div class="pre-goals">${goalChips(ch, lv)}</div>
    <p class="pre-text">${goalText(ch, lv)}</p>
    <p class="pre-label">Ayudas para empezar</p>
    <div class="pre-boosts">${['zonda', 'volcan', 'llave'].map((k) => `<button type="button" class="pre-b" data-k="${k}" aria-pressed="false"><img src="${ITEMS[k].img}" alt=""><span class="pre-name">${ITEMS[k].name}</span><span class="pre-badge"></span></button>`).join('')}</div>
    <div class="pre-lives"></div>`;
  return modal(html, [['Jugar', 'play'], ['Volver al mapa', 'map', 1]], (card) => {
    card.querySelector('h3').textContent = ch.name;
    const playBtn = card.querySelector('[data-val="play"]');
    const paint = () => {
      card.querySelectorAll('.pre-b').forEach((b) => {
        const k = b.dataset.k, on = chosen.has(k), n = save.inv[k];
        b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on));
        b.querySelector('.pre-badge').innerHTML = on ? '✓' : n > 0 ? `x${n}` : coinTag(ITEMS[k].price);
      });
      syncLives();
      const L = card.querySelector('.pre-lives');
      if (save.lives > 0) {
        L.innerHTML = `<img src="img/ui_corazon.png" alt=""><span>${save.lives} ${save.lives === 1 ? 'vida' : 'vidas'}</span>`;
        playBtn.disabled = false;
      } else {
        L.innerHTML = `<img src="img/ui_corazon.png" alt=""><span>Sin vidas. La próxima en <b class="lives-timer">${fmtTime(nextLifeIn())}</b></span><button type="button" class="mini" id="btn-refill">Llenar vidas ${coinTag(PRICE_LIVES)}</button>`;
        playBtn.disabled = true;
        card.querySelector('#btn-refill').addEventListener('click', (e) => {
          if (spend(PRICE_LIVES)) { save.lives = MAX_LIVES; save.livesTs = Date.now(); persist(); refreshStats(); paint(); }
          else { shake(e.currentTarget); }
        });
      }
    };
    card.querySelectorAll('.pre-b').forEach((b) => b.addEventListener('click', () => {
      const k = b.dataset.k;
      if (chosen.has(k)) chosen.delete(k);
      else if (save.inv[k] > 0) chosen.add(k);
      else if (spend(ITEMS[k].price)) { save.inv[k]++; persist(); chosen.add(k); }
      else { shake(b); return; }
      Sound.tick(); paint();
    }));
    paint();
    let lastLives = save.lives;
    const iv = setInterval(() => { syncLives(); if (save.lives !== lastLives) { lastLives = save.lives; paint(); } }, 1000);
    return () => clearInterval(iv);
  }).then((v) => {
    if (v !== 'play') return null;
    const list = [...chosen];
    list.forEach((k) => { save.inv[k] = Math.max(0, save.inv[k] - 1); });
    persist();
    return list;
  });
}

/* ===== Premio del día ===== */
async function openDaily() {
  if (save.daily === today()) {
    const mid = new Date(); mid.setHours(24, 0, 0, 0);
    const h = Math.floor((mid - Date.now()) / 3600000), m = Math.ceil(((mid - Date.now()) % 3600000) / 60000);
    await modal(`<span class="kicker">Premio del día</span><div class="icon"><img src="img/ui_cofre.png" alt=""></div><h3>Ya abriste el cofre de hoy</h3><p>El próximo se abre en ${h > 0 ? `${h} h ` : ''}${m} min.</p>`, [['Entendido', 1]]);
    return;
  }
  const pool = [{ coins: 50 }, { coins: 80 }, { coins: 120 }, { coins: 200 }, { inv: 'zonda' }, { inv: 'volcan' }, { inv: 'llave' }, { inv: 'pala' }, { inv: 'guante' }, { inv: 'tijera' }, { life: 1 }];
  let r = pool[Math.floor(Math.random() * pool.length)];
  syncLives();
  if (r.life && save.lives >= MAX_LIVES) r = { coins: 100 };
  let title, img;
  if (r.coins) { save.coins += r.coins; title = `+${r.coins} monedas`; img = 'img/ui_bolsa.png'; }
  else if (r.inv) { save.inv[r.inv]++; title = `${ITEMS[r.inv].name} de regalo`; img = ITEMS[r.inv].img; }
  else { save.lives = Math.min(MAX_LIVES, save.lives + 1); title = 'Una vida de regalo'; img = 'img/ui_corazon.png'; }
  save.daily = today();
  persist(); refreshStats();
  Sound.win();
  await modal(`<span class="kicker">Premio del día</span><div class="icon big"><img src="img/ui_cofre_abierto.png" alt=""></div><h3>${title}</h3><div class="reward"><img src="${img}" alt=""></div><p>Mañana hay otro cofre.</p>`, [['¡Gracias!', 1]]);
}

/* ===== Flujo de un capítulo ===== */
let current = null;
async function playPlace(i) {
  const ch = CHAPTERS[i], done = save.levels[ch.id] || 0;
  if (done < 3) return playLevel(i, done, false);
  const v = await modal(`<span class="kicker">${ch.num}</span><h3></h3><p>Elegí qué nivel volver a jugar.</p><div class="lvl-pick"></div>`, [['Cerrar', 'x', 1]], (card) => {
    card.querySelector('h3').textContent = ch.name;
    const box = card.querySelector('.lvl-pick');
    [0, 1, 2].forEach((L) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'btn'; b.textContent = `Nivel ${L + 1}`;
      b.addEventListener('click', () => { $('modal').classList.add('off'); playLevel(i, L, true); });
      box.appendChild(b);
    });
  });
  return v;
}
async function playLevel(i, L, replay) {
  const ch = CHAPTERS[i];
  current = i;
  setBg(ch.bg, ch.memory ? 0.9 : 0.15);
  syncLives();
  if (L === 0 && !replay && save.lives > 0) await runDialog(ch.intro);
  await beginLevel(ch, L, replay);
}
async function beginLevel(ch, L, replay) {
  const pre = await preLevel(ch, L);
  if (!pre) { renderMap(); return; }
  startLevel(ch, L, pre, replay);
}

let hudGoals = [];
function renderHUD(state, ch, lv) {
  $('g-moves').textContent = state.moves;
  const box = $('g-goals');
  if (!hudGoals.length || box.childElementCount !== state.goals.length) {
    box.innerHTML = '';
    hudGoals = state.goals.map((g) => {
      const el = document.createElement('div'); el.className = 'goal';
      const gi = goalInfo(ch, lv, g.t);
      el.innerHTML = `<img alt="${gi.name}" src="${gi.img}"><span></span>`;
      box.appendChild(el); return el;
    });
  }
  state.goals.forEach((g, k) => {
    const left = Math.max(0, g.n - g.got);
    hudGoals[k].classList.toggle('done', left === 0);
    hudGoals[k].querySelector('span').textContent = left === 0 ? '✓' : left;
  });
}
function toast(text) { const t = $('toast'); t.textContent = text; t.classList.remove('show'); void t.offsetWidth; t.classList.add('show'); }

/* Barra de herramientas */
let sceneRef = null;
function updateToolbar() {
  document.querySelectorAll('.tool').forEach((b) => {
    const k = b.dataset.tool, n = save.inv[k];
    b.querySelector('.tcount').innerHTML = n > 0 ? n : '+';
    b.classList.toggle('empty', n <= 0);
    b.classList.toggle('active', !!(sceneRef && sceneRef.tool === k));
    b.setAttribute('aria-pressed', String(!!(sceneRef && sceneRef.tool === k)));
  });
  const hint = $('tool-hint');
  if (hint) {
    const k = sceneRef && sceneRef.tool;
    hint.hidden = !k;
    if (k) hint.textContent = ITEMS[k].hint;
  }
}
async function onToolButton(k) {
  const sc = await boardReady;
  if (sc.busy || sc.ended) return;
  Sound.tick();
  if (sc.tool === k) { sc.setTool(null); return; }
  if (save.inv[k] > 0) { sc.setTool(k); return; }
  const v = await modal(`<span class="kicker">Herramienta</span><div class="icon"><img src="${ITEMS[k].img}" alt=""></div><h3>${ITEMS[k].name}</h3><p>${ITEMS[k].desc}</p>`,
    [[`Comprar por ${ITEMS[k].price} monedas`, 'buy'], ['Ahora no', 'no', 1]],
    (card) => { if (save.coins < ITEMS[k].price) { const b = card.querySelector('[data-val="buy"]'); b.disabled = true; b.textContent = `Te faltan monedas (tenés ${save.coins})`; } });
  if (v === 'buy' && spend(ITEMS[k].price)) { save.inv[k]++; persist(); refreshStats(); sc.setTool(k); }
}

async function startLevel(ch, L, pre, replay) {
  const lv = LEVELS[ch.id][L];
  $('g-title').textContent = `${ch.name} · ${L + 1}/3`;
  hudGoals = [];
  show('game');
  setAwake(ch.memory ? 0.9 : 0.15);
  app.classList.toggle('memory', !!ch.memory);
  const scene = await boardReady;
  sceneRef = scene;
  game.scale.refresh();
  scene.startLevel({
    set: ch.set, lv, moves: lv.moves, types: lv.types, goals: lv.goals.map(([t, n]) => ({ t, n, got: 0 })), pre: pre || [],
    onUpdate: (st) => { renderHUD(st, ch, lv); const tot = st.goals.reduce((a, g) => a + g.n, 0), got = st.goals.reduce((a, g) => a + Math.min(g.n, g.got), 0); if (!ch.memory) setAwake(0.15 + 0.85 * got / tot); },
    onCombo: (n) => { if (n === 2) toast('¡Bien!'); else if (n === 3) toast('¡Bárbaro!'); else if (n >= 4) toast('¡Qué genio!'); },
    onTool: () => updateToolbar(),
    onToolUsed: (k) => { save.inv[k] = Math.max(0, save.inv[k] - 1); persist(); updateToolbar(); },
    onEnd: (won, info) => endLevel(ch, L, won, info, replay),
  });
  updateToolbar();
}

async function endLevel(ch, L, won, info, replay) {
  const idx = CHAPTERS.indexOf(ch);
  const lv = LEVELS[ch.id][L];
  if (won) {
    setAwake(1);
    Sound.win();
    const earned = 25 + 5 * ((info && info.left) || 0);
    addCoins(earned);
    await new Promise((r) => setTimeout(r, 600));
    save.levels[ch.id] = Math.max(save.levels[ch.id] || 0, L + 1);
    const first = L === 2 && !save.got[ch.id];
    if (L === 2) {
      save.got[ch.id] = 1;
      save.unlocked = Math.min(CHAPTERS.length - 1, Math.max(save.unlocked, idx + 1));
    }
    persist();
    app.classList.remove('memory');
    Sound.chime();
    const reward = `<div class="reward coins-won"><img src="img/ui_moneda.png" alt=""><b>+${earned}</b></div>`;
    if (first) {
      await modal(`<span class="kicker">Conseguiste</span><div class="icon${ch.final ? ' big' : ''}">${objIcon(ch.obj.icon)}</div><h3></h3><p></p>${reward}`, [['Seguir la historia', 1]],
        (card) => { card.querySelector('h3').textContent = ch.obj.name; card.querySelector('p').textContent = ch.obj.desc; });
      await runDialog(ch.outro);
      if (ch.final) {
        await showLetter();
        Sound.music('game');
        setBg(ch.bg, 1);
        await runDialog(ch.epilogue);
        Sound.chime();
        $('dialog').classList.add('off');
        await modal(`<span class="kicker">Fin</span><div class="icon big">${objIcon('llave')}</div><h3>El mapa de Bernardo</h3><p>En memoria de Bernardo y de Roberto.</p>`, [['Volver al mapa', 1]]);
      }
    } else {
      const canNext = L < 2 && !replay;
      const v = await modal(`<span class="kicker">${ch.name}</span><h3>¡Nivel ${L + 1} superado!</h3>${reward}${canNext ? `<p>Falta${L === 1 ? '' : 'n'} ${2 - L} nivel${L === 1 ? '' : 'es'} para encontrar lo que dejó Bernardo.</p>` : ''}`,
        canNext ? [['Siguiente nivel', 'next'], ['Volver al mapa', 'map', 1]] : [['Volver al mapa', 'map']]);
      if (v === 'next') { beginLevel(ch, L + 1, false); return; }
    }
    renderMap();
    return;
  }
  app.classList.remove('memory');
  Sound.lose();
  const sc = await boardReady;
  const remaining = sc.state.goals.map((g) => Math.max(0, g.n - g.got));
  const v = await modal(`<span class="kicker">Sin jugadas</span><h3>Casi lo tenías</h3><p>Te falta:</p><div class="pre-goals">${goalChips(ch, lv, remaining)}</div><div class="icon small"><img src="img/ui_jugadas.png" alt=""></div>`,
    [['+5 jugadas', 'more'], ['Rendirme', 'quit', 1]],
    (card) => {
      const b = card.querySelector('[data-val="more"]');
      if (save.coins < PRICE_MOVES) { b.disabled = true; b.innerHTML = `+5 jugadas · te faltan monedas`; }
      else b.innerHTML = `+5 jugadas ${coinTag(PRICE_MOVES)}`;
    });
  if (v === 'more' && spend(PRICE_MOVES)) { app.classList.toggle('memory', !!ch.memory); sc.addMoves(5); return; }
  loseLife();
  const msg = save.lives > 0 ? `Te ${save.lives === 1 ? 'queda 1 vida' : `quedan ${save.lives} vidas`}.` : `Te quedaste sin vidas. La próxima llega en <b class="lives-timer">${fmtTime(nextLifeIn())}</b>.`;
  const v2 = await modal(`<span class="kicker">Perdiste una vida</span><div class="icon small"><img src="img/ui_corazon.png" alt=""></div><h3>No te rindas</h3><p>${msg}</p>`,
    [['Reintentar', 'retry'], ['Volver al mapa', 'map', 1]]);
  if (v2 === 'retry') beginLevel(ch, L, replay); else renderMap();
}

function shakeSprite(scene, [r, c]) {
  const s = scene.sprites[r] && scene.sprites[r][c];
  if (s) scene.tweens.add({ targets: s, x: s.x + 8, duration: 50, yoyo: true, repeat: 2 });
}

const FX = (() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const NAMES = { h: 'Zonda', v: 'Zonda', c: 'Cóndor', o: 'Volcán', b: '¡La Llave!' };
  const layer = () => $('fx');
  function cell(r, c) {
    const cv = document.querySelector('#board canvas');
    const rc = cv.getBoundingClientRect(), ar = app.getBoundingClientRect();
    const w = rc.width / COLS, h = rc.height / ROWS;
    return { x: rc.left - ar.left + (c + 0.5) * w, y: rc.top - ar.top + (r + 0.5) * h, size: w, board: rc, app: ar };
  }
  function make(tag, cls, x, y, w, h, src) {
    const e = document.createElement(tag);
    e.className = cls;
    if (src) { e.src = src; e.alt = ''; }
    Object.assign(e.style, { left: `${x - w / 2}px`, top: `${y - h / 2}px`, width: `${w}px`, height: `${h}px` });
    layer().appendChild(e);
    return e;
  }
  const run = (e, frames, opts) => e.animate(frames, { fill: 'forwards', ...opts }).finished.catch(() => {}).then(() => e.remove());
  function glow(x, y, size, kind, dur) {
