  }
  function shake(power) {
    const el = $('game'), d = power || 8;
    el.animate([{ transform: 'translate(0,0)' }, { transform: `translate(${-d}px,${d / 2}px)` }, { transform: `translate(${d}px,${-d / 2}px)` }, { transform: `translate(${-d / 2}px,${-d}px)` }, { transform: `translate(${d / 2}px,${d / 2}px)` }, { transform: 'translate(0,0)' }], { duration: 380, easing: 'ease-out' });
  }
  return {
    get on() { return !reduce && !!document.querySelector('#board canvas'); },
    // booster recién armado: zoom grande que se sale del tablero y vuelve a su casilla
    born(r, c, s) {
      const p = cell(r, c), size = p.size * 1.15;
      glow(p.x, p.y, p.size * 4.2, s === 'o' ? 'hot' : s === 'c' ? 'cool' : '', 800);
      const im = make('img', 'fx-img', p.x, p.y, size, size, SPECIAL_IMG[s]);
      const rot = s === 'v' ? 90 : 0;
      run(im, [
        { transform: `scale(.3) rotate(${rot - 25}deg)`, opacity: 0, easing: 'cubic-bezier(.2,1.4,.4,1)' },
        { transform: `scale(3.2) rotate(${rot + 8}deg)`, opacity: 1, offset: 0.28, easing: 'ease-in-out' },
        { transform: `scale(2.9) rotate(${rot - 5}deg)`, opacity: 1, offset: 0.62, easing: 'cubic-bezier(.6,0,.4,1)' },
        { transform: `scale(1) rotate(${rot}deg)`, opacity: 1, offset: 0.92 },
        { transform: `scale(1) rotate(${rot}deg)`, opacity: 0 },
      ], { duration: 1050, easing: 'linear' });
      const lbl = make('div', 'fx-label', p.x, Math.max(40, p.y - p.size * 1.9), 0, 0);
      lbl.textContent = NAMES[s] || '';
      run(lbl, [{ transform: 'translate(-50%,-30%) scale(.6)', opacity: 0 }, { transform: 'translate(-50%,-50%) scale(1.1)', opacity: 1, offset: 0.3 }, { transform: 'translate(-50%,-60%) scale(1)', opacity: 1, offset: 0.75 }, { transform: 'translate(-50%,-80%) scale(1)', opacity: 0 }], { duration: 1000, easing: 'ease-out' });
    },
    // ráfaga de Zonda que cruza toda la pantalla
    gust(r, c, vertical) {
      const p = cell(r, c), size = p.size * 2.6;
      const W = p.app.width, H = p.app.height;
      for (const dir of [-1, 1]) {
        const im = make('img', 'fx-img', p.x, p.y, size, size, SPECIAL_IMG.h);
        const dist = vertical ? (dir < 0 ? -(p.y + size) : H - p.y + size) : (dir < 0 ? -(p.x + size) : W - p.x + size);
        const rot = vertical ? 90 : 0, flip = dir < 0 && !vertical ? -1 : 1;
        const t = (d) => (vertical ? `translateY(${d}px)` : `translateX(${d}px)`);
        run(im, [{ transform: `${t(0)} rotate(${rot}deg) scale(${0.5 * flip},.5)`, opacity: 0.2 }, { transform: `${t(dist * 0.3)} rotate(${rot}deg) scale(${1.2 * flip},1.2)`, opacity: 1, offset: 0.3 }, { transform: `${t(dist)} rotate(${rot}deg) scale(${1.5 * flip},1.5)`, opacity: 0.9 }], { duration: 520, easing: 'cubic-bezier(.4,0,.6,1)' });
      }
      glow(p.x, p.y, p.size * 3, '', 500);
    },
    // Volcán: erupción grande, chispas y temblor de toda la pantalla
    volcano(r, c, big) {
      const p = cell(r, c), size = p.size * (big ? 1.6 : 1.2);
      const fl = document.createElement('div');
      fl.className = 'fx-flash';
      fl.style.background = `radial-gradient(circle at ${p.x}px ${p.y}px, rgba(255,230,160,.85), rgba(255,120,40,.45) ${big ? 260 : 170}px, rgba(255,80,0,0) ${big ? 520 : 360}px)`;
      layer().appendChild(fl);
      run(fl, [{ opacity: 0 }, { opacity: 1, offset: 0.15 }, { opacity: 0 }], { duration: 700, easing: 'ease-out' });
      const im = make('img', 'fx-img', p.x, p.y, size, size, SPECIAL_IMG.o);
      run(im, [{ transform: 'scale(.6)', opacity: 1 }, { transform: 'scale(2.9) translateY(-8%)', opacity: 1, offset: 0.35 }, { transform: 'scale(3.3) translateY(-10%)', opacity: 0 }], { duration: 650, easing: 'ease-out' });
      const n = big ? 22 : 14;
      for (let i = 0; i < n; i++) {
        const a = (Math.PI * 2 * i) / n + Math.random() * 0.4, d = p.size * (2.2 + Math.random() * (big ? 3.5 : 2.2)), es = p.size * (0.25 + Math.random() * 0.3);
        const e = make('div', 'fx-ember', p.x, p.y, es, es);
        run(e, [{ transform: 'translate(0,0) scale(1)', opacity: 1 }, { transform: `translate(${Math.cos(a) * d}px,${Math.sin(a) * d - p.size}px) scale(.4)`, opacity: 0 }], { duration: 600 + Math.random() * 400, easing: 'cubic-bezier(.1,.7,.4,1)' });
      }
      shake(big ? 14 : 9);
    },
    // Llave: aparece enorme, gira y suelta rayos dorados
    key(r, c, all) {
      const p = cell(r, c), cx = all ? p.board.left - p.app.left + p.board.width / 2 : p.x, cy = all ? p.board.top - p.app.top + p.board.height / 2 : p.y;
      const rays = make('div', 'fx-rays', cx, cy, p.size * 6, p.size * 6);
      run(rays, [{ transform: 'scale(.2) rotate(0deg)', opacity: 0 }, { transform: 'scale(1) rotate(60deg)', opacity: 1, offset: 0.35 }, { transform: 'scale(1.4) rotate(160deg)', opacity: 0 }], { duration: 1000, easing: 'ease-out' });
      glow(cx, cy, p.size * 4.5, '', 900);
      const im = make('img', 'fx-img', cx, cy, p.size * 1.2, p.size * 1.2, SPECIAL_IMG.b);
      const dx = cx - p.x, dy = cy - p.y;
      run(im, [{ transform: `translate(${-dx}px,${-dy}px) scale(.6) rotate(-30deg)`, opacity: 1 }, { transform: 'translate(0,0) scale(3) rotate(200deg)', opacity: 1, offset: 0.45 }, { transform: 'translate(0,0) scale(3.2) rotate(360deg)', opacity: 1, offset: 0.75 }, { transform: 'translate(0,0) scale(4) rotate(380deg)', opacity: 0 }], { duration: 1000, easing: 'cubic-bezier(.3,.7,.3,1)' });
      if (all) shake(12);
    },
    // Cóndor: despega enorme, se sale de la pantalla y baja en picada sobre la ficha
    condor(from, to, carry) {
      const a = cell(from[0], from[1]), b = cell(to[0], to[1]);
      const size = a.size * 3.4;
      const wrap = make('div', 'fx-condor', a.x, a.y, size, size);
      wrap.innerHTML = `<img src="${SPECIAL_IMG.c}" alt="">${carry ? `<img class="carry" src="${SPECIAL_IMG[carry]}" alt="">` : ''}`;
      const left = b.x < a.x, flip = left ? -1 : 1;
      const apexX = (a.x + b.x) / 2 + flip * a.size * 1.5, apexY = -size * 0.35;
      const dx1 = apexX - a.x, dy1 = apexY - a.y, dx2 = b.x - a.x, dy2 = b.y - a.y;
      glow(a.x, a.y, a.size * 3.2, 'cool', 600);
      return wrap.animate([
        { transform: `translate(0,0) scale(${0.35 * flip},.35) rotate(0deg)`, opacity: 0.6, easing: 'ease-out' },
        { transform: `translate(${dx1 * 0.4}px,${dy1 * 0.55}px) scale(${1.2 * flip},1.2) rotate(${-14 * flip}deg)`, opacity: 1, offset: 0.25, easing: 'ease-in-out' },
        { transform: `translate(${dx1}px,${dy1}px) scale(${1.5 * flip},1.5) rotate(${-6 * flip}deg)`, opacity: 1, offset: 0.5, easing: 'ease-in' },
        { transform: `translate(${dx2}px,${dy2 - a.size}px) scale(${1.05 * flip},1.05) rotate(${28 * flip}deg)`, opacity: 1, offset: 0.86, easing: 'ease-out' },
        { transform: `translate(${dx2}px,${dy2}px) scale(${0.6 * flip},.6) rotate(${36 * flip}deg)`, opacity: 0 },
      ], { duration: 1150, easing: 'linear', fill: 'forwards' }).finished.catch(() => {}).then(() => { wrap.remove(); glow(b.x, b.y, b.size * 2.6, 'cool', 450); });
    },
    shake,
  };
})();

/* ===== Tablero (Phaser) ===== */
const CELL = 96;
let resolveBoard;
const boardReady = new Promise((r) => (resolveBoard = r));

class BoardScene extends Phaser.Scene {
  constructor() { super('board'); }
  create() {
    for (const s of ['h', 'v', 'c', 'o', 'b']) this.makeTex(null, -1, s);
    const gfx = this.add.graphics();
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      gfx.fillStyle(0xfff3dc, (r + c) % 2 ? 0.10 : 0.17);
      gfx.fillRoundedRect(c * CELL + 4, r * CELL + 4, CELL - 8, CELL - 8, 14);
    }
    this.floorG = this.add.graphics().setDepth(1);
    this.sel = this.add.graphics().setDepth(5);
    this.fx = this.add.graphics().setDepth(6);
    const it = this.textures.createCanvas('item', 128, 128);
    const ic = it.getContext(); ic.shadowColor = 'rgba(0,0,0,.45)'; ic.shadowBlur = 8; ic.shadowOffsetY = 5;
    if (IMG['img/ui_cofre.png']) ic.drawImage(IMG['img/ui_cofre.png'], 8, 6, 112, 112);
    it.refresh();
    this.sprites = [];
    this.set = 'finca';
    this.tool = null;
    this.input.on('pointerdown', (p) => this.onDown(p));
    this.input.on('pointermove', (p) => this.onMove(p));
    this.input.on('pointerup', (p) => this.onUp(p));
    resolveBoard(this);
  }
  texKey(set, t, s) { return s ? `sp_${['h', 'v', 'c', 'o', 'b'].includes(s) ? s : 'o'}` : `p_${set}_${t}`; }
  key(p) {
    if (p.t === ROCK) { const k = `rock_${this.lv.rskin}_${p.hp}`; if (!this.textures.exists(k)) { const tx = this.textures.createCanvas(k, 128, 128); drawRock(tx.getContext(), this.lv.rskin, p.hp); tx.refresh(); } return k; }
    if (p.t === ITEM) return 'item';
    return this.texKey(this.set, p.t, p.s);
  }
  drawFloor() {
    const g = this.floorG; g.clear();
    if (!this.floor) return;
    const f = FLOOR_SKIN[this.lv.fskin] || FLOOR_SKIN.tierra;
    const col = parseInt(f.color.slice(1), 16), dot = parseInt(f.dot.slice(1), 16);
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const n = this.floor[r][c];
      if (!n) continue;
      g.fillStyle(col, n > 1 ? 1 : 0.88); g.fillRoundedRect(c * CELL + 3, r * CELL + 3, CELL - 6, CELL - 6, 14);
      g.fillStyle(dot, 0.7);
      for (let i = 0; i < 4; i++) g.fillCircle(c * CELL + 18 + ((r * 7 + c * 13 + i * 23) % 60), r * CELL + 18 + ((r * 11 + c * 5 + i * 31) % 60), 4);
      if (n > 1) { g.lineStyle(4, dot, 0.9); g.strokeRoundedRect(c * CELL + 8, r * CELL + 8, CELL - 16, CELL - 16, 10); }
    }
  }
  itemsOn() { let n = 0; for (const row of this.g) for (const p of row) if (p && p.t === ITEM) n++; return n; }
  dropGoal() { return this.state.goals.find((g) => g.t === 'drop'); }
  spawnItems() {
    const lv = this.lv, dg = this.dropGoal();
    if (!lv.drop || !dg) return;
    let on = this.itemsOn(), need = lv.drop.n - dg.got - on;
    while (need > 0 && on < (lv.drop.max || 2)) {
      const cols = [...Array(COLS).keys()].filter((c) => this.g[0][c] && this.g[0][c].t >= 0 && !this.g[0][c].s);
      if (!cols.length) break;
      const c = cols[Math.floor(this.rand() * cols.length)];
      this.g[0][c] = { t: ITEM };
      this.setPieceTex(0, c);
      const s = this.sprites[0][c]; if (s) this.tweens.add({ targets: s, scale: s.base * 1.3, duration: 160, yoyo: true });
      need--; on++;
    }
  }
  async collectDrops() {
    const got = collectDrops(this.g);
    if (!got.length) return false;
    Sound.chime();
    const jobs = got.map(([r, c]) => {
      const s = this.sprites[r][c]; this.sprites[r][c] = null;
      if (!s) return null;
      return this.tween({ targets: s, y: s.y - CELL * 1.5, scale: s.base * 1.6, duration: 380, ease: 'Back.easeOut' }).then(() => this.tween({ targets: s, alpha: 0, duration: 200 })).then(() => s.destroy());
    });
    toast(got.length > 1 ? '¡Cajitas a salvo!' : '¡Cajita a salvo!');
    await Promise.all(jobs);
    const dg = this.dropGoal(); if (dg) dg.got += got.length;
    this.cfg.onUpdate(this.state);
    await this.animGravity(gravity(this.g, this.rand, this.cfg.types));
    this.spawnItems();
    return true;
  }
  makeTex(set, t, s) {
    const key = this.texKey(set, t, s);
    if (this.textures.exists(key)) return;
    const tex = this.textures.createCanvas(key, 128, 128);
    drawPiece(tex.getContext(), set, t, s);
    tex.refresh();
  }
  xy(r, c) { return [c * CELL + CELL / 2, r * CELL + CELL / 2]; }
  makeSprite(r, c, p, rowOverride) {
    const [x, y] = this.xy(rowOverride === undefined ? r : rowOverride, c);
    const s = this.add.image(x, y, this.key(p)).setDisplaySize(CELL * 0.9, CELL * 0.9).setDepth(2);
    s.base = s.scaleX;
    return s;
  }
  setPieceTex(r, c) {
    const s = this.sprites[r][c];
    if (!s) return;
    s.setTexture(this.key(this.g[r][c]));
    s.setDisplaySize(CELL * 0.9, CELL * 0.9); s.base = s.scaleX;
  }
  tween(cfg) { return new Promise((res) => this.tweens.add({ ...cfg, onComplete: res })); }
  wait(ms) { return new Promise((res) => this.time.delayedCall(ms, res)); }
  ctx() {
    const open = this.state.goals.filter((g) => g.got < g.n);
    return { rand: this.rand, prefer: new Set(open.filter((g) => typeof g.t === 'number').map((g) => g.t)),
      rock: open.some((g) => g.t === 'rock'), floor: open.some((g) => g.t === 'floor') ? this.floor : null };
  }

  startLevel(cfg) {
    this.tweens.killAll();
    this.time.removeAllEvents();
    this.sprites.flat().forEach((s) => s && s.destroy());
    this.fx.clear();
    this.cfg = cfg;
    this.set = cfg.set;
    this.lv = cfg.lv;
    for (let t = 0; t < 6; t++) this.makeTex(this.set, t, null);
    this.state = { moves: cfg.moves, goals: cfg.goals };
    this.rand = Math.random;
    for (let tries = 0; tries < 40; tries++) {
      this.g = newGrid(this.rand, cfg.types);
      this.floor = setupObstacles(this.g, this.lv, this.rand);
      if (findMove(this.g)) break;
    }
    if (cfg.pre && cfg.pre.length) placeSpecials(this.g, cfg.pre, this.rand);
    this.drawFloor();
    this.sprites = [];
    for (let r = 0; r < ROWS; r++) {
      this.sprites.push([]);
      for (let c = 0; c < COLS; c++) {
        const s = this.makeSprite(r, c, this.g[r][c], r - ROWS - 1);
        this.sprites[r].push(s);
        this.tweens.add({ targets: s, y: this.xy(r, c)[1], duration: 380 + r * 40, ease: 'Bounce.easeOut', delay: c * 30 });
      }
    }
    this.busy = true; this.ended = false; this.selected = null; this.down = null; this.movesUsed = 0;
    this.tool = null; this.gloveFirst = null;
    this.time.delayedCall(950, () => { this.busy = false; });
    this.drawSel();
    cfg.onUpdate(this.state);
    this.armHint();
  }

  setTool(k) {
    this.tool = k; this.gloveFirst = null; this.selected = null;
    this.drawSel();
    this.cfg.onTool(k);
  }
  addMoves(n) {
    this.state.moves += n; this.ended = false; this.busy = false;
    this.cfg.onUpdate(this.state);
    toast(`+${n} jugadas`);
    this.armHint();
  }

  cellAt(p) {
    const c = Math.floor(p.x / CELL), r = Math.floor(p.y / CELL);
    return r >= 0 && r < ROWS && c >= 0 && c < COLS ? [r, c] : null;
  }
  onDown(p) {
    if (this.busy || this.ended || !this.g) return;
    const cell = this.cellAt(p);
    if (!cell) return;
    this.down = { cell, x: p.x, y: p.y, moved: false };
  }
  onMove(p) {
    if (!this.down || this.down.moved || this.busy || this.tool) return;
    const dx = p.x - this.down.x, dy = p.y - this.down.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < CELL * 0.33) return;
    this.down.moved = true;
    const [r, c] = this.down.cell;
    const t = Math.abs(dx) > Math.abs(dy) ? [r, c + Math.sign(dx)] : [r + Math.sign(dy), c];
    this.down = null;
    if (t[0] < 0 || t[0] >= ROWS || t[1] < 0 || t[1] >= COLS) return;
    this.selected = null; this.drawSel();
    this.trySwap([r, c], t);
  }
  onUp() {
    if (!this.down) return;
    const cell = this.down.cell;
    this.down = null;
    if (this.busy || this.ended) return;
    const adj = (a, b) => a && Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]) === 1;
    if (this.tool === 'pala') { if (this.g[cell[0]][cell[1]].t === ITEM) { shakeSprite(this, cell); return; } this.applyTool([cell]); return; }
    if (this.tool === 'tijera') { this.applyTool(Array.from({ length: COLS }, (_, i) => [cell[0], i])); return; }
    if (this.tool === 'guante') {
      if (!movable(this.g[cell[0]][cell[1]])) { shakeSprite(this, cell); return; }
      if (adj(this.gloveFirst, cell)) { this.applyGlove(this.gloveFirst, cell); return; }
      this.gloveFirst = cell; Sound.tick(); this.drawSel(); return;
    }
    if (adj(this.selected, cell)) {
      const a = this.selected; this.selected = null; this.drawSel(); this.trySwap(a, cell);
      return;
    }
    if (this.g[cell[0]][cell[1]].s) { this.selected = null; this.drawSel(); this.tapSpecial(cell); return; }
    this.selected = this.selected && this.selected[0] === cell[0] && this.selected[1] === cell[1] ? null : cell;
    if (this.selected) Sound.tick();
    this.drawSel();
  }
  drawSel() {
    this.sel.clear();
    const cell = this.tool === 'guante' ? this.gloveFirst : this.selected;
    if (!cell) return;
    const [r, c] = cell;
    this.sel.lineStyle(6, 0xf2b632, 1);
    this.sel.strokeRoundedRect(c * CELL + 4, r * CELL + 4, CELL - 8, CELL - 8, 14);
  }
  armHint() {
    if (this.hintTimer) this.hintTimer.remove();
    this.hintTimer = this.time.delayedCall(6000, () => {
      if (this.busy || this.ended || this.tool) return;
      const m = findMove(this.g);
      if (!m) return;
      m.forEach(([r, c]) => { const s = this.sprites[r][c]; if (s) this.tweens.add({ targets: s, angle: { from: -10, to: 10 }, duration: 110, yoyo: true, repeat: 3, onComplete: () => s.setAngle(0) }); });
      this.armHint();
    });
  }

  async animSwap(a, b) {
    const sa = this.sprites[a[0]][a[1]], sb = this.sprites[b[0]][b[1]];
    const [ax, ay] = this.xy(...a), [bx, by] = this.xy(...b);
    await Promise.all([
      this.tween({ targets: sa, x: bx, y: by, duration: 150, ease: 'Quad.easeInOut' }),
      this.tween({ targets: sb, x: ax, y: ay, duration: 150, ease: 'Quad.easeInOut' }),
    ]);
    this.sprites[a[0]][a[1]] = sb; this.sprites[b[0]][b[1]] = sa;
  }

  useMove() { this.state.moves--; this.movesUsed++; this.cfg.onUpdate(this.state); }

  async trySwap(a, b) {
    if (this.busy || this.ended) return;
    if (!movable(this.g[a[0]][a[1]]) || !movable(this.g[b[0]][b[1]])) { Sound.bad(); shakeSprite(this, movable(this.g[a[0]][a[1]]) ? b : a); return; }
    this.busy = true;
    if (this.hintTimer) this.hintTimer.remove();
    Sound.swap();
    await this.animSwap(a, b);
    swapCells(this.g, a, b);
    const pa = this.g[a[0]][a[1]], pb = this.g[b[0]][b[1]];
    let res = null;
    if (pa.s || pb.s) res = activateSwap(this.g, a, b, this.ctx());
    else if (!hasMatch(this.g)) {
      Sound.bad();
      await this.animSwap(a, b);
      swapCells(this.g, a, b);
      this.busy = false; this.armHint();
      return;
    }
    this.useMove();
    await this.cascade(res, [a, b]);
    await this.afterMove();
  }

  async tapSpecial(cell) {
    if (this.busy || this.ended) return;
    this.busy = true;
    if (this.hintTimer) this.hintTimer.remove();
    this.useMove();
    await this.cascade(activateAt(this.g, [cell], this.ctx()), null);
    await this.afterMove();
  }

  async applyTool(cells) {
    if (this.busy || this.ended) return;
    this.busy = true;
    if (this.hintTimer) this.hintTimer.remove();
    const k = this.tool;
    this.setTool(null);
    this.cfg.onToolUsed(k);
    Sound.swap();
    const res = activateAt(this.g, cells, this.ctx());
    if (k === 'tijera') res.triggered.push({ r: cells[0][0], c: 3, s: 'h' });
    await this.cascade(res, null);
    await this.afterMove();
  }

  async applyGlove(a, b) {
    if (this.busy || this.ended) return;
    this.busy = true;
    if (this.hintTimer) this.hintTimer.remove();
    this.setTool(null);
    this.cfg.onToolUsed('guante');
    Sound.swap();
    await this.animSwap(a, b);
    swapCells(this.g, a, b);
    await this.cascade(null, [a, b]);
    await this.afterMove();
  }

  async cascade(res, swapPos) {
    let combo = 0, first = true;
    while (true) {
      if (!res) res = resolveStep(this.g, first ? swapPos : null, this.ctx());
      first = false;
      if (!res) { if (await this.collectDrops()) continue; break; }
      combo++;
      const out = applyClear(this.g, res, this.floor);
      await this.animClear(res, combo, out);
      this.state.goals.forEach((g) => { g.got += out.got[g.t] || 0; });
      if (out.floorHit.length) this.drawFloor();
      this.cfg.onUpdate(this.state);
      await this.animGravity(gravity(this.g, this.rand, this.cfg.types));
      this.spawnItems();
      res = null;
    }
    if (combo >= 2) this.cfg.onCombo(combo);
  }

  async afterMove() {
    const won = this.state.goals.every((g) => g.got >= g.n);
    if (won) {
      this.ended = true; this.busy = false;
      const left = this.state.moves;
      toast('¡Lo lograste!');
      await this.wait(700);
      await this.finalRush();
      this.cfg.onEnd(true, { left });
      return;
    }
    if (this.state.moves <= 0) {
      this.ended = true; this.busy = false;
      await this.wait(500);
      this.cfg.onEnd(false);
      return;
    }
    if (!findMove(this.g)) {
      reshuffle(this.g, this.rand);
      await this.redraw();
    }
    this.busy = false;
    this.armHint();
  }

  // Jugadas que sobran: se vuelven Zondas que barren el tablero
  async finalRush() {
    const n = Math.min(this.state.moves, 10);
    if (n <= 0) return;
    toast('¡Jugadas extra!');
    this.rushing = true;
    const placed = placeSpecials(this.g, Array(n).fill('zonda'), this.rand);
    for (const o of placed) {
      this.setPieceTex(o.r, o.c);
      const s = this.sprites[o.r][o.c];
      if (s) this.tweens.add({ targets: s, scale: s.base * 1.3, duration: 120, yoyo: true });
      this.state.moves--; this.cfg.onUpdate(this.state);
      Sound.tick();
      await this.wait(90);
    }
    this.state.moves = 0; this.cfg.onUpdate(this.state);
    await this.wait(250);
    await this.cascade(activateAt(this.g, placed.map((o) => [o.r, o.c]), this.ctx()), null);
    this.rushing = false;
  }

  blast(t) {
    const g = this.fx, W = COLS * CELL, H = ROWS * CELL;
    const row = (r) => { if (r >= 0 && r < ROWS) { g.fillStyle(0xfff3c8, 0.8); g.fillRoundedRect(0, r * CELL + CELL * 0.28, W, CELL * 0.44, 14); } };
    const col = (c) => { if (c >= 0 && c < COLS) { g.fillStyle(0xfff3c8, 0.8); g.fillRoundedRect(c * CELL + CELL * 0.28, 0, CELL * 0.44, H, 14); } };
    const [x, y] = this.xy(t.r, t.c);
    const big = FX.on && this.bigFx > 0;
    if (big && t.s !== 'b') this.bigFx--;
    const wind = (v) => (big ? FX.gust(t.r, t.c, v) : this.windFly(x, y, v));
    if (t.s === 'h') { row(t.r); wind(0); }
    else if (t.s === 'v') { col(t.c); wind(1); }
    else if (t.s === 'x') { row(t.r); col(t.c); wind(0); wind(1); }
    else if (t.s === 'xo') { for (let d = -1; d <= 1; d++) { row(t.r + d); col(t.c + d); } wind(0); wind(1); if (big) FX.volcano(t.r, t.c, false); else this.cameras.main.shake(220, 0.01); }
    else if (t.s === 'o' || t.s === 'o2') {
      const R = (t.s === 'o' ? 2.6 : 3.8) * CELL;
      g.fillStyle(0xff8a2a, 0.45); g.fillCircle(x, y, R);
      g.fillStyle(0xffd27a, 0.6); g.fillCircle(x, y, R * 0.55);
      if (big) FX.volcano(t.r, t.c, t.s === 'o2'); else this.cameras.main.shake(260, t.s === 'o' ? 0.012 : 0.02);
    } else if (t.s === 'all') { g.fillStyle(0xf2b632, 0.45); g.fillRect(0, 0, W, H); if (big) FX.key(t.r, t.c, true); else this.cameras.main.shake(300, 0.015); }
    else if (t.s === 'b' && FX.on) FX.key(t.r, t.c, false);
  }
  windFly(x, y, vertical) {
    const W = COLS * CELL, H = ROWS * CELL;
    for (const dir of [-1, 1]) {
      const s = this.add.image(x, y, 'sp_h').setDisplaySize(CELL * 1.1, CELL * 1.1).setDepth(7).setAngle(vertical ? 90 : 0);
      const to = vertical ? { y: dir < 0 ? -CELL : H + CELL } : { x: dir < 0 ? -CELL : W + CELL };
      this.tweens.add({ targets: s, ...to, duration: 380, ease: 'Quad.easeIn', onComplete: () => s.destroy() });
    }
  }
  flyCondor(f) {
    if (FX.on) return FX.condor(f.from, f.to, f.carry).then(() => { if (f.carry) this.blast({ r: f.to[0], c: f.to[1], s: f.carry }); });
    const [fx, fy] = this.xy(...f.from), [tx, ty] = this.xy(...f.to);
    const s = this.add.image(fx, fy, 'sp_c').setDisplaySize(CELL * 1.25, CELL * 1.25).setDepth(8);
    s.setFlipX(tx < fx);
    const base = s.scaleX;
    let carry = null;
    if (f.carry) carry = this.add.image(fx, fy + CELL * 0.35, `sp_${f.carry}`).setDisplaySize(CELL * 0.6, CELL * 0.6).setDepth(7);
    const dur = 360 + Math.hypot(tx - fx, ty - fy) * 0.35;
    this.tweens.add({ targets: s, scale: base * 1.35, duration: dur / 2, yoyo: true });
    if (carry) this.tweens.add({ targets: carry, x: tx, y: ty + CELL * 0.35, duration: dur, ease: 'Sine.easeInOut', onComplete: () => carry.destroy() });
    return this.tween({ targets: s, x: tx, y: ty, duration: dur, ease: 'Sine.easeInOut' }).then(() => {
      if (f.carry) this.blast({ r: f.to[0], c: f.to[1], s: f.carry });
      this.tweens.add({ targets: s, alpha: 0, duration: 160, onComplete: () => s.destroy() });
    });
  }
  drawBeams(beams) {
    const g = this.fx;
    for (const b of beams) {
      const [x0, y0] = this.xy(...b.from);
      g.lineStyle(6, 0xffd65a, 0.9);
      for (const t of b.to) { const [x1, y1] = this.xy(...t); g.lineBetween(x0, y0, x1, y1); }
      g.fillStyle(0xfff3c8, 0.9);
      for (const t of b.to) { const [x1, y1] = this.xy(...t); g.fillCircle(x1, y1, CELL * 0.32); }
    }
  }

  async animClear(res, combo, out) {
    Sound.pop(combo);
    const trig = res.triggered.map((t) => t.s);
    if (trig.some((s) => ['o', 'o2', 'xo', 'all'].includes(s))) Sound.boom();
    if (trig.some((s) => ['h', 'v', 'x', 'xo'].includes(s))) Sound.wind();
    if (res.flights.length) Sound.whoosh();
    if (res.beams.length || trig.includes('all')) Sound.bomb();
    if (res.created.length) Sound.special();
    if (res.converted.length) {
      for (const o of res.converted) {
        const s = this.sprites[o.r][o.c];
        if (s) { s.setTexture(this.texKey(null, -1, o.s)); s.setDisplaySize(CELL * 0.9, CELL * 0.9); s.base = s.scaleX; }
        if (s) this.tweens.add({ targets: s, scale: s.base * 1.3, duration: 140, yoyo: true });
      }
      this.drawBeams(res.beams);
      this.tweens.add({ targets: this.fx, alpha: { from: 1, to: 0 }, duration: 500, onComplete: () => { this.fx.clear(); this.fx.setAlpha(1); } });
      await this.wait(520);
    }
    this.fx.clear(); this.fx.setAlpha(1);
    this.bigFx = res.triggered.length > 6 ? 3 : 6;
    const keyTrig = res.triggered.find((t) => t.s === 'b' || t.s === 'all');
    if (keyTrig && FX.on) { this.blast(keyTrig); await this.wait(420); }
    if (!res.converted.length) this.drawBeams(res.beams);
    res.triggered.forEach((t) => { if (t !== keyTrig && t.s !== 'c' && t.s !== 'c3') this.blast(t); });
    this.tweens.add({ targets: this.fx, alpha: { from: 1, to: 0 }, duration: 420, onComplete: () => { this.fx.clear(); this.fx.setAlpha(1); } });
    if (res.flights.length) await Promise.all(res.flights.map((f) => this.flyCondor(f)));
    const jobs = [];
    for (const k of out.damaged) {
      const [r, c] = RC(k);
      this.setPieceTex(r, c);
      shakeSprite(this, [r, c]);
    }
    if (out.damaged.length || out.got.rock) Sound.bad();
    for (const k of out.removed) {
      const [r, c] = RC(k);
      const s = this.sprites[r][c];
      this.sprites[r][c] = null;
      if (!s) continue;
      jobs.push(this.tween({ targets: s, scale: s.base * 1.25, duration: 70 }).then(() => this.tween({ targets: s, scale: 0, alpha: 0, duration: 140, ease: 'Back.easeIn' })).then(() => s.destroy()));
    }
    for (const o of res.created) {
      const s = this.sprites[o.r][o.c];
      if (!s) continue;
      s.setTexture(this.key(o.piece));
      s.setDisplaySize(CELL * 0.9, CELL * 0.9); s.base = s.scaleX;
      jobs.push(this.tween({ targets: s, scale: s.base * 1.3, duration: 140, yoyo: true }));
    }
    await Promise.all(jobs);
    if (res.created.length && FX.on && !this.rushing) {
      res.created.slice(0, 2).forEach((o) => FX.born(o.r, o.c, o.piece.s));
      await this.wait(560);
    }
  }

  async animGravity(grav) {
    const jobs = [];
    const moved = grav.moves.map((m) => ({ ...m, s: this.sprites[m.from[0]][m.from[1]] }));
    moved.forEach((m) => { this.sprites[m.from[0]][m.from[1]] = null; });
    moved.forEach((m) => {
      this.sprites[m.to[0]][m.to[1]] = m.s;
      if (!m.s) return;
      const d = m.to[0] - m.from[0];
      jobs.push(this.tween({ targets: m.s, y: this.xy(...m.to)[1], duration: 90 + d * 55, ease: 'Quad.easeIn' }));
    });
    grav.spawns.forEach((sp) => {
      const s = this.makeSprite(sp.r, sp.c, this.g[sp.r][sp.c], sp.fromRow);
      this.sprites[sp.r][sp.c] = s;
      const d = sp.r - sp.fromRow;
      jobs.push(this.tween({ targets: s, y: this.xy(sp.r, sp.c)[1], duration: 90 + d * 55, ease: 'Quad.easeIn' }));
    });
    await Promise.all(jobs);
  }

  async redraw() {
    this.sprites.flat().forEach((s) => s && s.destroy());
    this.sprites = [];
    for (let r = 0; r < ROWS; r++) {
      this.sprites.push([]);
      for (let c = 0; c < COLS; c++) { const s = this.makeSprite(r, c, this.g[r][c]); s.setScale(0); this.sprites[r].push(s); this.tweens.add({ targets: s, scale: s.base, duration: 260, delay: (r + c) * 15 }); }
    }
    toast('Mezclando');
    await this.wait(320);
  }
}

let game;
imagesReady.then(() => {
  game = new Phaser.Game({
    type: Phaser.AUTO,
    parent: 'board',
    transparent: true,
    audio: { noAudio: true },
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH, width: COLS * CELL, height: ROWS * CELL },
    scene: BoardScene,
    banner: false,
  });
});

/* ===== Botones ===== */
$('btn-play').addEventListener('click', () => { Sound.unlock(); Sound.music('game'); Sound.tick(); renderMap(); });
$('btn-back').addEventListener('click', async () => {
  Sound.tick();
  const sc = await boardReady;
  if (sc.movesUsed > 0 && !sc.ended) {
    const v = await modal('<span class="kicker">¿Salir del nivel?</span><div class="icon small"><img src="img/ui_corazon.png" alt=""></div><h3>Vas a perder una vida</h3><p>Si salís ahora, el nivel cuenta como perdido.</p>', [['Seguir jugando', 'stay'], ['Salir', 'leave', 1]]);
    if (v !== 'leave') return;
    loseLife();
  }
  sc.ended = true; sc.setTool(null);
  app.classList.remove('memory');
  renderMap();
});
document.querySelectorAll('[data-shop]').forEach((b) => b.addEventListener('click', openShop));
$('btn-shop-close').addEventListener('click', () => { Sound.tick(); renderMap(); });
$('btn-daily').addEventListener('click', () => { Sound.tick(); openDaily(); });
document.querySelectorAll('.tool').forEach((b) => b.addEventListener('click', () => onToolButton(b.dataset.tool)));
$('btn-more').addEventListener('click', openMore);
$('btn-bag').addEventListener('click', openBag);
document.querySelectorAll('.snd').forEach((b) => b.addEventListener('click', () => { Sound.unlock(); Sound.toggle(); if (!Sound.muted) Sound.music('game'); syncSoundButtons(); }));
syncSoundButtons();
setInterval(refreshStats, 1000);

/* ===== Instalar como app ===== */
let installPrompt = null;
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function updateInstall() { const showIt = !standalone() && (!!installPrompt || isIOS); document.querySelectorAll('.install').forEach((b) => { b.hidden = !showIt; }); }
addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installPrompt = e; updateInstall(); });
addEventListener('appinstalled', () => { installPrompt = null; updateInstall(); });
document.querySelectorAll('.install').forEach((b) => b.addEventListener('click', async () => {
  Sound.tick();
  if (installPrompt) {
    installPrompt.prompt();
    try { await installPrompt.userChoice; } catch (e) {}
    installPrompt = null; updateInstall();
  } else if (isIOS) {
    await modal('<span class="kicker">Instalar en iPhone</span><h3>Agregalo a tu inicio</h3><p>Tocá el botón Compartir de Safari (el cuadrado con la flecha para arriba) y elegí "Agregar a inicio".</p>', [['Entendido', 1]]);
  }
}));
updateInstall();
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));

refreshStats();
openTitle();
</script>
