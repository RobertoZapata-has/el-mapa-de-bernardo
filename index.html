<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b120d">
<meta name="description" content="Un juego de combinar fichas por los lugares de Mendoza, con la historia del abuelo Bernardo.">
<title>El mapa de Bernardo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mapa de Bernardo">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Figtree:wght@400;600;700;800&family=Caveat:wght@500;700&display=swap">
<style>
/* Base: márgenes seguros del celular */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: app de una pantalla; fondo = el lugar (se "despierta" con el progreso), arriba HUD, abajo tablero; diálogos como hoja inferior */
:root{
  color-scheme:dark;
  --ink:#2a1a12; --cream:#fff6e6; --cream-dim:#e9dcc6; --malbec:#8c2346; --malbec-deep:#5e1430;
  --gold:#f2b632; --glass:rgba(32,20,14,.62); --glass-strong:rgba(28,16,10,.86); --line:rgba(255,236,200,.28);
  --memory:#c9965a; --ok:#5fcf86;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  --paper:#f3e3c3; --paper-ink:#3b2a1c;
}
html,body{height:100%;overflow:hidden}
body{background:#1b120d;color:var(--cream);font-family:var(--body);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font-family:var(--body);cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{position:relative;height:100%;overflow:hidden}
#bg{position:absolute;inset:0;background:#1b120d center/cover no-repeat;transition:filter .7s ease, background-image .3s;filter:saturate(.3) brightness(.78)}
#app.memory #bg{filter:sepia(.75) saturate(.6) brightness(.85)!important}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.screen.off{visibility:hidden;pointer-events:none}

/* Portada */
#title{justify-content:flex-end;background:linear-gradient(to top,rgba(20,10,6,.92) 0%,rgba(20,10,6,.55) 32%,rgba(20,10,6,0) 58%)}
.title-inner{padding-inline:20px;padding-block:0 34px;display:flex;flex-direction:column;gap:12px;max-width:520px;margin:0 auto;width:100%;box-sizing:border-box}
.kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:800}
h1{font-family:var(--display);font-weight:400;font-size:clamp(44px,13vw,64px);line-height:.95;margin:0;color:var(--cream);text-shadow:0 4px 0 var(--malbec-deep),0 8px 24px rgba(0,0,0,.5);text-wrap:balance}
.title-inner p{margin:0;font-size:17px;color:var(--cream-dim);max-width:34ch}
.btn{appearance:none;border:0;border-radius:16px;font-weight:800;font-size:18px;padding:15px 22px;min-height:54px;color:var(--cream);background:var(--malbec);box-shadow:0 4px 0 var(--malbec-deep),inset 0 0 0 2px rgba(242,182,50,.55)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--malbec-deep),inset 0 0 0 2px rgba(242,182,50,.55)}
.btn.ghost{background:rgba(255,246,230,.12);box-shadow:inset 0 0 0 2px var(--line)}
.proto{font-size:13px;color:var(--cream-dim);opacity:.8}

/* Mapa de capítulos */
#map{background:linear-gradient(rgba(27,18,13,.35),rgba(27,18,13,.78) 30%,rgba(27,18,13,.94) 60%),url(img/bg_mapa.jpg) center top/cover no-repeat,#1b120d;overflow:hidden}
.map-head{padding-inline:16px;padding-block:18px 10px;display:flex;flex-direction:column;gap:10px;max-width:560px;margin:0 auto;width:100%;box-sizing:border-box}
.map-head h2{font-family:var(--display);font-weight:400;font-size:34px;margin:0;text-shadow:0 3px 0 var(--malbec-deep),0 6px 16px rgba(0,0,0,.6)}
.map-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.snd{appearance:none;border:0;background:var(--glass);color:var(--cream);border-radius:12px;font-weight:700;font-size:14px;padding:10px 12px;min-height:44px;box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap}
.bag{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:rgba(30,20,14,.72);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-height:44px}
.bag-label{font-size:13px;font-weight:700;color:var(--cream-dim);margin-right:4px}
.bag-item{display:inline-flex;width:36px;height:36px}.bag-item>*{width:100%;height:100%;object-fit:contain}
.bag-empty{font-size:14px;color:var(--cream-dim)}
.chapters{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-inline:16px;padding-block:6px 30px}
.chapters-inner{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.ch{display:grid;grid-template-columns:86px 1fr;gap:12px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:rgba(30,20,14,.78);border-radius:16px;padding:8px;color:var(--cream)}
.ch.final .num{color:#f08a5a}
.ch .thumb{width:86px;height:86px;border-radius:12px;background:#000 center 18%/cover no-repeat}
.ch .meta{display:flex;flex-direction:column;gap:3px;min-width:0}
.ch .num{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.ch .name{font-family:var(--display);font-size:20px;line-height:1.1}
.ch .sub{font-size:14px;color:var(--cream-dim)}
.ch .got{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ok)}
.ch.locked{opacity:.5}
.ch.locked .thumb{filter:grayscale(1) brightness(.6)}
.ch.current{border-color:var(--gold);box-shadow:0 0 0 2px rgba(242,182,50,.35)}
.map-foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding-block:10px 4px}
.link{appearance:none;background:none;border:0;color:var(--cream-dim);font-size:14px;text-decoration:underline;padding:8px}

/* Juego */
#game{padding-inline:12px;padding-block:10px 14px;box-sizing:border-box;gap:10px}
.topbar{display:flex;align-items:center;gap:10px}
.back{appearance:none;border:0;background:var(--glass);color:var(--cream);border-radius:12px;font-weight:700;font-size:15px;padding:10px 14px;min-height:44px;box-shadow:inset 0 0 0 1px var(--line)}
.ch-title{font-family:var(--display);font-size:20px;text-shadow:0 2px 6px rgba(0,0,0,.7);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud{display:flex;gap:10px;align-items:stretch;max-width:520px;width:100%;margin:0 auto}
.moves{background:var(--malbec);border-radius:14px;padding:6px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 3px 0 var(--malbec-deep),inset 0 0 0 2px rgba(242,182,50,.5);min-width:70px}
.moves b{font-family:var(--display);font-weight:400;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.moves span{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.goals{flex:1;background:var(--glass);border-radius:14px;box-shadow:inset 0 0 0 1px var(--line);display:flex;align-items:center;justify-content:space-around;gap:6px;padding:6px 8px}
.goal{display:flex;align-items:center;gap:6px;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.goal img{width:38px;height:38px}
.goal.done{color:var(--ok)}
.spacer{flex:1;min-height:0}
#board{position:relative;width:min(100%, 460px, calc((100vh - 210px) * 0.875));width:min(100%, 460px, calc((100dvh - 210px) * 0.875));aspect-ratio:7/8;margin:0 auto;border-radius:20px;background:rgba(30,18,12,.45);box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 0 0 1.5px rgba(255,236,200,.3);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);touch-action:none;overflow:hidden}
#board canvas{display:block}
.toast{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);font-family:var(--display);font-size:30px;color:var(--cream);text-shadow:0 3px 0 var(--malbec-deep),0 6px 18px rgba(0,0,0,.6);pointer-events:none;white-space:nowrap;opacity:0}
.toast.show{animation:pop 1.1s ease forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.8)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}

/* Diálogo */
#dialog{justify-content:flex-end;background:linear-gradient(to top,rgba(15,8,5,.75),rgba(15,8,5,0) 55%);z-index:5}
.sheet{margin:0 auto 18px;width:calc(100% - 24px);max-width:540px;box-sizing:border-box;background:var(--glass-strong);border-radius:20px;box-shadow:inset 0 0 0 1.5px var(--line),0 12px 30px rgba(0,0,0,.5);padding:16px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;cursor:pointer}
.sheet.narr{grid-template-columns:1fr}
.portrait{width:84px;height:84px;border-radius:50%;background:#ddd center/cover no-repeat;box-shadow:0 0 0 3px var(--gold),0 4px 12px rgba(0,0,0,.4)}
.memory .portrait{box-shadow:0 0 0 3px var(--memory),0 4px 12px rgba(0,0,0,.4);filter:sepia(.35)}
.say{display:flex;flex-direction:column;gap:6px;min-width:0}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.who b{font-family:var(--display);font-weight:400;font-size:21px;color:var(--gold)}
.memory .who b{color:var(--memory)}
.chip{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;border-radius:6px;padding:3px 7px;background:var(--memory);color:var(--ink)}
.line{font-size:18px;line-height:1.45;margin:0}
.narr .line{font-style:italic;color:var(--cream-dim);text-align:center}
.next{font-size:13px;color:var(--cream-dim);text-align:right;grid-column:1/-1;margin-top:-4px}
.skip{position:absolute;top:12px;right:12px;appearance:none;border:0;background:var(--glass);color:var(--cream-dim);border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px;box-shadow:inset 0 0 0 1px var(--line);min-height:40px}

/* Modales */
#modal{align-items:center;justify-content:center;background:rgba(12,6,4,.62);z-index:6;padding-inline:16px}
.card{width:100%;max-width:380px;background:linear-gradient(#3a2418,#24150e);border-radius:22px;box-shadow:inset 0 0 0 2px rgba(242,182,50,.45),0 20px 40px rgba(0,0,0,.6);padding:22px 20px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.card .kicker{margin-bottom:-4px}
.card h3{font-family:var(--display);font-weight:400;font-size:28px;margin:0;text-wrap:balance}
.card p{margin:0;color:var(--cream-dim);font-size:16px;max-width:30ch}
.card .icon{width:120px;height:120px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.card .icon>*{width:100%;height:100%;object-fit:contain}
.card .icon.big{width:170px;height:170px}
.card .actions{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:4px}
/* Carta */
#letter{background:radial-gradient(ellipse at 50% 30%,rgba(60,36,22,.55),rgba(14,8,5,.92)),#1b120d;z-index:7}
#letter-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-inline:16px;padding-block:24px 40px}
.paper{max-width:520px;margin:0 auto;background:linear-gradient(170deg,#f7ead0,var(--paper) 55%,#e8d3ab);color:var(--paper-ink);border-radius:6px;box-shadow:0 18px 40px rgba(0,0,0,.6),inset 0 0 60px rgba(150,100,50,.25);padding:26px 24px 30px;position:relative;transform:rotate(-.6deg)}
.photo{width:118px;margin:-6px auto 14px;background:#fffaf0;padding:8px 8px 22px;box-shadow:0 6px 14px rgba(0,0,0,.35);transform:rotate(3deg);position:relative}
.photo img{display:block;width:100%;aspect-ratio:1;object-fit:cover;filter:sepia(.45) saturate(.85)}
.photo::after{content:"";position:absolute;top:-10px;left:50%;width:56px;height:20px;margin-left:-28px;background:rgba(240,225,180,.75);transform:rotate(-4deg)}
.to{font-family:var(--body);font-size:12px;letter-spacing:.14em;text-transform:uppercase;text-align:center;color:#8a6232;margin:0 0 12px;font-weight:700}
#letter-body p{font-family:var(--hand);font-size:24px;line-height:1.25;margin:0 0 14px;opacity:0;animation:ink .9s ease forwards}
#letter-body .salute{font-size:28px;font-weight:700}
#letter-body .motto{font-size:27px;font-weight:700;color:#7a1f3a;text-align:center;margin-block:20px}
#letter-body .sign{text-align:right;font-size:26px}
@keyframes ink{from{opacity:0;transform:translateY(6px);filter:blur(2px)}to{opacity:1;transform:none;filter:none}}
#btn-letter{display:block;margin:24px auto 0;opacity:0;animation:ink .8s ease forwards}
@media (prefers-reduced-motion:reduce){#bg{transition:none}.toast.show{animation-duration:.01s}#letter-body p,#btn-letter{animation:none;opacity:1}}
</style>
</head>
<body>
<div id="app">
  <div id="bg"></div>

  <section id="title" class="screen">
    <div class="title-inner">
      <span class="kicker">Una búsqueda del tesoro por Mendoza</span>
      <h1>El mapa de Bernardo</h1>
      <p>Dos nietos, dos mitades de un mapa y un secreto que sus abuelos escondieron hace cincuenta años.</p>
      <button class="btn" id="btn-play" type="button">Jugar</button>
      <button class="btn ghost install" type="button" hidden>Instalar en el celular</button>
      <span class="proto">Prototipo</span>
    </div>
  </section>

  <section id="map" class="screen off" aria-label="Capítulos">
    <div class="map-head">
      <div class="map-top"><h2>Mendoza</h2><button class="snd" type="button" aria-pressed="true">Sonido: sí</button></div>
      <div class="bag" id="bag"></div>
    </div>
    <div class="chapters"><div class="chapters-inner" id="chapters"></div>
      <div class="map-foot">
        <button class="link install" type="button" hidden>Instalar en el celular</button>
        <button class="link" id="btn-unlock" type="button">Desbloquear todo (modo prueba)</button>
        <button class="link" id="btn-reset" type="button">Borrar progreso</button>
      </div>
    </div>
  </section>

  <section id="game" class="screen off" aria-label="Partida">
    <div class="topbar">
      <button class="back" id="btn-back" type="button">← Mapa</button>
      <div class="ch-title" id="g-title"></div>
      <button class="snd" type="button" aria-pressed="true">Sonido: sí</button>
    </div>
    <div class="hud">
      <div class="moves"><b id="g-moves">0</b><span>Jugadas</span></div>
      <div class="goals" id="g-goals"></div>
    </div>
    <div class="spacer"></div>
    <div id="board"><div class="toast" id="toast"></div></div>
  </section>

  <section id="dialog" class="screen off" aria-live="polite">
    <button class="skip" id="btn-skip" type="button">Saltar</button>
    <div class="sheet" id="sheet" role="button" tabindex="0">
      <div class="portrait" id="d-portrait"></div>
      <div class="say">
        <div class="who"><b id="d-name"></b><span class="chip" id="d-chip">Recuerdo</span></div>
        <p class="line" id="d-text"></p>
      </div>
      <div class="next">Tocá para seguir ▸</div>
    </div>
  </section>

  <section id="letter" class="screen off" aria-label="La carta de Bernardo">
    <div id="letter-scroll">
      <div class="paper">
        <div class="photo"><img src="img/bernardo50.jpg" alt="Bernardo"></div>
        <p class="to">Para mi nieto · Para tu cumpleaños número 10</p>
        <div id="letter-body"></div>
        <button class="btn" id="btn-letter" type="button">Guardar la carta</button>
      </div>
    </div>
  </section>

  <section id="modal" class="screen off"><div class="card" id="card"></div></section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
<script id="logic">
/* ===== Lógica del tablero (pura, sin dibujo) ===== */
const COLS = 7, ROWS = 8;
const K = (r, c) => r * COLS + c;
const RC = (k) => [Math.floor(k / COLS), k % COLS];

function findRuns(g) {
  const out = [];
  for (let r = 0; r < ROWS; r++) {
    let c = 0;
    while (c < COLS) {
      const p = g[r][c];
      if (!p || p.t < 0) { c++; continue; }
      let e = c + 1;
      while (e < COLS && g[r][e] && g[r][e].t === p.t) e++;
      if (e - c >= 3) { const cells = []; for (let i = c; i < e; i++) cells.push([r, i]); out.push({ dir: 'h', cells }); }
      c = e;
    }
  }
  for (let c = 0; c < COLS; c++) {
    let r = 0;
    while (r < ROWS) {
      const p = g[r][c];
      if (!p || p.t < 0) { r++; continue; }
      let e = r + 1;
      while (e < ROWS && g[e][c] && g[e][c].t === p.t) e++;
      if (e - r >= 3) { const cells = []; for (let i = r; i < e; i++) cells.push([i, c]); out.push({ dir: 'v', cells }); }
      r = e;
    }
  }
  return out;
}

function findGroups(g) {
  const runs = findRuns(g);
  const parent = runs.map((_, i) => i);
  const find = (i) => parent[i] === i ? i : (parent[i] = find(parent[i]));
  const owner = new Map();
  runs.forEach((run, i) => run.cells.forEach(([r, c]) => {
    const k = K(r, c);
    if (owner.has(k)) parent[find(i)] = find(owner.get(k)); else owner.set(k, i);
  }));
  const groups = new Map();
  runs.forEach((run, i) => {
    const root = find(i);
    if (!groups.has(root)) groups.set(root, { runs: [], cells: new Set() });
    const G = groups.get(root);
    G.runs.push(run);
    run.cells.forEach(([r, c]) => G.cells.add(K(r, c)));
  });
  return [...groups.values()];
}

function effectCells(p, r, c, g) {
  const out = [];
  if (p.s === 'h' || p.s === 'x') for (let i = 0; i < COLS; i++) out.push(K(r, i));
  if (p.s === 'v' || p.s === 'x') for (let i = 0; i < ROWS; i++) out.push(K(i, c));
  if (p.s === 'b') {
    const count = {};
    for (let rr = 0; rr < ROWS; rr++) for (let cc = 0; cc < COLS; cc++) { const q = g[rr][cc]; if (q && q.t >= 0) count[q.t] = (count[q.t] || 0) + 1; }
    const best = Object.keys(count).sort((a, b) => count[b] - count[a])[0];
    for (let rr = 0; rr < ROWS; rr++) for (let cc = 0; cc < COLS; cc++) { const q = g[rr][cc]; if (q && String(q.t) === best) out.push(K(rr, cc)); }
  }
  return out;
}

// Agrega a "clear" las celdas de los especiales que explotan, en cadena
function expandSpecials(g, clear, keep) {
  const triggered = [];
  const done = new Set();
  const queue = [...clear];
  while (queue.length) {
    const k = queue.shift();
    if (done.has(k)) continue;
    done.add(k);
    if (keep && keep.has(k)) continue;
    const [r, c] = RC(k);
    const p = g[r][c];
    if (p && p.s) {
      triggered.push({ r, c, s: p.s });
      for (const e of effectCells(p, r, c, g)) if (!clear.has(e)) { clear.add(e); queue.push(e); }
    }
  }
  return triggered;
}

function resolveStep(g, swapCells) {
  const groups = findGroups(g);
  if (!groups.length) return null;
  const clear = new Set();
  const created = [];
  for (const G of groups) {
    const longest = G.runs.reduce((a, b) => (b.cells.length > a.cells.length ? b : a));
    const hasH = G.runs.some((r) => r.dir === 'h'), hasV = G.runs.some((r) => r.dir === 'v');
    let special = null;
    if (longest.cells.length >= 5) special = 'b';
    else if (hasH && hasV) special = 'x';
    else if (longest.cells.length === 4) special = longest.dir === 'h' ? 'v' : 'h';
    G.cells.forEach((k) => clear.add(k));
    if (special) {
      let pos = swapCells && swapCells.find(([r, c]) => G.cells.has(K(r, c)));
      if (!pos) pos = longest.cells[Math.floor(longest.cells.length / 2)];
      const base = g[pos[0]][pos[1]];
      created.push({ r: pos[0], c: pos[1], piece: { t: special === 'b' ? -1 : base.t, s: special }, was: base });
    }
  }
  const keep = new Set(created.map((o) => K(o.r, o.c)));
  // si la ficha que se convierte ya era especial, igual explota
  created.forEach((o) => { if (o.was.s) { keep.delete(K(o.r, o.c)); } });
  const triggered = expandSpecials(g, clear, keep);
  created.forEach((o) => clear.delete(K(o.r, o.c)));
  return { clear: [...clear], created, triggered };
}

function bombSwap(g, a, b) {
  const pa = g[a[0]][a[1]], pb = g[b[0]][b[1]];

/* ===== Estado ===== */
let save = { unlocked: 0, got: {} };
try { const s = JSON.parse(localStorage.getItem('mapa-bernardo') || 'null'); if (s && typeof s.unlocked === 'number') save = s; } catch (e) {}
const persist = () => { try { localStorage.setItem('mapa-bernardo', JSON.stringify(save)); } catch (e) {} };

const $ = (id) => document.getElementById(id);
const app = $('app'), bg = $('bg');
function show(id) { ['title', 'map', 'game', 'dialog', 'letter'].forEach((s) => $(s).classList.toggle('off', s !== id)); $('modal').classList.add('off'); }
function setBg(src, awake) { if (src) bg.style.backgroundImage = `url(${src})`; setAwake(awake); }
function setAwake(p) { bg.style.filter = `saturate(${(0.3 + 0.7 * p).toFixed(2)}) brightness(${(0.78 + 0.22 * p).toFixed(2)})`; }

/* ===== Portada y mapa ===== */
function openTitle() { setBg('img/bg_portada.jpg', 1); show('title'); }
function renderMap() {
  const bag = $('bag');
  const items = CHAPTERS.filter((c) => save.got[c.id]);
  bag.innerHTML = '<span class="bag-label">Mochila</span>' + (items.length ? items.map((c) => `<span class="bag-item" title="${c.obj.name}">${objIcon(c.obj.icon)}</span>`).join('') : '<span class="bag-empty">Todavía vacía</span>');
  const list = $('chapters');
  list.innerHTML = '';
  const next = CHAPTERS.findIndex((c, i) => i <= save.unlocked && !save.got[c.id]);
  CHAPTERS.forEach((ch, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    const locked = i > save.unlocked;
    b.className = 'ch' + (locked ? ' locked' : '') + (i === next ? ' current' : '') + (ch.final ? ' final' : '');
    b.innerHTML = `<div class="thumb" style="background-image:url(${ch.bg})"></div>
      <div class="meta"><span class="num">${ch.num}</span><span class="name"></span><span class="sub"></span>
      ${save.got[ch.id] ? `<span class="got">✓ ${ch.obj.name}</span>` : ''}</div>`;
    b.querySelector('.name').textContent = ch.name;
    b.querySelector('.sub').textContent = locked ? 'Bloqueado' : ch.sub;
    if (!locked) b.addEventListener('click', () => { Sound.tick(); playChapter(i); });
    else b.disabled = true;
    list.appendChild(b);
  });
  bg.style.backgroundImage = 'none';
  app.classList.remove('memory');
  show('map');
  const cur = list.querySelector('.current');
  if (cur) cur.scrollIntoView({ block: 'center' });
}

/* ===== Diálogos ===== */
function runDialog(lines) {
  return new Promise((resolve) => {
    if (!lines || !lines.length) return resolve();
    let i = 0;
    const sheet = $('sheet');
    const render = () => {
      const L = lines[i];
      const p = L.who ? P[L.who] : null;
      sheet.classList.toggle('narr', !p);
      $('d-portrait').hidden = !p;
      if (p) { $('d-portrait').style.backgroundImage = `url(${p.img})`; $('d-name').textContent = p.n; }
      $('d-name').parentElement.hidden = !p;
      $('d-chip').hidden = !L.memory;
      $('d-text').textContent = L.text;
      app.classList.toggle('memory', !!L.memory);
    };
    const finish = () => { cleanup(); app.classList.remove('memory'); resolve(); };
    const next = () => { Sound.tick(); i++; if (i >= lines.length) finish(); else render(); };
    const onKey = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); next(); } };
    const cleanup = () => { sheet.removeEventListener('click', next); sheet.removeEventListener('keydown', onKey); $('btn-skip').removeEventListener('click', finish); };
    sheet.addEventListener('click', next);
    sheet.addEventListener('keydown', onKey);
    $('btn-skip').addEventListener('click', finish);
    render();
    show('dialog');
    sheet.focus({ preventScroll: true });
  });
}

/* ===== Modales ===== */
function modal(html, buttons, fill) {
  return new Promise((resolve) => {
    const card = $('card');
    card.innerHTML = html + '<div class="actions"></div>';
    if (fill) fill(card);
    const act = card.querySelector('.actions');
    buttons.forEach(([label, val, ghost]) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'btn' + (ghost ? ' ghost' : ''); b.textContent = label;
      b.addEventListener('click', () => { Sound.tick(); $('modal').classList.add('off'); resolve(val); });
      act.appendChild(b);
    });
    $('modal').classList.remove('off');
    act.querySelector('button').focus({ preventScroll: true });
  });
}

/* ===== La carta ===== */
function showLetter() {
  return new Promise((resolve) => {
    const body = $('letter-body');
    body.innerHTML = '';
    LETTER.forEach((t, i) => {
      const p = document.createElement('p');
      p.textContent = t;
      if (i === 0) p.className = 'salute';
      if (i === LETTER.length - 1) p.className = 'motto';
      p.style.animationDelay = `${0.6 + i * 1.1}s`;
      body.appendChild(p);
    });
    const sign = document.createElement('p');
    sign.className = 'sign';
    sign.innerHTML = 'Te quiere mucho,<br>tu abuelo Bernardo';
    sign.style.animationDelay = `${0.6 + LETTER.length * 1.1}s`;
    body.appendChild(sign);
    const btn = $('btn-letter');
    btn.style.animationDelay = `${1.4 + LETTER.length * 1.1}s`;
    $('letter-scroll').scrollTop = 0;
    Sound.music('letter');
    show('letter');
    const done = () => { btn.removeEventListener('click', done); Sound.tick(); resolve(); };
    btn.addEventListener('click', done);
  });
}

/* ===== Flujo de un capítulo ===== */
let current = null;
async function playChapter(i) {
  const ch = CHAPTERS[i];
  current = i;
  setBg(ch.bg, ch.memory ? 0.9 : 0.15);
  await runDialog(ch.intro);
  await startLevel(ch);
}

let hudGoals = [];
function renderHUD(state, set) {
  $('g-moves').textContent = state.moves;
  const box = $('g-goals');
  if (!hudGoals.length || box.childElementCount !== state.goals.length) {
    box.innerHTML = '';
    hudGoals = state.goals.map((g) => {
      const el = document.createElement('div'); el.className = 'goal';
      el.innerHTML = `<img alt="${SETS[set][g.t].name}" src="${SETS[set][g.t].img}"><span></span>`;
      box.appendChild(el); return el;
    });
  }
  state.goals.forEach((g, k) => {
    const left = Math.max(0, g.n - g.got);
    hudGoals[k].classList.toggle('done', left === 0);
    hudGoals[k].querySelector('span').textContent = left === 0 ? '✓' : left;
  });
}
function toast(text) { const t = $('toast'); t.textContent = text; t.classList.remove('show'); void t.offsetWidth; t.classList.add('show'); }

async function startLevel(ch) {
  $('g-title').textContent = `${ch.num} · ${ch.name}`;
  hudGoals = [];
  show('game');
  setAwake(ch.memory ? 0.9 : 0.15);
  app.classList.toggle('memory', !!ch.memory);
  const scene = await boardReady;
  game.scale.refresh();
  scene.startLevel({
    set: ch.set, moves: ch.moves, types: ch.types, goals: ch.goals.map(([t, n]) => ({ t, n, got: 0 })),
    onUpdate: (st) => { renderHUD(st, ch.set); const tot = st.goals.reduce((a, g) => a + g.n, 0), got = st.goals.reduce((a, g) => a + Math.min(g.n, g.got), 0); if (!ch.memory) setAwake(0.15 + 0.85 * got / tot); },
    onCombo: (n) => { if (n === 2) toast('¡Bien!'); else if (n === 3) toast('¡Bárbaro!'); else if (n >= 4) toast('¡Qué genio!'); },
    onEnd: (won) => endLevel(ch, won),
  });
}

async function endLevel(ch, won) {
  const idx = CHAPTERS.indexOf(ch);
  if (won) {
    setAwake(1);
    toast('¡Lo lograste!');
    Sound.win();
    await new Promise((r) => setTimeout(r, 1000));
    save.got[ch.id] = 1;
    save.unlocked = Math.min(CHAPTERS.length - 1, Math.max(save.unlocked, idx + 1));
    persist();
    app.classList.remove('memory');
    Sound.chime();
    await modal(`<span class="kicker">Conseguiste</span><div class="icon${ch.final ? ' big' : ''}">${objIcon(ch.obj.icon)}</div><h3></h3><p></p>`, [['Seguir la historia', 1]],
      (card) => { card.querySelector('h3').textContent = ch.obj.name; card.querySelector('p').textContent = ch.obj.desc; });
    await runDialog(ch.outro);
    if (ch.final) {
      await showLetter();
      Sound.music('game');
      setBg(ch.bg, 1);
      await runDialog(ch.epilogue);
      Sound.chime();
      $('dialog').classList.add('off');
      await modal(`<span class="kicker">Fin</span><div class="icon big">${objIcon('llave')}</div><h3>El mapa de Bernardo</h3><p>En memoria de Bernardo y de Roberto.</p>`, [['Volver al mapa', 1]]);
    }
    renderMap();
  } else {
    app.classList.remove('memory');
    Sound.lose();
    const v = await modal(`<span class="kicker">Sin jugadas</span><h3>Casi lo tenías</h3><p>Probá de nuevo, cada tablero sale distinto.</p>`, [['Reintentar', 'retry'], ['Volver al mapa', 'map', 1]]);
    if (v === 'retry') startLevel(ch); else renderMap();
  }
}

/* ===== Tablero (Phaser) ===== */
const CELL = 96;
let resolveBoard;
const boardReady = new Promise((r) => (resolveBoard = r));

class BoardScene extends Phaser.Scene {
  constructor() { super('board'); }
  create() {
    this.makeTex('finca', 0, 'b');
    const gfx = this.add.graphics();
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      gfx.fillStyle(0xfff3dc, (r + c) % 2 ? 0.10 : 0.17);
      gfx.fillRoundedRect(c * CELL + 4, r * CELL + 4, CELL - 8, CELL - 8, 14);
    }
    this.sel = this.add.graphics().setDepth(5);
    this.fx = this.add.graphics().setDepth(6);
    this.sprites = [];
    this.set = 'finca';
    this.input.on('pointerdown', (p) => this.onDown(p));
    this.input.on('pointermove', (p) => this.onMove(p));
    this.input.on('pointerup', (p) => this.onUp(p));
    resolveBoard(this);
  }
  texKey(set, t, s) { return s === 'b' ? 'p_b' : `p_${set}_${t}${s || ''}`; }
  key(p) { return this.texKey(this.set, p.t, p.s); }
  makeTex(set, t, s) {
    const key = this.texKey(set, t, s);
    if (this.textures.exists(key)) return;
    const tex = this.textures.createCanvas(key, 128, 128);
    drawPiece(tex.getContext(), set, t, s);
    tex.refresh();
  }
  xy(r, c) { return [c * CELL + CELL / 2, r * CELL + CELL / 2]; }
  makeSprite(r, c, p, rowOverride) {
    const [x, y] = this.xy(rowOverride === undefined ? r : rowOverride, c);
    const s = this.add.image(x, y, this.key(p)).setDisplaySize(CELL * 0.9, CELL * 0.9).setDepth(2);
    s.base = s.scaleX;
    return s;
  }
  tween(cfg) { return new Promise((res) => this.tweens.add({ ...cfg, onComplete: res })); }
  wait(ms) { return new Promise((res) => this.time.delayedCall(ms, res)); }

  startLevel(cfg) {
    this.tweens.killAll();
    this.time.removeAllEvents();
    this.sprites.flat().forEach((s) => s && s.destroy());
    this.cfg = cfg;
    this.set = cfg.set;
    for (let t = 0; t < 6; t++) for (const s of [null, 'h', 'v', 'x']) this.makeTex(this.set, t, s);
    this.state = { moves: cfg.moves, goals: cfg.goals };
    this.rand = Math.random;
    this.g = newGrid(this.rand, cfg.types);
    this.sprites = [];
    for (let r = 0; r < ROWS; r++) {
      this.sprites.push([]);
      for (let c = 0; c < COLS; c++) {
        const s = this.makeSprite(r, c, this.g[r][c], r - ROWS - 1);
        this.sprites[r].push(s);
        this.tweens.add({ targets: s, y: this.xy(r, c)[1], duration: 380 + r * 40, ease: 'Bounce.easeOut', delay: c * 30 });
      }
    }
    this.busy = true; this.ended = false; this.selected = null; this.down = null;
    this.time.delayedCall(950, () => { this.busy = false; });
    this.drawSel();
    cfg.onUpdate(this.state);
    this.armHint();
  }

  cellAt(p) {
    const c = Math.floor(p.x / CELL), r = Math.floor(p.y / CELL);
    return r >= 0 && r < ROWS && c >= 0 && c < COLS ? [r, c] : null;
  }
  onDown(p) {
    if (this.busy || this.ended || !this.g) return;
    const cell = this.cellAt(p);
    if (!cell) return;
    this.down = { cell, x: p.x, y: p.y, moved: false };
  }
  onMove(p) {
    if (!this.down || this.down.moved || this.busy) return;
    const dx = p.x - this.down.x, dy = p.y - this.down.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < CELL * 0.33) return;
    this.down.moved = true;
    const [r, c] = this.down.cell;
    const t = Math.abs(dx) > Math.abs(dy) ? [r, c + Math.sign(dx)] : [r + Math.sign(dy), c];
    this.down = null;
    if (t[0] < 0 || t[0] >= ROWS || t[1] < 0 || t[1] >= COLS) return;
    this.selected = null; this.drawSel();
    this.trySwap([r, c], t);
  }
  onUp() {
    if (!this.down) return;
    const cell = this.down.cell;
    this.down = null;
    if (this.busy || this.ended) return;
    if (this.selected && Math.abs(this.selected[0] - cell[0]) + Math.abs(this.selected[1] - cell[1]) === 1) {
      const a = this.selected; this.selected = null; this.drawSel(); this.trySwap(a, cell);
    } else {
      this.selected = this.selected && this.selected[0] === cell[0] && this.selected[1] === cell[1] ? null : cell;
      if (this.selected) Sound.tick();
      this.drawSel();
    }
  }
  drawSel() {
    this.sel.clear();
    if (!this.selected) return;
    const [r, c] = this.selected;
    this.sel.lineStyle(6, 0xf2b632, 1);
    this.sel.strokeRoundedRect(c * CELL + 4, r * CELL + 4, CELL - 8, CELL - 8, 14);
  }
  armHint() {
    if (this.hintTimer) this.hintTimer.remove();
    this.hintTimer = this.time.delayedCall(6000, () => {
      if (this.busy || this.ended) return;
      const m = findMove(this.g);
      if (!m) return;
      m.forEach(([r, c]) => { const s = this.sprites[r][c]; if (s) this.tweens.add({ targets: s, angle: { from: -10, to: 10 }, duration: 110, yoyo: true, repeat: 3, onComplete: () => s.setAngle(0) }); });
      this.armHint();
    });
  }

  async animSwap(a, b) {
    const sa = this.sprites[a[0]][a[1]], sb = this.sprites[b[0]][b[1]];
    const [ax, ay] = this.xy(...a), [bx, by] = this.xy(...b);
    await Promise.all([
      this.tween({ targets: sa, x: bx, y: by, duration: 150, ease: 'Quad.easeInOut' }),
      this.tween({ targets: sb, x: ax, y: ay, duration: 150, ease: 'Quad.easeInOut' }),
    ]);
    this.sprites[a[0]][a[1]] = sb; this.sprites[b[0]][b[1]] = sa;
  }

  async trySwap(a, b) {
    if (this.busy || this.ended) return;
    this.busy = true;
    if (this.hintTimer) this.hintTimer.remove();
    Sound.swap();
    await this.animSwap(a, b);
    swapCells(this.g, a, b);
    const pa = this.g[a[0]][a[1]], pb = this.g[b[0]][b[1]];
    let res = null;
    if (pa.s === 'b' || pb.s === 'b') res = bombSwap(this.g, a, b);
    else if (!findRuns(this.g).length) {
      Sound.bad();
      await this.animSwap(a, b);
      swapCells(this.g, a, b);
      this.busy = false; this.armHint();
      return;
    }
    this.state.moves--;
    this.cfg.onUpdate(this.state);
    let combo = 0, first = true;
    while (true) {
      if (!res) res = resolveStep(this.g, first ? [a, b] : null);
      first = false;
      if (!res) break;
      combo++;
      await this.animClear(res, combo);
      const got = applyClear(this.g, res);
      this.state.goals.forEach((g) => { g.got += got[g.t] || 0; });
      this.cfg.onUpdate(this.state);
      await this.animGravity(gravity(this.g, this.rand, this.cfg.types));
      res = null;
    }
    if (combo >= 2) this.cfg.onCombo(combo);
    const won = this.state.goals.every((g) => g.got >= g.n);
    if (won || this.state.moves <= 0) {
      this.ended = true; this.busy = false;
      await this.wait(won ? 250 : 500);
      this.cfg.onEnd(won);
      return;
    }
    if (!findMove(this.g)) {
      reshuffle(this.g, this.rand);
      await this.redraw();
    }
    this.busy = false;
    this.armHint();
  }

  flashLine(r, c, s) {
    const g = this.fx;
    const draw = (x, y, w, h) => { g.fillStyle(0xfff6e6, 0.85); g.fillRoundedRect(x, y, w, h, 12); };
    if (s === 'h' || s === 'x') draw(0, r * CELL + CELL * 0.3, COLS * CELL, CELL * 0.4);
    if (s === 'v' || s === 'x') draw(c * CELL + CELL * 0.3, 0, CELL * 0.4, ROWS * CELL);
    if (s === 'b') { g.fillStyle(0xf2b632, 0.35); g.fillRect(0, 0, COLS * CELL, ROWS * CELL); }
  }

  async animClear(res, combo) {
    Sound.pop(combo);
    if (res.triggered.some((t) => t.s === 'b') || res.clear.length > 25) Sound.bomb();
    else if (res.triggered.length) Sound.zap();
    if (res.created.length) Sound.special();
    this.fx.clear();
    res.triggered.forEach((t) => this.flashLine(t.r, t.c, t.s));
    if (res.triggered.length) this.tweens.add({ targets: this.fx, alpha: { from: 1, to: 0 }, duration: 380, onComplete: () => { this.fx.clear(); this.fx.setAlpha(1); } });
    const jobs = [];
    for (const k of res.clear) {
      const [r, c] = RC(k);
      const s = this.sprites[r][c];
      this.sprites[r][c] = null;
      if (!s) continue;
      jobs.push(this.tween({ targets: s, scale: s.base * 1.25, duration: 70 }).then(() => this.tween({ targets: s, scale: 0, alpha: 0, duration: 140, ease: 'Back.easeIn' })).then(() => s.destroy()));
    }
    for (const o of res.created) {
      const s = this.sprites[o.r][o.c];
      if (!s) continue;
      s.setTexture(this.key(o.piece));
      s.setDisplaySize(CELL * 0.9, CELL * 0.9); s.base = s.scaleX;
      jobs.push(this.tween({ targets: s, scale: s.base * 1.3, duration: 140, yoyo: true }));
    }
    await Promise.all(jobs);
  }

  async animGravity(grav) {
    const jobs = [];
    const moved = grav.moves.map((m) => ({ ...m, s: this.sprites[m.from[0]][m.from[1]] }));
    moved.forEach((m) => { this.sprites[m.from[0]][m.from[1]] = null; });
    moved.forEach((m) => {
      this.sprites[m.to[0]][m.to[1]] = m.s;
      if (!m.s) return;
      const d = m.to[0] - m.from[0];
      jobs.push(this.tween({ targets: m.s, y: this.xy(...m.to)[1], duration: 90 + d * 55, ease: 'Quad.easeIn' }));
    });
    grav.spawns.forEach((sp) => {
      const s = this.makeSprite(sp.r, sp.c, this.g[sp.r][sp.c], sp.fromRow);
      this.sprites[sp.r][sp.c] = s;
      const d = sp.r - sp.fromRow;
      jobs.push(this.tween({ targets: s, y: this.xy(sp.r, sp.c)[1], duration: 90 + d * 55, ease: 'Quad.easeIn' }));
    });
    await Promise.all(jobs);
  }

  async redraw() {
    this.sprites.flat().forEach((s) => s && s.destroy());
    this.sprites = [];
    for (let r = 0; r < ROWS; r++) {
      this.sprites.push([]);
      for (let c = 0; c < COLS; c++) { const s = this.makeSprite(r, c, this.g[r][c]); s.setScale(0); this.sprites[r].push(s); this.tweens.add({ targets: s, scale: s.base, duration: 260, delay: (r + c) * 15 }); }
    }
    toast('Mezclando');
    await this.wait(320);
  }
}

let game;
imagesReady.then(() => {
  game = new Phaser.Game({
    type: Phaser.AUTO,
    parent: 'board',
    transparent: true,
    audio: { noAudio: true },
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH, width: COLS * CELL, height: ROWS * CELL },
    scene: BoardScene,
    banner: false,
  });
});

/* ===== Botones ===== */
$('btn-play').addEventListener('click', () => { Sound.unlock(); Sound.music('game'); Sound.tick(); renderMap(); });
$('btn-back').addEventListener('click', async () => { Sound.tick(); const sc = await boardReady; sc.ended = true; app.classList.remove('memory'); renderMap(); });
$('btn-unlock').addEventListener('click', () => { save.unlocked = CHAPTERS.length - 1; persist(); renderMap(); });
document.querySelectorAll('.snd').forEach((b) => b.addEventListener('click', () => { Sound.unlock(); Sound.toggle(); if (!Sound.muted) Sound.music('game'); syncSoundButtons(); }));
syncSoundButtons();
let resetArmed = false;
$('btn-reset').addEventListener('click', (e) => {
  if (!resetArmed) { resetArmed = true; e.target.textContent = 'Tocá de nuevo para borrar todo'; setTimeout(() => { resetArmed = false; e.target.textContent = 'Borrar progreso'; }, 3500); return; }
  save = { unlocked: 0, got: {} }; persist(); resetArmed = false; e.target.textContent = 'Borrar progreso'; renderMap();
});
/* ===== Instalar como app ===== */
let installPrompt = null;
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function updateInstall() { const show = !standalone() && (!!installPrompt || isIOS); document.querySelectorAll('.install').forEach((b) => { b.hidden = !show; }); }
addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installPrompt = e; updateInstall(); });
addEventListener('appinstalled', () => { installPrompt = null; updateInstall(); });
document.querySelectorAll('.install').forEach((b) => b.addEventListener('click', async () => {
  Sound.tick();
  if (installPrompt) {
    installPrompt.prompt();
    try { await installPrompt.userChoice; } catch (e) {}
    installPrompt = null; updateInstall();
  } else if (isIOS) {
    await modal('<span class="kicker">Instalar en iPhone</span><h3>Agregalo a tu inicio</h3><p>Tocá el botón Compartir de Safari (el cuadrado con la flecha para arriba) y elegí "Agregar a inicio".</p>', [['Entendido', 1]]);
  }
}));
updateInstall();
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));

openTitle();
</script>
