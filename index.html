<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b120d">
<meta name="description" content="Un juego de combinar fichas por los lugares de Mendoza, con la historia del abuelo Bernardo.">
<title>El mapa de Bernardo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mapa de Bernardo">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preload" href="fonts/bagel-fat-one.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/mali-600.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Tipografías (incluidas en el juego, funcionan sin internet): Bagel Fat One para títulos, Mali para textos, Gochi Hand para la carta */
@font-face{font-family:"Bagel Fat One";src:url(fonts/bagel-fat-one.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Mali";src:url(fonts/mali-400.woff2) format("woff2");font-weight:400 500;font-display:swap}
@font-face{font-family:"Mali";src:url(fonts/mali-600.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Mali";src:url(fonts/mali-700.woff2) format("woff2");font-weight:700 900;font-display:swap}
@font-face{font-family:"Gochi Hand";src:url(fonts/gochi-hand.woff2) format("woff2");font-weight:400 700;font-display:swap}
/* Base: márgenes seguros del celular */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: app de una pantalla; fondo = el lugar (se "despierta" con el progreso), arriba HUD, abajo tablero; diálogos como hoja inferior */
:root{
  color-scheme:dark;
  --ink:#2a1a12; --cream:#fff6e6; --cream-dim:#e9dcc6; --malbec:#8c2346; --malbec-deep:#5e1430;
  --gold:#f2b632; --glass:rgba(32,20,14,.62); --glass-strong:rgba(28,16,10,.86); --line:rgba(255,236,200,.28);
  --memory:#c9965a; --ok:#5fcf86;
  --display:"Bagel Fat One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Mali",system-ui,-apple-system,"Segoe UI",sans-serif;
  --hand:"Gochi Hand","Segoe Print","Bradley Hand",cursive;
  --paper:#f3e3c3; --paper-ink:#3b2a1c;
}
html,body{height:100%;overflow:hidden}
body{background:#1b120d;color:var(--cream);font-family:var(--body);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font-family:var(--body);cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{position:relative;height:100%;overflow:hidden}
#bg{position:absolute;inset:0;background:#1b120d center/cover no-repeat;transition:filter .7s ease, background-image .3s;filter:saturate(.3) brightness(.78)}
#app.memory #bg{filter:sepia(.75) saturate(.6) brightness(.85)!important}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.screen.off{visibility:hidden;pointer-events:none}

/* Portada */
.kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:800}
.btn{appearance:none;border:0;border-radius:16px;font-weight:800;font-size:18px;padding:15px 22px;min-height:54px;color:var(--cream);background:var(--malbec);box-shadow:0 4px 0 var(--malbec-deep),inset 0 0 0 2px rgba(242,182,50,.55)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--malbec-deep),inset 0 0 0 2px rgba(242,182,50,.55)}
.btn.ghost{background:rgba(255,246,230,.12);box-shadow:inset 0 0 0 2px var(--line)}
#title{background:linear-gradient(rgba(20,10,6,.55),rgba(20,10,6,0) 26%,rgba(20,10,6,0) 46%,rgba(20,10,6,.9) 78%)}
.logo{margin:calc(18px + env(safe-area-inset-top,0px)) auto 0;display:flex;flex-direction:column;align-items:center;gap:0;text-align:center;filter:drop-shadow(0 8px 14px rgba(0,0,0,.55))}
.logo .pre{font-family:var(--display);font-size:clamp(22px,6vw,30px);color:#fff6e6;letter-spacing:.04em;-webkit-text-stroke:5px var(--malbec-deep);paint-order:stroke fill;line-height:1}
.logo .main{font-family:var(--display);font-size:clamp(54px,16vw,82px);line-height:.9;letter-spacing:.01em;background:linear-gradient(#fff3c4,#f2b632 55%,#c97a12);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:3px #5e1430;paint-order:stroke fill}
.logo .ribbon{margin-top:8px;background:var(--malbec);color:#fff6e6;font:800 12px var(--body);letter-spacing:.14em;text-transform:uppercase;padding:6px 16px;border-radius:6px;box-shadow:0 3px 0 var(--malbec-deep),inset 0 0 0 1.5px rgba(242,182,50,.6)}
.logo img{width:64px;height:64px;margin-bottom:-6px;animation:keyspin 6s ease-in-out infinite}
@keyframes keyspin{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg) translateY(-4px)}}
.title-spacer{flex:1}
.title-inner{padding-inline:20px;padding-block:0 calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:14px;max-width:440px;margin:0 auto;width:100%;box-sizing:border-box}
.continue{display:flex;align-items:center;gap:10px;background:rgba(30,20,14,.82);border:1px solid var(--line);border-radius:16px;padding:8px 14px 8px 8px;width:100%;box-sizing:border-box}
.continue .cthumb{width:52px;height:52px;border-radius:12px;background:#000 center/cover no-repeat;flex:none;box-shadow:0 0 0 2px var(--gold)}
.continue .ctext{display:flex;flex-direction:column;min-width:0}
.continue .ctext small{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.continue .ctext b{font-family:var(--display);font-weight:400;font-size:19px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.continue .ctext span{font-size:13px;color:var(--cream-dim)}
.continue .cbar{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px;font:700 12px var(--body);color:var(--cream-dim);font-variant-numeric:tabular-nums}
.continue .cbar i{display:block;width:70px;height:8px;border-radius:99px;background:rgba(255,246,230,.15);overflow:hidden}
.continue .cbar i::after{content:"";display:block;height:100%;width:var(--p,0%);background:linear-gradient(90deg,#f2b632,#ffd979)}
.btn-play{appearance:none;border:0;width:100%;border-radius:22px;font-family:var(--display);font-size:34px;letter-spacing:.04em;padding:14px 20px 16px;color:#fff;background:linear-gradient(#6fdc6a,#2f9f3b);box-shadow:0 6px 0 #1d6b27,0 10px 22px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.5);text-shadow:0 3px 0 #1d6b27;cursor:pointer;animation:playpulse 1.6s ease-in-out infinite}
.btn-play:active{transform:translateY(4px);box-shadow:0 2px 0 #1d6b27,inset 0 2px 0 rgba(255,255,255,.5)}
@keyframes playpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.title-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.title-row .btn{font-size:16px;padding:12px 10px;min-height:48px}
.proto{font-size:12px;color:var(--cream-dim);opacity:.7}
/* Cómo jugar */
.howto{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.howto .step-n{display:flex;gap:6px}
.howto .step-n i{width:8px;height:8px;border-radius:50%;background:rgba(255,246,230,.25)}
.howto .step-n i.on{background:var(--gold)}
.demo{display:flex;align-items:center;justify-content:center;gap:6px;min-height:110px;width:100%}
.demo img{width:58px;height:58px;object-fit:contain}
.demo .arrow{font:800 30px var(--body);color:var(--gold)}
.demo .slide{animation:slide 1.6s ease-in-out infinite}
@keyframes slide{0%,25%{transform:translateX(0)}50%,75%{transform:translateX(64px)}100%{transform:translateX(0)}}
.demo .slide2{animation:slide2 1.6s ease-in-out infinite}
@keyframes slide2{0%,25%{transform:translateX(0)}50%,75%{transform:translateX(-64px)}100%{transform:translateX(0)}}
.demo-hud{display:flex;gap:10px;align-items:stretch}
.demo-hud .moves{min-width:64px}
.demo-hud .goals{padding:6px 12px}
.boost-list{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center;width:100%;text-align:left}
.boost-list img{width:46px;height:46px;object-fit:contain}
.boost-list span{font-size:14px;color:var(--cream)}
.boost-list b{color:var(--gold)}
.fx-hand{position:absolute;width:0;height:0;pointer-events:none;z-index:5}
.fx-hand::before{content:"";position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle,#fff 0 40%,rgba(255,255,255,.75) 41% 60%,rgba(255,255,255,0) 62%);box-shadow:0 0 0 4px rgba(242,182,50,.9),0 6px 14px rgba(0,0,0,.5)}
.fx-hand::after{content:"";position:absolute;left:-34px;top:-34px;width:68px;height:68px;border-radius:50%;border:3px solid rgba(255,246,230,.9);animation:tapring 1.5s ease-out infinite}
@keyframes tapring{0%{transform:scale(.5);opacity:1}40%{transform:scale(1);opacity:0}100%{opacity:0}}

/* Mapa de capítulos */
.link{appearance:none;background:none;border:0;color:var(--cream-dim);font-size:14px;text-decoration:underline;padding:8px}
/* Pantalla principal: mapa de Mendoza con los lugares, barra arriba y menú abajo */
#map{background:#2a3a1c}
.hub-top{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;align-items:center;gap:8px;padding-inline:12px;padding-block:10px 18px;background:linear-gradient(rgba(20,12,8,.82),rgba(20,12,8,0))}
.hub-top .spacer-x{flex:1}
.icon-btn{appearance:none;border:0;width:44px;height:44px;border-radius:50%;background:rgba(30,20,14,.85);color:var(--cream);font:800 22px/1 var(--body);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer}
.world{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative}
.world-inner{position:relative;max-width:560px;margin:0 auto;padding-block:118px 104px}
.act{position:relative}
.act .nodes{position:absolute;inset:0}
.act + .act::before{content:"";position:absolute;left:0;right:0;top:-28px;height:56px;z-index:0;background:linear-gradient(rgba(42,58,28,0),rgba(42,58,28,.55) 50%,rgba(42,58,28,0));pointer-events:none}
.act-banner{position:absolute;top:0;left:50%;transform:translate(-50%,-50%);z-index:1;background:linear-gradient(#a33a5c,var(--malbec));color:var(--cream);font:400 17px var(--display);letter-spacing:.02em;padding:7px 18px;border-radius:12px;white-space:nowrap;box-shadow:0 4px 0 var(--malbec-deep),0 8px 16px rgba(0,0,0,.45),inset 0 0 0 1.5px rgba(242,182,50,.7);pointer-events:none}
.act:first-child .act-banner{top:-30px}
.world-img{display:block;width:100%;height:auto;max-width:none}
.node{position:absolute;transform:translate(-50%,-50%);appearance:none;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:var(--cream)}
.node .disc{position:relative;width:58px;height:58px;border-radius:50%;background:#2b1a12 center 30%/cover no-repeat;box-shadow:0 0 0 3px #fff6e6,0 0 0 7px var(--malbec),0 8px 14px rgba(0,0,0,.55)}
.node .lbl{font:800 12px var(--body);background:rgba(30,20,14,.88);padding:3px 9px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.node .badge{position:absolute;right:-6px;bottom:-4px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:800 13px var(--body);box-shadow:0 2px 4px rgba(0,0,0,.4)}
.node.done .disc{box-shadow:0 0 0 3px #fff6e6,0 0 0 7px var(--gold),0 8px 14px rgba(0,0,0,.55)}
.node.done .badge{background:var(--ok);color:#10301c}
.node.locked .disc{filter:grayscale(1) brightness(.55)}
.node.locked .badge{background:#3b2a1c;color:var(--cream-dim)}
.node.locked .lbl{opacity:.7}
.node.current .disc{animation:pulse 1.4s ease-in-out infinite}
.node .flag{position:absolute;bottom:calc(100% + 2px);left:50%;transform:translateX(-50%);background:var(--malbec);color:var(--cream);font:800 13px var(--body);padding:5px 12px;border-radius:10px;box-shadow:0 3px 0 var(--malbec-deep),inset 0 0 0 1.5px rgba(242,182,50,.6);white-space:nowrap;animation:bob 1.2s ease-in-out infinite}
.node .flag::after{content:"";position:absolute;top:100%;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:var(--malbec)}
.node.final .disc{width:66px;height:66px}
.pips{display:flex;gap:3px;margin-top:-2px}
.pips i{width:9px;height:9px;border-radius:50%;background:rgba(30,20,14,.85);box-shadow:inset 0 0 0 1.5px rgba(255,236,200,.6)}
.pips i.on{background:var(--gold);box-shadow:0 0 6px rgba(242,182,50,.8)}
.pre-text{font-size:14px!important;color:var(--cream)!important;margin-top:-4px!important}
.race{padding:4px 22px 0}
.race-track{position:relative;height:12px;border-radius:999px;background:rgba(30,20,14,.75);box-shadow:inset 0 0 0 1.5px rgba(242,182,50,.5);margin:14px 6px 6px}
.race-flag{position:absolute;right:-6px;top:50%;width:20px;height:20px;transform:translateY(-50%);border-radius:4px;background:conic-gradient(#fff 0 25%,#222 0 50%,#fff 0 75%,#222 0);box-shadow:0 0 0 2px var(--gold)}
.race-p{position:absolute;top:50%;width:34px;height:34px;border-radius:50%;transform:translate(-50%,-50%);background:#2b1a12 center 25%/cover no-repeat;transition:left .45s cubic-bezier(.3,1.4,.5,1);left:0}
.race-p.you{box-shadow:0 0 0 3px #fff6e6,0 0 0 5px var(--ok),0 4px 8px rgba(0,0,0,.5);z-index:2}
.race-p.rival{box-shadow:0 0 0 3px #fff6e6,0 0 0 5px #c0392b,0 4px 8px rgba(0,0,0,.5);background-size:cover;background-color:#f6ead2}
#game.special #board{box-shadow:0 0 0 3px var(--gold),0 0 28px 6px rgba(242,182,50,.45);border-radius:18px}
#game.special .ch-title{color:var(--gold)}
#game.night{background:radial-gradient(ellipse at 50% 58%,rgba(10,14,30,.25) 25%,rgba(6,8,20,.85) 72%)}
.pf-field{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left}
.pf-field>span{font:800 13px var(--body);color:var(--cream-dim)}
.pf-field input{appearance:none;width:100%;box-sizing:border-box;border:0;border-radius:12px;padding:12px 14px;font:700 17px var(--body);background:#fff6e6;color:#2b1a12;box-shadow:inset 0 2px 4px rgba(0,0,0,.25)}
.pf-field input:focus{outline:3px solid var(--gold);outline-offset:1px}
.pf-chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pf-chip{appearance:none;border:0;border-radius:12px;padding:10px 4px;font:800 14px var(--body);background:rgba(255,246,230,.1);color:var(--cream);box-shadow:inset 0 0 0 1.5px rgba(242,182,50,.35);cursor:pointer}
.pf-chip.on{background:var(--gold);color:#3a2208;box-shadow:0 3px 0 #8a5a10}
.pf-note{font-size:12px!important;color:var(--cream-dim)!important;margin:0!important}
.lvl-done{margin-top:-6px!important;font-size:14px!important}
#card .btn:disabled{opacity:.45}
#pf-ok,#pf-cancel{width:100%}
.sp-tag{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(#f2c14e,#d99a1e);color:#3a2208;font:800 13px var(--body);padding:5px 12px 5px 5px;border-radius:999px;box-shadow:0 3px 0 #8a5a10}
.sp-tag img{width:28px;height:28px;border-radius:50%;object-fit:cover;background:#fff6e6}
.prize-note{font-size:13px!important;color:var(--gold)!important;margin-top:-4px!important}
.lvl-pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:8px;width:100%}
.node.edge-r .flag{left:auto;right:-6px;transform:none}
.node.edge-r .flag::after{left:auto;right:18px}
.node.edge-r .lbl{transform:translateX(-18%)}
@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 0 0 3px #fff6e6,0 0 0 7px var(--gold),0 0 22px 8px rgba(242,182,50,.6)}}
.hub-nav{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;justify-content:center;gap:10px;padding-inline:12px;padding-block:14px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(20,12,8,0),rgba(20,12,8,.9) 40%)}
.nav-b{appearance:none;position:relative;border:0;flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:2px;background:linear-gradient(#5e3a22,#3d2416);color:var(--cream);font:800 13px var(--body);border-radius:16px;padding:6px 6px 8px;box-shadow:0 4px 0 #24150d,inset 0 0 0 1.5px rgba(242,182,50,.5);cursor:pointer}
.nav-b:active{transform:translateY(2px);box-shadow:0 2px 0 #24150d,inset 0 0 0 1.5px rgba(242,182,50,.5)}
.nav-b img,.nav-b .nav-ico{width:46px;height:46px;object-fit:contain;margin-top:-18px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.45))}
.nav-b .nav-ico svg{width:100%;height:100%}
.nav-b .dot{position:absolute;top:-4px;right:-2px;width:16px;height:16px;border-radius:50%;background:#e8453c;box-shadow:0 0 0 2px #fff6e6}
.nav-b .nav-count{position:absolute;top:-6px;right:-4px;min-width:22px;height:22px;border-radius:999px;background:var(--malbec);display:grid;place-items:center;font-size:12px;box-shadow:inset 0 0 0 1.5px rgba(242,182,50,.6)}
.world-pad-top{height:0}
.bag-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%}
.bag-cell{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--cream-dim);text-align:center}
.bag-cell .bi{width:56px;height:56px;border-radius:14px;background:rgba(255,246,230,.08);display:grid;place-items:center;padding:6px;box-sizing:border-box}
.bag-cell .bi>*{width:100%;height:100%;object-fit:contain}
.bag-cell.missing .bi{opacity:.35;filter:grayscale(1) brightness(.5)}
.more-list{display:flex;flex-direction:column;gap:8px;width:100%}
.more-list button{appearance:none;border:0;border-radius:12px;background:rgba(255,246,230,.08);color:var(--cream);font:700 15px var(--body);padding:12px;text-align:left;cursor:pointer;box-shadow:inset 0 0 0 1px var(--line)}
/* Efectos grandes sobre toda la pantalla */
#fx{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.fx-img,.fx-glow,.fx-ember,.fx-rays,.fx-condor,.fx-label{position:absolute;will-change:transform,opacity}
.fx-img{object-fit:contain;filter:drop-shadow(0 12px 16px rgba(0,0,0,.45))}
.fx-glow{border-radius:50%;background:radial-gradient(circle,rgba(255,244,200,.95),rgba(242,182,50,.55) 38%,rgba(242,182,50,0) 70%)}
.fx-glow.hot{background:radial-gradient(circle,rgba(255,240,180,.95),rgba(255,120,40,.6) 40%,rgba(255,80,0,0) 70%)}
.fx-glow.cool{background:radial-gradient(circle,rgba(235,248,255,.95),rgba(150,205,255,.55) 40%,rgba(150,205,255,0) 70%)}
.fx-flash{position:absolute;inset:0}
.fx-ring{position:absolute;border-radius:50%;border:7px solid rgba(255,214,140,.95);box-shadow:0 0 18px rgba(255,150,60,.8),inset 0 0 18px rgba(255,150,60,.6);will-change:transform,opacity}
.fx-smoke{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(90,80,75,.75),rgba(90,80,75,.35) 45%,rgba(90,80,75,0) 70%);will-change:transform,opacity}
.fx-ember{border-radius:50%;background:radial-gradient(circle,#fff3b0,#ff9a3a 55%,rgba(255,80,0,0) 72%)}
.fx-rays{border-radius:50%;background:repeating-conic-gradient(rgba(255,226,140,.85) 0 9deg,rgba(255,226,140,0) 9deg 24deg);-webkit-mask:radial-gradient(circle,#000 25%,transparent 70%);mask:radial-gradient(circle,#000 25%,transparent 70%)}
.fx-condor img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 16px 18px rgba(0,0,0,.45))}
.fx-condor .carry{position:absolute;left:30%;top:62%;width:40%;height:40%;object-fit:contain}
.fx-label{font-family:var(--display);font-size:34px;color:#fff6e6;text-shadow:0 3px 0 var(--malbec-deep),0 6px 16px rgba(0,0,0,.6);white-space:nowrap;transform:translate(-50%,-50%)}
/* Escenas de la historia */
.scene{margin:0 auto 12px;width:calc(100% - 24px);max-width:540px;aspect-ratio:16/9;border-radius:18px;overflow:hidden;box-shadow:0 0 0 3px #fff6e6,0 0 0 6px var(--malbec),0 16px 30px rgba(0,0,0,.55);background:#000}
.scene img{display:block;width:100%;height:100%;object-fit:cover;animation:kb 16s ease-in-out infinite alternate}
.scene.in{animation:sceneIn .5s ease both}
.memory .scene img{filter:sepia(.55) saturate(.8)}
@keyframes kb{from{transform:scale(1.02) translate(0,0)}to{transform:scale(1.12) translate(-2%,-1.5%)}}

<script id="logic">
/* ===== Lógica del tablero (pura, sin dibujo) ===== */
const COLS = 7, ROWS = 8;
const K = (r, c) => r * COLS + c;
const RC = (k) => [Math.floor(k / COLS), k % COLS];
// Boosters (fichas sin color, t = -1):
//  h / v  Zonda: barre la fila / la columna
//  c      Cóndor: rompe su cruz y vuela a una ficha del objetivo
//  o      Volcán: explota alrededor
//  b      Llave: se lleva todas las fichas de un color
// Efectos internos de los combos: x (fila+columna), xo (3 filas+3 columnas), o2 (volcán grande), c3 (tres cóndores)
// Obstáculos: piedra (t = -2, con vida hp) y la cajita que hay que bajar (t = -3).
// El suelo (tierra seca, nieve, ceniza...) va en una grilla aparte: floor[r][c] = capas que faltan limpiar.
// Alambre de viña: una ficha con w = 1 está atada. No se puede mover ni cae; se suelta (y se queda) cuando la juntás o la alcanza un booster.
// Barril: es una piedra con k = 'barril' y 3 golpes; al romperse suelta monedas.
// Maleza (t = -5): no se mueve ni cae, se rompe como una piedra y, si en una jugada no rompiste ninguna, crece a una ficha vecina.
// Niebla: grilla aparte (fog). Tapa la casilla hasta que se rompe algo en ella o al lado.
// Acequia: el agua entra por arriba (lv.water.src) y corre hacia abajo y a los costados por las casillas sin tierra (floor = 0).
const ROCK = -2, ITEM = -3, WEED = -5;
const isSpecial = (p) => !!(p && p.s);
const fixed = (p) => !!(p && (p.w || p.t === WEED));

function findRuns(g) {
  const out = [];
  for (let r = 0; r < ROWS; r++) {
    let c = 0;
    while (c < COLS) {
      const p = g[r][c];
      if (!p || p.t < 0) { c++; continue; }
      let e = c + 1;
      while (e < COLS && g[r][e] && g[r][e].t === p.t) e++;
      if (e - c >= 3) { const cells = []; for (let i = c; i < e; i++) cells.push([r, i]); out.push({ dir: 'h', cells }); }
      c = e;
    }
  }
  for (let c = 0; c < COLS; c++) {
    let r = 0;
    while (r < ROWS) {
      const p = g[r][c];
      if (!p || p.t < 0) { r++; continue; }
      let e = r + 1;
      while (e < ROWS && g[e][c] && g[e][c].t === p.t) e++;
      if (e - r >= 3) { const cells = []; for (let i = r; i < e; i++) cells.push([i, c]); out.push({ dir: 'v', cells }); }
      r = e;
    }
  }
  return out;
}

function findSquares(g) {
  const out = [];
  for (let r = 0; r < ROWS - 1; r++) for (let c = 0; c < COLS - 1; c++) {
    const p = g[r][c];
    if (!p || p.t < 0) continue;
    const q = [g[r][c + 1], g[r + 1][c], g[r + 1][c + 1]];
    if (q.every((x) => x && x.t === p.t)) out.push({ dir: 'sq', cells: [[r, c], [r, c + 1], [r + 1, c], [r + 1, c + 1]] });
  }
  return out;
}

const hasMatch = (g) => findRuns(g).length > 0 || findSquares(g).length > 0;

function findGroups(g) {
  const runs = [...findRuns(g), ...findSquares(g)];
  const parent = runs.map((_, i) => i);
  const find = (i) => (parent[i] === i ? i : (parent[i] = find(parent[i])));
  const owner = new Map();
  runs.forEach((run, i) => run.cells.forEach(([r, c]) => {
    const k = K(r, c);
    if (owner.has(k)) parent[find(i)] = find(owner.get(k)); else owner.set(k, i);
  }));
  const groups = new Map();
  runs.forEach((run, i) => {
    const root = find(i);
    if (!groups.has(root)) groups.set(root, { runs: [], cells: new Set() });
    const G = groups.get(root);
    G.runs.push(run);
    run.cells.forEach(([r, c]) => G.cells.add(K(r, c)));
  });
  return [...groups.values()];
}

function mostCommonColor(g, exclude) {
  const count = {};
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const q = g[r][c];
    if (q && q.t >= 0 && !(exclude && exclude.has(K(r, c)))) count[q.t] = (count[q.t] || 0) + 1;
  }
  const keys = Object.keys(count);
  if (!keys.length) return null;
  return Number(keys.sort((a, b) => count[b] - count[a])[0]);
}

function pickTarget(g, r, c, ctx, taken) {
  const pref = [], any = [];
  for (let rr = 0; rr < ROWS; rr++) for (let cc = 0; cc < COLS; cc++) {
    const k = K(rr, cc);
    if ((rr === r && cc === c) || taken.has(k)) continue;
    const q = g[rr][cc];
    if (!q || q.t === ITEM) continue;
    const wanted = (q.t >= 0 && ctx.prefer && ctx.prefer.has(q.t)) || (ctx.rock && q.t === ROCK && !q.k) || (ctx.barrel && q.k === 'barril') || (ctx.weed && q.t === WEED)
      || (ctx.floor && ctx.floor[rr][cc] > 0 && (!ctx.front || ctx.front.has(k))) || (ctx.wire && q.w) || (ctx.fog && ctx.fog[rr][cc] > 0);
    if (wanted) pref.push(k); else any.push(k);
  }
  const list = pref.length ? pref : any;
  if (!list.length) return null;
  return list[Math.floor(ctx.rand() * list.length)];
}

function areaCells(r, c, R, D) {
  const out = [];
  for (let dr = -R; dr <= R; dr++) for (let dc = -R; dc <= R; dc++) {
    const rr = r + dr, cc = c + dc;
    if (rr < 0 || rr >= ROWS || cc < 0 || cc >= COLS) continue;
    if (Math.abs(dr) + Math.abs(dc) > D) continue;
    out.push(K(rr, cc));
  }
  return out;
}
const rowCells = (r) => Array.from({ length: COLS }, (_, i) => K(r, i));
const colCells = (c) => Array.from({ length: ROWS }, (_, i) => K(i, c));

// Qué rompe cada booster. Devuelve celdas y, si corresponde, vuelos de cóndor o rayos de la Llave.
function effect(p, r, c, g, ctx, taken) {
  const cells = [], flights = [];
  let beam = null;
  const add = (arr) => arr.forEach((k) => cells.push(k));
  const s = p.s;
  if (s === 'h') add(rowCells(r));
  else if (s === 'v') add(colCells(c));
  else if (s === 'x') { add(rowCells(r)); add(colCells(c)); }
  else if (s === 'xo') { for (let d = -1; d <= 1; d++) { if (r + d >= 0 && r + d < ROWS) add(rowCells(r + d)); if (c + d >= 0 && c + d < COLS) add(colCells(c + d)); } }
  else if (s === 'o') add(areaCells(r, c, 2, 3));
  else if (s === 'o2') add(areaCells(r, c, 3, 5));
  else if (s === 'c' || s === 'c3') {
    add(areaCells(r, c, 1, 1));
    const n = s === 'c3' ? 3 : 1;
    const local = new Set([...taken, ...cells]);
    for (let i = 0; i < n; i++) {
      const t = pickTarget(g, r, c, ctx, local);
      if (t === null) break;
      local.add(t);
      const [tr, tc] = RC(t);
      flights.push({ from: [r, c], to: [tr, tc], carry: p.carry || null });
      if (p.carry) add(effect({ s: p.carry }, tr, tc, g, ctx, local).cells);
      else cells.push(t);
    }
  } else if (s === 'b') {
    const color = p.color !== undefined ? p.color : mostCommonColor(g);
    const targets = [];
    if (color !== null) for (let rr = 0; rr < ROWS; rr++) for (let cc = 0; cc < COLS; cc++) { const q = g[rr][cc]; if (q && q.t === color) { cells.push(K(rr, cc)); targets.push([rr, cc]); } }
    beam = { from: [r, c], to: targets };
  } else if (s === 'all') {
    for (let k = 0; k < ROWS * COLS; k++) cells.push(k);
  }
  return { cells, flights, beam };
}

// Expande en cadena: todo booster alcanzado por una explosión también explota
function expandSpecials(g, clear, keep, ctx) {
  const triggered = [], flights = [], beams = [];
  const done = new Set();
  const queue = [...clear];
  while (queue.length) {
    const k = queue.shift();
    if (done.has(k)) continue;
    done.add(k);
    if (keep && keep.has(k)) continue;
    const [r, c] = RC(k);
    const p = g[r][c];
    if (p && p.s) {
      triggered.push({ r, c, s: p.s, carry: p.carry || null });
      const e = effect(p, r, c, g, ctx, clear);
      flights.push(...e.flights);
      if (e.beam) beams.push(e.beam);
      for (const x of e.cells) if (!clear.has(x)) { clear.add(x); queue.push(x); }
    }
  }
  return { triggered, flights, beams };
}

function pack(clear, created, fx, extra) {
  return Object.assign({ clear: [...clear], created, triggered: fx.triggered, flights: fx.flights, beams: fx.beams, converted: [] }, extra || {});
}

function resolveStep(g, swapPos, ctx) {
  const groups = findGroups(g);
  if (!groups.length) return null;
  const clear = new Set();
  const created = [];
  for (const G of groups) {
    const straight = G.runs.filter((r) => r.dir !== 'sq');
    const longest = straight.reduce((a, b) => (!a || b.cells.length > a.cells.length ? b : a), null);
    const hasH = straight.some((r) => r.dir === 'h'), hasV = straight.some((r) => r.dir === 'v');
    let special = null;
    if (longest && longest.cells.length >= 5) special = 'b';
    else if (hasH && hasV) special = 'o';
    else if (longest && longest.cells.length === 4) special = longest.dir === 'h' ? 'h' : 'v';
    else if (G.runs.some((r) => r.dir === 'sq')) special = 'c';
    G.cells.forEach((k) => clear.add(k));
    if (special) {
      let pos = swapPos && swapPos.find(([r, c]) => G.cells.has(K(r, c)));
      if (!pos) {
        const src = longest || G.runs[0];
        const free = src.cells.filter(([r, c]) => !fixed(g[r][c]));
        const list = free.length ? free : src.cells;
        pos = list[Math.floor((list.length - 1) / 2)];
      }
      created.push({ r: pos[0], c: pos[1], piece: { t: -1, s: special } });
    }
  }
  const hits = [];
  for (const G of groups) G.cells.forEach((k) => {
    const [r, c] = RC(k);
    for (const [dr, dc] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const rr = r + dr, cc = c + dc;
      if (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS && g[rr][cc] && (g[rr][cc].t === ROCK || g[rr][cc].t === WEED)) hits.push(K(rr, cc));
    }
  });
  hits.forEach((k) => clear.add(k));
  const keep = new Set(created.map((o) => K(o.r, o.c)));
  const fx = expandSpecials(g, clear, keep, ctx);
  created.forEach((o) => clear.delete(K(o.r, o.c)));
  return pack(clear, created, fx);
}

// Tocar un booster (o romperlo con la pala)
function activateAt(g, cells, ctx) {
  const clear = new Set(cells.map(([r, c]) => K(r, c)));
  const fx = expandSpecials(g, clear, null, ctx);
  return pack(clear, [], fx);
}

// Deslizar un booster: solo, contra una ficha, o combinado con otro booster.
// a = de dónde salió la ficha arrastrada, b = adónde llegó (ya intercambiadas).
function activateSwap(g, a, b, ctx) {
  const pa = g[a[0]][a[1]], pb = g[b[0]][b[1]];
  const ka = K(a[0], a[1]), kb = K(b[0], b[1]);
  const both = pa.s && pb.s;
  if (!both) {
    // un solo booster: se activa donde quedó
    const pos = pa.s ? a : b;
    const other = pa.s ? pb : pa;
    const p = g[pos[0]][pos[1]];
    if (p.s === 'b' && other.t >= 0) p.color = other.t;
    return activateAt(g, [pos], ctx);
  }
  const center = b;
  const kc = K(center[0], center[1]), ko = kc === kb ? ka : kb;
  const s1 = pa.s, s2 = pb.s;
  const has = (x) => s1 === x || s2 === x;
  const line = (x) => x === 'h' || x === 'v';
  const clear = new Set([kc, ko]);
  const keep = new Set([ko]);
  let converted = [];
  if (s1 === 'b' && s2 === 'b') {
    g[center[0]][center[1]] = { t: -1, s: 'all' };
  } else if (has('b')) {
    // la Llave convierte un color entero en el otro booster
    const otherS = s1 === 'b' ? s2 : s1;
    const color = mostCommonColor(g);
    keep.add(kc);
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const q = g[r][c];
      if (q && q.t === color) {
        const s = line(otherS) ? (ctx.rand() < 0.5 ? 'h' : 'v') : otherS;
        g[r][c] = { t: -1, s };
        converted.push({ r, c, s });
        clear.add(K(r, c));
      }
    }
    converted.forEach((o) => clear.add(K(o.r, o.c)));
    const fx = expandSpecials(g, clear, keep, ctx);
    fx.beams.push({ from: center, to: converted.map((o) => [o.r, o.c]) });
    return pack(clear, [], fx, { converted });
  } else if (line(s1) && line(s2)) {
    g[center[0]][center[1]] = { t: -1, s: 'x' };
  } else if ((line(s1) && s2 === 'o') || (s1 === 'o' && line(s2))) {
    g[center[0]][center[1]] = { t: -1, s: 'xo' };
  } else if (s1 === 'o' && s2 === 'o') {
    g[center[0]][center[1]] = { t: -1, s: 'o2' };
  } else if (s1 === 'c' && s2 === 'c') {
    g[center[0]][center[1]] = { t: -1, s: 'c3' };
  } else if (has('c')) {
    const carry = s1 === 'c' ? s2 : s1;
    g[center[0]][center[1]] = { t: -1, s: 'c', carry };
  }
  const fx = expandSpecials(g, clear, keep, ctx);
  return pack(clear, [], fx);
}

function applyClear(g, res, floor, fog) {
  const got = {}, removed = [], damaged = [], floorHit = [], unwired = [], fogHit = [];
  const add = (key) => { got[key] = (got[key] || 0) + 1; };
  const scrub = (r, c) => { if (floor && floor[r][c] > 0) { floor[r][c]--; add('floor'); floorHit.push(K(r, c)); } };
  for (const k of res.clear) {
    const [r, c] = RC(k);
    const p = g[r][c];
    if (!p || p.t === ITEM) continue;
    if (p.w) { p.w = 0; add('wire'); unwired.push(k); scrub(r, c); continue; }
    if (p.t === ROCK) {
      p.hp--;
      if (p.hp > 0) { damaged.push(k); continue; }
      if (p.k === 'barril') { add('barrel'); add('coin'); } else add('rock');
    } else if (p.t === WEED) add('weed');
    else if (p.t >= 0) add(p.t);
    scrub(r, c);
    g[r][c] = null;
    removed.push(k);
  }
  for (const o of res.created) {
    if (fixed(g[o.r][o.c])) { add('wire'); unwired.push(K(o.r, o.c)); }
    g[o.r][o.c] = o.piece; scrub(o.r, o.c);
  }
  if (fog) {
    const touched = [...removed, ...damaged, ...unwired, ...res.created.map((o) => K(o.r, o.c))];
    for (const k of touched) {
      const [r, c] = RC(k);
      for (const [dr, dc] of [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const rr = r + dr, cc = c + dc;
        if (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS && fog[rr][cc] > 0) { fog[rr][cc] = 0; add('fog'); fogHit.push(K(rr, cc)); }
      }
    }
  }
  return { got, removed, damaged, floorHit, unwired, fogHit };
}

// La maleza crece: una ficha común al lado de una maleza se vuelve maleza
function growWeed(g, rand) {
  const opts = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const p = g[r][c];
    if (!p || p.t < 0 || p.s || p.w) continue;
    if ([[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dr, dc]) => { const q = g[r + dr] && g[r + dr][c + dc]; return q && q.t === WEED; })) opts.push([r, c]);
  }
  if (!opts.length) return null;
  const [r, c] = opts[Math.floor(rand() * opts.length)];
  g[r][c] = { t: WEED };
  return [r, c];
}

// El agua de la acequia: desde las bocas de arriba corre hacia abajo y a los costados por donde no hay tierra
function flowWater(floor, src) {
  const wet = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
  const q = [];
  for (const c of src) if (floor[0][c] === 0) { wet[0][c] = 1; q.push([0, c]); }
  while (q.length) {
    const [r, c] = q.shift();
    for (const [dr, dc] of [[1, 0], [0, 1], [0, -1]]) {
      const rr = r + dr, cc = c + dc;
      if (rr < ROWS && cc >= 0 && cc < COLS && !wet[rr][cc] && floor[rr][cc] === 0) { wet[rr][cc] = 1; q.push([rr, cc]); }
    }
  }
  const bottom = wet[ROWS - 1].reduce((a, b) => a + b, 0);
  return { wet, bottom };
}
// Casillas de tierra que tocan el agua (adonde conviene apuntar)
function waterFront(floor, wet) {
  const out = new Set();
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (!floor[r][c]) continue;
    if ((r === 0) || [[-1, 0], [0, 1], [0, -1]].some(([dr, dc]) => wet[r + dr] && wet[r + dr][c + dc])) out.add(K(r, c));
  }
  return out;
}

// La cajita que llegó a la fila de abajo se cobra
function collectDrops(g) {
  const out = [];
  for (let c = 0; c < COLS; c++) if (g[ROWS - 1][c] && g[ROWS - 1][c].t === ITEM) { out.push([ROWS - 1, c]); g[ROWS - 1][c] = null; }
  return out;
}

// Ubica piedras, suelo y cajitas al empezar un nivel (en espejo, para que se vea prolijo)
function pickCells(spec, rand, avoid) {
  const [r0, r1] = spec.rows || [0, ROWS - 1];
  const half = [];
  for (let r = r0; r <= r1; r++) for (let c = 0; c <= 3; c++) half.push([r, c]);
  for (let i = half.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [half[i], half[j]] = [half[j], half[i]]; }
  const out = [], seen = new Set();
  for (const [r, c] of half) {
    if (out.length >= spec.n) break;
    for (const cc of c === 3 ? [3] : [c, COLS - 1 - c]) {
      const k = K(r, cc);
      if (out.length < spec.n && !seen.has(k) && !(avoid && avoid.has(k))) { seen.add(k); out.push([r, cc]); }
    }
  }
  return out;
}
function setupObstacles(g, lv, rand) {
  const floor = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
  if (lv.floor) pickCells(lv.floor, rand).forEach(([r, c]) => { floor[r][c] = lv.floor.hp || 1; });
  const used = new Set();
  if (lv.rocks) pickCells(lv.rocks, rand).forEach(([r, c]) => { g[r][c] = { t: ROCK, hp: lv.rocks.hp || 1 }; used.add(K(r, c)); });
  if (lv.wire) pickCells(lv.wire, rand, used).forEach(([r, c]) => { if (g[r][c].t >= 0 && !g[r][c].s) { g[r][c].w = 1; used.add(K(r, c)); } });
  if (lv.barrels) pickCells(lv.barrels, rand, used).forEach(([r, c]) => { g[r][c] = { t: ROCK, hp: lv.barrels.hp || 3, k: 'barril' }; used.add(K(r, c)); });
  if (lv.weeds) pickCells(lv.weeds, rand, used).forEach(([r, c]) => { g[r][c] = { t: WEED }; used.add(K(r, c)); });
  if (lv.water) { for (const c of lv.water.src) floor[0][c] = 0; }
  if (lv.drop) {
    const cols = [1, 2, 3, 4, 5].filter((c) => !used.has(K(0, c)));
    for (let i = 0; i < Math.min(lv.drop.start || 1, cols.length); i++) {
      const c = cols.splice(Math.floor(rand() * cols.length), 1)[0];
      g[0][c] = { t: ITEM };
    }
  }
  return floor;
}
function setupFog(lv, rand) {
  const fog = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
  if (lv.fog) pickCells(lv.fog, rand).forEach(([r, c]) => { fog[r][c] = 1; });
  return fog;
}

// Caída: las fichas bajan por su columna. Las atadas con alambre no se mueven y frenan lo que viene de arriba;
// el hueco que queda debajo de un alambre se llena con una ficha vecina que se desliza en diagonal.
function gravity(g, rand, types) {
  const start = new Map(), born = new Set();
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (g[r][c]) start.set(g[r][c], [r, c]);
  const settle = () => {
    for (let c = 0; c < COLS; c++) {
      let r = ROWS - 1;
      while (r >= 0) {
        if (fixed(g[r][c])) { r--; continue; }
        const bottom = r;
        let top = r;
        while (top > 0 && !fixed(g[top - 1][c])) top--;
        let w = bottom;
        for (let rr = bottom; rr >= top; rr--) if (g[rr][c]) { if (rr !== w) { g[w][c] = g[rr][c]; g[rr][c] = null; } w--; }
        if (top === 0) for (let rr = w; rr >= 0; rr--) { const p = { t: Math.floor(rand() * types), s: null }; g[rr][c] = p; born.add(p); }
        r = top - 1;
      }
    }
  };
  const slide = () => {
    for (let r = ROWS - 1; r > 0; r--) for (let c = 0; c < COLS; c++) {
      if (g[r][c]) continue;
      for (const dc of rand() < 0.5 ? [-1, 1] : [1, -1]) {
        const cc = c + dc;
        if (cc < 0 || cc >= COLS) continue;
        const p = g[r - 1][cc];
        if (p && !fixed(p)) { g[r][c] = p; g[r - 1][cc] = null; return true; }
      }
    }
    return false;
  };
  settle();
  for (let guard = 0; guard < 80 && slide(); guard++) settle();
  // si quedó algún hueco encerrado entre alambres, aparece una ficha nueva ahí
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (!g[r][c]) { const p = { t: Math.floor(rand() * types), s: null }; g[r][c] = p; born.add(p); }
  const moves = [], spawns = [];
  for (let r = ROWS - 1; r >= 0; r--) for (let c = 0; c < COLS; c++) {
    const p = g[r][c];
    if (born.has(p)) { spawns.push({ r, c }); continue; }
    const s = start.get(p);
    if (s && (s[0] !== r || s[1] !== c)) moves.push({ from: s, to: [r, c] });
  }
  for (let c = 0; c < COLS; c++) { const list = spawns.filter((s) => s.c === c).sort((a, b) => a.r - b.r); list.forEach((s, i) => { s.fromRow = i - list.length; }); }
  return { moves, spawns };
}

const movable = (p) => p && p.t !== ROCK && p.t !== WEED && !p.w;
function swapCells(g, a, b) { const t = g[a[0]][a[1]]; g[a[0]][a[1]] = g[b[0]][b[1]]; g[b[0]][b[1]] = t; }

function findMove(g) {
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    for (const [dr, dc] of [[0, 1], [1, 0]]) {
      const r2 = r + dr, c2 = c + dc;
      if (r2 >= ROWS || c2 >= COLS) continue;
      if (!movable(g[r][c]) || !movable(g[r2][c2])) continue;
      if (g[r][c].s || g[r2][c2].s) return [[r, c], [r2, c2]];
      swapCells(g, [r, c], [r2, c2]);
      const ok = hasMatch(g);
      swapCells(g, [r, c], [r2, c2]);
      if (ok) return [[r, c], [r2, c2]];
    }
  }
  return null;
}

// Jugada que se ve: las dos fichas que se cambian y la combinación que arman están fuera de la niebla
function findVisibleMove(g, fog) {
  if (!fog || !fog.some((row) => row.some((v) => v > 0))) return findMove(g);
  const clear = (r, c) => !fog[r][c];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    for (const [dr, dc] of [[0, 1], [1, 0]]) {
      const r2 = r + dr, c2 = c + dc;
      if (r2 >= ROWS || c2 >= COLS) continue;
      if (!clear(r, c) || !clear(r2, c2)) continue;
      if (!movable(g[r][c]) || !movable(g[r2][c2])) continue;

/* ===== Estado ===== */
const fresh = () => ({ unlocked: 0, got: {}, levels: {}, coins: 300, lives: MAX_LIVES, livesTs: Date.now(), daily: '',
  inv: { zonda: 1, volcan: 1, llave: 1, pala: 2, tijera: 1, guante: 2 } });
let save = fresh();
try {
  const s = JSON.parse(localStorage.getItem('mapa-bernardo') || 'null');
  if (s && typeof s.unlocked === 'number') save = Object.assign(fresh(), s, { inv: Object.assign(fresh().inv, s.inv || {}), levels: s.levels || {} });
  // un lugar terminado queda terminado aunque ahora tenga un nivel más
  Object.keys(save.got).forEach((k) => { if (save.got[k] && LEVELS[k]) save.levels[k] = LEVELS[k].length; });
} catch (e) {}
const persist = () => { try { localStorage.setItem('mapa-bernardo', JSON.stringify(save)); } catch (e) {} };

/* Progreso: se juega en orden. Un lugar está abierto si ya llegaste (todos los anteriores terminados),
   si ya lo terminaste o si lo tenías empezado de antes. */
const nLv = (ch) => LEVELS[ch.id].length;
const lvDoneOf = (ch) => Math.min(save.levels[ch.id] || 0, nLv(ch));
function frontier() { const i = CHAPTERS.findIndex((c) => !save.got[c.id]); return i < 0 ? CHAPTERS.length : i; }
function isOpen(i) { const c = CHAPTERS[i]; return !!save.allOpen || i <= frontier() || !!save.got[c.id] || (save.levels[c.id] || 0) > 0; }
const levelNumber = (ch, L) => { let n = 0; for (const c of CHAPTERS) { if (c === ch) return n + L + 1; n += nLv(c); } return L + 1; };

function syncLives() {
  if (save.lives >= MAX_LIVES) { save.lives = MAX_LIVES; return; }
  const now = Date.now(), n = Math.floor((now - save.livesTs) / REGEN);
  if (n > 0) {
    save.lives = Math.min(MAX_LIVES, save.lives + n);
    save.livesTs += n * REGEN;
    if (save.lives >= MAX_LIVES) save.livesTs = now;
    persist();
  }
}
function loseLife() { syncLives(); if (save.lives >= MAX_LIVES) save.livesTs = Date.now(); save.lives = Math.max(0, save.lives - 1); persist(); refreshStats(); }
const nextLifeIn = () => (save.lives >= MAX_LIVES ? 0 : Math.max(0, save.livesTs + REGEN - Date.now()));
const fmtTime = (ms) => { const s = Math.ceil(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
function spend(price) {
  if (save.coins < price) return false;
  save.coins -= price; persist(); refreshStats(); Sound.coin();
  return true;
}
function addCoins(n) { save.coins += n; persist(); refreshStats(); }
function refreshStats() {
  syncLives();
  document.querySelectorAll('.coins-count').forEach((e) => { e.textContent = save.coins; });
  document.querySelectorAll('.lives-count').forEach((e) => { e.textContent = save.lives; });
  document.querySelectorAll('.lives-timer').forEach((e) => { e.textContent = save.lives >= MAX_LIVES ? 'Llenas' : fmtTime(nextLifeIn()); });
  const dd = $('daily-dot'); if (dd) dd.hidden = save.daily === today();
  updateToolbar();
}

    if (!lines || !lines.length) return resolve();
    let i = 0;
    const sheet = $('sheet');
    const render = () => {
      const L = lines[i];
      const p = L.who ? P[L.who] : null;
      sheet.classList.toggle('narr', !p);
      $('d-portrait').hidden = !p;
      if (p) { $('d-portrait').style.backgroundImage = `url(${p.img})`; $('d-name').textContent = p.n; }
      $('d-name').parentElement.hidden = !p;
      $('d-chip').hidden = !L.memory;
      $('d-text').textContent = L.text;
      app.classList.toggle('memory', !!L.memory);
      if (L.img) setScene(L.img);
    };
    setScene(null);
    const finish = () => { cleanup(); setScene(null); app.classList.remove('memory'); resolve(); };
    const next = () => { Sound.tick(); i++; if (i >= lines.length) finish(); else render(); };
    const onKey = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); next(); } };
    const cleanup = () => { sheet.removeEventListener('click', next); sheet.removeEventListener('keydown', onKey); $('btn-skip').removeEventListener('click', finish); };
    sheet.addEventListener('click', next);
    sheet.addEventListener('keydown', onKey);
    $('btn-skip').addEventListener('click', finish);
    render();
    show('dialog');
    sheet.focus({ preventScroll: true });
  });
}

let modalCleanup = null;
function modal(html, buttons, fill) {
  return new Promise((resolve) => {
    if (modalCleanup) { modalCleanup(); modalCleanup = null; }
    const card = $('card');
    card.innerHTML = html + '<div class="actions"></div>';
    const act = card.querySelector('.actions');
    buttons.forEach(([label, val, ghost]) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'btn' + (ghost ? ' ghost' : ''); b.textContent = label;
      b.dataset.val = val;
      b.addEventListener('click', () => { if (b.disabled) return; Sound.tick(); if (modalCleanup) { modalCleanup(); modalCleanup = null; } $('modal').classList.add('off'); resolve(val); });
      act.appendChild(b);
    });
    if (fill) modalCleanup = fill(card) || null;
    $('modal').classList.remove('off');
    const first = act.querySelector('button:not([disabled])');
    if (first) first.focus({ preventScroll: true });
  });
}

function preLevel(ch, L) {
  const chosen = new Set();
  const lv = LEVELS[ch.id][L];
  const sp = lv.special ? SPECIAL[lv.special] : null;
  const html = `<span class="kicker">Nivel ${levelNumber(ch, L)} · ${L + 1} de ${nLv(ch)} en este lugar</span><h3></h3>
    ${sp ? `<div class="sp-tag"><img src="${sp.img}" alt="">${sp.tag}</div><p class="pre-text">${sp.desc}</p>` : ''}
    <div class="pre-goals">${goalChips(ch, lv)}</div>
    <p class="pre-text">${goalText(ch, lv)}</p>
    <p class="pre-label">Ayudas para empezar</p>
    <div class="pre-boosts">${['zonda', 'volcan', 'llave'].map((k) => `<button type="button" class="pre-b" data-k="${k}" aria-pressed="false"><img src="${ITEMS[k].img}" alt=""><span class="pre-name">${ITEMS[k].name}</span><span class="pre-badge"></span></button>`).join('')}</div>
    <div class="pre-lives"></div>`;
  return modal(html, [['Jugar', 'play'], ['Volver al mapa', 'map', 1]], (card) => {
    card.querySelector('h3').textContent = ch.name;
    const playBtn = card.querySelector('[data-val="play"]');
    const paint = () => {
      card.querySelectorAll('.pre-b').forEach((b) => {
        const k = b.dataset.k, on = chosen.has(k), n = save.inv[k];
        b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on));
        b.querySelector('.pre-badge').innerHTML = on ? '✓' : n > 0 ? `x${n}` : coinTag(ITEMS[k].price);
      });
      syncLives();
      const L = card.querySelector('.pre-lives');
      if (save.lives > 0) {
        L.innerHTML = `<img src="img/ui_corazon.png" alt=""><span>${save.lives} ${save.lives === 1 ? 'vida' : 'vidas'}</span>`;
        playBtn.disabled = false;
      } else {
        L.innerHTML = `<img src="img/ui_corazon.png" alt=""><span>Sin vidas. La próxima en <b class="lives-timer">${fmtTime(nextLifeIn())}</b></span><button type="button" class="mini" id="btn-refill">Llenar vidas ${coinTag(PRICE_LIVES)}</button>`;
        playBtn.disabled = true;
        card.querySelector('#btn-refill').addEventListener('click', (e) => {
          if (spend(PRICE_LIVES)) { save.lives = MAX_LIVES; save.livesTs = Date.now(); persist(); refreshStats(); paint(); }
          else { shake(e.currentTarget); }
        });
      }
    };
    card.querySelectorAll('.pre-b').forEach((b) => b.addEventListener('click', () => {
      const k = b.dataset.k;
      if (chosen.has(k)) chosen.delete(k);
      else if (save.inv[k] > 0) chosen.add(k);
      else if (spend(ITEMS[k].price)) { save.inv[k]++; persist(); chosen.add(k); }
      else { shake(b); return; }
      Sound.tick(); paint();
    }));
    paint();
    let lastLives = save.lives;
    const iv = setInterval(() => { syncLives(); if (save.lives !== lastLives) { lastLives = save.lives; paint(); } }, 1000);
    return () => clearInterval(iv);
  }).then((v) => {
    if (v !== 'play') return null;
    const list = [...chosen];
    list.forEach((k) => { save.inv[k] = Math.max(0, save.inv[k] - 1); });
    persist();
    return list;
  });
}

  for (const [t] of lv.goals) {

    if (tip && !save.seen[`tip_${t}`]) {

    onUpdate: (st) => {

async function endLevel(ch, L, won, info, replay) {
  const lv = LEVELS[ch.id][L];
  if (won) {
    setAwake(1);
    Sound.win();
    const last = nLv(ch) - 1;
    const firstWin = (save.levels[ch.id] || 0) <= L;
    const prize = lv.special && firstWin ? SPECIAL[lv.special].prize : 0;
    const earned = 25 + 5 * ((info && info.left) || 0) + prize;
    addCoins(earned);
    await new Promise((r) => setTimeout(r, 600));
    save.levels[ch.id] = Math.max(save.levels[ch.id] || 0, L + 1);
    const first = L === last && !save.got[ch.id];
    if (L === last) save.got[ch.id] = 1;
    persist();
    app.classList.remove('memory');
    Sound.chime();
    const reward = `<div class="reward coins-won"><img src="img/ui_moneda.png" alt=""><b>+${earned}</b></div>${prize ? `<p class="prize-note">Incluye el premio del nivel especial: ${prize} monedas.</p>` : ''}`;
    if (first) {
      await modal(`<span class="kicker">Conseguiste</span><div class="icon${ch.final ? ' big' : ''}">${objIcon(ch.obj.icon)}</div><h3></h3><p></p>${reward}`, [['Seguir la historia', 1]],
        (card) => { card.querySelector('h3').textContent = ch.obj.name; card.querySelector('p').textContent = ch.obj.desc; });
      await runDialog(ch.outro);
      if (ch.letter) {
        await showLetter();
        Sound.music('game');
        setBg(ch.bg, 1);
        await runDialog(ch.after);
      }
      if (ch.final) {
        Sound.chime();
        $('dialog').classList.add('off');
        await modal(`<span class="kicker">Fin</span><div class="icon big">${objIcon('llave')}</div><h3>El mapa de Bernardo</h3><p>En memoria de Bernardo y de Roberto.</p>`, [['Volver al mapa', 1]]);
      }
    } else {
      const canNext = L < last && !replay, left = last - L;
      const v = await modal(`<span class="kicker">${ch.name}</span><h3>${cheer()}</h3><p class="lvl-done">Nivel ${levelNumber(ch, L)} superado</p>${reward}${canNext ? `<p>Falta${left === 1 ? '' : 'n'} ${left} nivel${left === 1 ? '' : 'es'} para encontrar lo que dejó Bernardo.</p>` : ''}`,
        canNext ? [['Siguiente nivel', 'next'], ['Volver al mapa', 'map', 1]] : [['Volver al mapa', 'map']]);
      if (v === 'next') { beginLevel(ch, L + 1, false); return; }
    }
    renderMap();
    return;
  }
  app.classList.remove('memory');
  Sound.lose();
  const sc = await boardReady;
  const remaining = sc.state.goals.map((g) => Math.max(0, g.n - g.got));
  const v = await modal(`<span class="kicker">Sin jugadas</span><h3>Casi lo tenías</h3><p>Te falta:</p><div class="pre-goals">${goalChips(ch, lv, remaining)}</div><div class="icon small"><img src="img/ui_jugadas.png" alt=""></div>`,
    [['+5 jugadas', 'more'], ['Rendirme', 'quit', 1]],
    (card) => {
      const b = card.querySelector('[data-val="more"]');
      if (save.coins < PRICE_MOVES) { b.disabled = true; b.innerHTML = `+5 jugadas · te faltan monedas`; }
      else b.innerHTML = `+5 jugadas ${coinTag(PRICE_MOVES)}`;
    });
  if (v === 'more' && spend(PRICE_MOVES)) { app.classList.toggle('memory', !!ch.memory); sc.addMoves(5); return; }
  loseLife();
  const msg = save.lives > 0 ? `Te ${save.lives === 1 ? 'queda 1 vida' : `quedan ${save.lives} vidas`}.` : `Te quedaste sin vidas. La próxima llega en <b class="lives-timer">${fmtTime(nextLifeIn())}</b>.`;
  const v2 = await modal(`<span class="kicker">Perdiste una vida</span><div class="icon small"><img src="img/ui_corazon.png" alt=""></div><h3>No te rindas</h3><p>${msg}</p>`,
    [['Reintentar', 'retry'], ['Volver al mapa', 'map', 1]]);
  if (v2 === 'retry') beginLevel(ch, L, replay); else renderMap();
}

  }

        { transform: `scale(3.2) rotate(${rot + 8}deg)`, opacity: 1, offset: 0.28, easing: 'ease-in-out' },
        { transform: `scale(2.9) rotate(${rot - 5}deg)`, opacity: 1, offset: 0.62, easing: 'cubic-bezier(.6,0,.4,1)' },
        { transform: `scale(1) rotate(${rot}deg)`, opacity: 1, offset: 0.92 },
        { transform: `scale(1) rotate(${rot}deg)`, opacity: 0 },
      ], { duration: 1050, easing: 'linear' });

    },

    gust(r, c, vertical) {
