      fog: open.some((g) => g.t === 'fog') ? this.fog : null,
      floor: open.some((g) => g.t === 'floor' || g.t === 'water') ? this.floor : null,
      front: this.wet && open.some((g) => g.t === 'water') ? waterFront(this.floor, this.wet) : null };
  }

  // Objetivos que dependen del tablero: la maleza que queda y el agua que llegó abajo
  syncState() {
    for (const g of this.state.goals) {
      if (g.t === 'weed') { const left = this.g.flat().filter((p) => p && p.t === WEED).length; if (g.n0 === undefined) { g.n0 = 1; g.n = left; } g.got = g.n - left; }
      if (g.t === 'water' && this.lv.water) g.got = flowWater(this.floor, this.lv.water.src).bottom;
    }
  }
  drawFog() {
    Object.values(this.fogS).forEach((s) => s.destroy());
    this.fogS = {};
    if (!this.fog || !this.textures.exists('niebla')) return;
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      if (!this.fog[r][c]) continue;
      const [x, y] = this.xy(r, c);
      const s = this.add.image(x, y, 'niebla').setDisplaySize(CELL * 1.12, CELL * 1.12).setDepth(3.5).setAlpha(0.97);
      s.base = s.scaleX;
      this.tweens.add({ targets: s, x: x + 3, y: y - 2, duration: 1600 + ((r * 7 + c * 3) % 5) * 200, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
      this.fogS[K(r, c)] = s;
    }
  }
  clearFog(k, delay) {
    const s = this.fogS[k];
    if (!s) return;
    delete this.fogS[k];
    this.tweens.killTweensOf(s);
    const [r, c] = RC(k), [x, y] = this.xy(r, c);
    this.time.delayedCall(delay || 0, () => this.particles(x, y, { n: 5, colors: ['#ffffff', '#e6eef8'], tex: 'puff', speed: 90, size: 0.8, gravity: -60, life: 700, grow: 1.6, depth: 7 }));
    this.tweens.add({ targets: s, scale: s.base * 1.5, alpha: 0, y: y - CELL * 0.3, duration: 520, delay: delay || 0, ease: 'Quad.easeOut', onComplete: () => s.destroy() });
  }
  // El agua avanza: las casillas nuevas se llenan con un chapoteo
  updateWater() {
    if (!this.lv.water) return;
    const prev = this.wet, now = flowWater(this.floor, this.lv.water.src).wet;
    this.wet = now;
    const fresh = [];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (now[r][c] && !(prev && prev[r][c])) fresh.push([r, c]);
    this.drawFloor();
    if (!fresh.length) return;
    Sound.water();
    fresh.forEach(([r, c], i) => {
      const [x, y] = this.xy(r, c), d = r * 60 + i * 10;
      const t = this.floorS.find((s) => Math.abs(s.x - x) < 1 && Math.abs(s.y - y) < 1);
      if (t) { const b = t.scaleX; t.setScale(b * 0.2).setAlpha(0); this.tweens.add({ targets: t, scale: b, alpha: 1, duration: 320, delay: d, ease: 'Back.easeOut' }); }
      this.time.delayedCall(d, () => this.particles(x, y, { n: 6, colors: ['#7fe3ff', '#ffffff', '#3cb6e0'], speed: 200, lift: 140, size: 0.4, gravity: 800, life: 500 }));
    });
  }
  startLevel(cfg) {
    this.tweens.killAll();
    this.time.removeAllEvents();
    this.sprites.flat().forEach((s) => s && s.destroy());
    this.fx.clear();
    this.cfg = cfg;
    this.set = cfg.set;
    this.lv = cfg.lv;
    for (let t = 0; t < 6; t++) this.makeTex(this.set, t, null);
    this.state = { moves: cfg.moves, goals: cfg.goals };
    this.rand = Math.random;
    for (let tries = 0; tries < 40; tries++) {
      this.g = newGrid(this.rand, cfg.types);
      this.floor = setupObstacles(this.g, this.lv, this.rand);
      if (findMove(this.g)) break;
    }
    if (cfg.pre && cfg.pre.length) placeSpecials(this.g, cfg.pre, this.rand);
    this.fog = setupFog(this.lv, this.rand);
    if (!findVisibleMove(this.g, this.fog)) reshuffleVisible(this.g, this.fog, this.rand);
    this.wet = this.lv.water ? flowWater(this.floor, this.lv.water.src).wet : null;
    this.syncState();
    this.drawFloor();
    this.drawFog();
    this.sprites = [];
    for (let r = 0; r < ROWS; r++) {
      this.sprites.push([]);
      for (let c = 0; c < COLS; c++) {
        const s = this.makeSprite(r, c, this.g[r][c], r - ROWS - 1);
        this.sprites[r].push(s);
        this.tweens.add({ targets: s, y: this.xy(r, c)[1], duration: 380 + r * 40, ease: 'Bounce.easeOut', delay: c * 30 });
      }
    }
    this.busy = true; this.ended = false; this.selected = null; this.down = null; this.movesUsed = 0;
    this.tool = null; this.gloveFirst = null;
    this.hideHand();
    this.time.delayedCall(950, () => { this.busy = false; if (cfg.tutorial) this.showHand(); });
    this.drawSel();
    cfg.onUpdate(this.state);
    this.armHint();
  }

  setTool(k) {
    this.tool = k; this.gloveFirst = null; this.selected = null;
    this.drawSel();
    this.cfg.onTool(k);
  }
  addMoves(n) {
    this.state.moves += n; this.ended = false; this.busy = false;
    this.cfg.onUpdate(this.state);
    toast(`+${n} jugadas`);
    this.armHint();
  }

  cellAt(p) {
    const c = Math.floor(p.x / CELL), r = Math.floor(p.y / CELL);
    return r >= 0 && r < ROWS && c >= 0 && c < COLS ? [r, c] : null;
  }
  onDown(p) {
    if (this.busy || this.ended || !this.g) return;
    const cell = this.cellAt(p);
    if (!cell) return;
    this.down = { cell, x: p.x, y: p.y, moved: false };
  }
  onMove(p) {
    if (!this.down || this.down.moved || this.busy || this.tool) return;
    const dx = p.x - this.down.x, dy = p.y - this.down.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < CELL * 0.33) return;
    this.down.moved = true;
    const [r, c] = this.down.cell;
    const t = Math.abs(dx) > Math.abs(dy) ? [r, c + Math.sign(dx)] : [r + Math.sign(dy), c];
    this.down = null;
    if (t[0] < 0 || t[0] >= ROWS || t[1] < 0 || t[1] >= COLS) return;
    this.selected = null; this.drawSel();
    this.trySwap([r, c], t);
  }
  onUp() {
    if (!this.down) return;
    const cell = this.down.cell;
    this.down = null;
    if (this.busy || this.ended) return;
    const adj = (a, b) => a && Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]) === 1;
    if (this.tool === 'pala') { if (this.g[cell[0]][cell[1]].t === ITEM) { shakeSprite(this, cell); return; } this.applyTool([cell]); return; }
    if (this.tool === 'tijera') { this.applyTool(Array.from({ length: COLS }, (_, i) => [cell[0], i])); return; }
    if (this.tool === 'guante') {
      if (!movable(this.g[cell[0]][cell[1]])) { shakeSprite(this, cell); return; }
      if (adj(this.gloveFirst, cell)) { this.applyGlove(this.gloveFirst, cell); return; }
      this.gloveFirst = cell; Sound.tick(); this.drawSel(); return;
    }
    if (adj(this.selected, cell)) {
      const a = this.selected; this.selected = null; this.drawSel(); this.trySwap(a, cell);
      return;
    }
    if (this.g[cell[0]][cell[1]].s) { this.selected = null; this.drawSel(); this.tapSpecial(cell); return; }
    this.selected = this.selected && this.selected[0] === cell[0] && this.selected[1] === cell[1] ? null : cell;
    if (this.selected) Sound.tick();
    this.drawSel();
  }
  drawSel() {
    this.sel.clear();
    const cell = this.tool === 'guante' ? this.gloveFirst : this.selected;
    if (!cell) return;
    const [r, c] = cell;
    this.sel.lineStyle(6, 0xf2b632, 1);
    this.sel.strokeRoundedRect(c * CELL + 4, r * CELL + 4, CELL - 8, CELL - 8, 14);
  }
  armHint() {
    if (this.hintTimer) this.hintTimer.remove();
    this.hintTimer = this.time.delayedCall(6000, () => {
      if (this.busy || this.ended || this.tool) return;
      const m = findVisibleMove(this.g, this.fog);
      if (!m) return;
      m.forEach(([r, c]) => { const s = this.sprites[r][c]; if (s) this.tweens.add({ targets: s, angle: { from: -10, to: 10 }, duration: 110, yoyo: true, repeat: 3, onComplete: () => s.setAngle(0) }); });
      this.armHint();
    });
  }

  async animSwap(a, b) {
    const sa = this.sprites[a[0]][a[1]], sb = this.sprites[b[0]][b[1]];
    const [ax, ay] = this.xy(...a), [bx, by] = this.xy(...b);
    await Promise.all([
      this.tween({ targets: sa, x: bx, y: by, duration: 150, ease: 'Quad.easeInOut' }),
      this.tween({ targets: sb, x: ax, y: ay, duration: 150, ease: 'Quad.easeInOut' }),
    ]);
    this.sprites[a[0]][a[1]] = sb; this.sprites[b[0]][b[1]] = sa;
  }

  useMove() {
    this.state.moves--; this.movesUsed++; this.moved = true; this.weedBroken = false; this.cfg.onUpdate(this.state);
    if (this.cfg.tutorial) { this.hideHand(); this.cfg.tutorial = false; save.tutDone = 1; persist(); }
  }
  showHand() {
    let m = null;
    for (let r = ROWS - 1; r >= 0 && !m; r--) for (let c = 0; c < COLS - 1 && !m; c++) {
      if (this.g[r][c].s || this.g[r][c + 1].s) continue;
      swapCells(this.g, [r, c], [r, c + 1]); const ok = hasMatch(this.g); swapCells(this.g, [r, c], [r, c + 1]);
      if (ok) m = [[r, c], [r, c + 1]];
    }
    if (!m) m = findMove(this.g);
    if (!m || !document.querySelector('#board canvas')) return;
    const cv = document.querySelector('#board canvas').getBoundingClientRect(), ar = app.getBoundingClientRect();
    const w = cv.width / COLS, h = cv.height / ROWS;
    const pt = ([r, c]) => [cv.left - ar.left + (c + 0.5) * w, cv.top - ar.top + (r + 0.5) * h];
    const [x0, y0] = pt(m[0]), [x1, y1] = pt(m[1]);
    const el = document.createElement('div'); el.className = 'fx-hand';
    el.style.left = `${x0}px`; el.style.top = `${y0}px`;
    $('fx').appendChild(el);
    el.animate([{ transform: 'translate(0,0) scale(1.2)', opacity: 0 }, { transform: 'translate(0,0) scale(1)', opacity: 1, offset: 0.2 },
      { transform: `translate(${x1 - x0}px,${y1 - y0}px) scale(1)`, opacity: 1, offset: 0.7 }, { transform: `translate(${x1 - x0}px,${y1 - y0}px) scale(1.2)`, opacity: 0 }],
      { duration: 1500, iterations: Infinity, easing: 'ease-in-out' });
    this.handEl = el;
    const hint = $('tool-hint'); hint.textContent = 'Deslizá la ficha para juntar 3 iguales'; hint.hidden = false;
    m.forEach(([r, c]) => { const s = this.sprites[r][c]; if (s) this.tweens.add({ targets: s, scale: s.base * 1.12, duration: 500, yoyo: true, repeat: -1 }); });
    this.handCells = m;
  }
  hideHand() {
    if (this.handEl) { this.handEl.remove(); this.handEl = null; $('tool-hint').hidden = true; }
    if (this.handCells) { this.handCells.forEach(([r, c]) => { const s = this.sprites[r] && this.sprites[r][c]; if (s) { this.tweens.killTweensOf(s); s.setScale(s.base); } }); this.handCells = null; }
  }

  async trySwap(a, b) {
    if (this.busy || this.ended) return;
    if (!movable(this.g[a[0]][a[1]]) || !movable(this.g[b[0]][b[1]])) { Sound.bad(); shakeSprite(this, movable(this.g[a[0]][a[1]]) ? b : a); return; }
    this.busy = true;
    if (this.hintTimer) this.hintTimer.remove();
    Sound.swap();
    await this.animSwap(a, b);
    swapCells(this.g, a, b);
    const pa = this.g[a[0]][a[1]], pb = this.g[b[0]][b[1]];
    let res = null;
    if (pa.s || pb.s) res = activateSwap(this.g, a, b, this.ctx());
    else if (!hasMatch(this.g)) {
      Sound.bad();
      await this.animSwap(a, b);
      swapCells(this.g, a, b);
      this.busy = false; this.armHint();
      return;
    }
    this.useMove();
    await this.cascade(res, [a, b]);
    await this.afterMove();
  }

  async tapSpecial(cell) {
    if (this.busy || this.ended) return;
    this.busy = true;
    if (this.hintTimer) this.hintTimer.remove();
    this.useMove();
    await this.cascade(activateAt(this.g, [cell], this.ctx()), null);
    await this.afterMove();
  }

  async applyTool(cells) {
    if (this.busy || this.ended) return;
    this.busy = true;
    if (this.hintTimer) this.hintTimer.remove();
    const k = this.tool;
    this.setTool(null);
    this.cfg.onToolUsed(k);
    Sound.swap();
    const res = activateAt(this.g, cells, this.ctx());
    if (k === 'tijera') res.triggered.push({ r: cells[0][0], c: 3, s: 'h' });
    await this.cascade(res, null);
    await this.afterMove();
  }

  async applyGlove(a, b) {
    if (this.busy || this.ended) return;
    this.busy = true;
    if (this.hintTimer) this.hintTimer.remove();
    this.setTool(null);
    this.cfg.onToolUsed('guante');
    Sound.swap();
    await this.animSwap(a, b);
    swapCells(this.g, a, b);
    await this.cascade(null, [a, b]);
    await this.afterMove();
  }

  async cascade(res, swapPos) {
    let combo = 0, first = true;
    while (true) {
      if (!res) res = resolveStep(this.g, first ? swapPos : null, this.ctx());
      first = false;
      if (!res) { if (await this.collectDrops()) continue; break; }
      combo++;
      const out = applyClear(this.g, res, this.floor, this.fog);
      if (out.got.weed) this.weedBroken = true;
      await this.animClear(res, combo, out);
      this.state.goals.forEach((g) => { if (g.t !== 'weed' && g.t !== 'water') g.got += out.got[g.t] || 0; });
      if (out.got.coin && this.cfg.onCoins) this.cfg.onCoins(out.got.coin);
      this.updateWater();
      this.syncState();
      this.cfg.onUpdate(this.state);
      await this.animGravity(gravity(this.g, this.rand, this.cfg.types));
      this.spawnItems();
      res = null;
    }
    if (combo >= 2) this.cfg.onCombo(combo);
  }

  async afterMove() {
    let won = this.state.goals.every((g) => g.got >= g.n);
    if (!won && this.moved && this.lv.weeds && !this.weedBroken && this.state.moves > 0) {
      const cell = growWeed(this.g, this.rand);
      if (cell) {
        const [r, c] = cell, [x, y] = this.xy(r, c);
        this.setPieceTex(r, c);
        const sp = this.sprites[r][c];
        if (sp) { sp.setScale(sp.base * 0.3); this.tweens.add({ targets: sp, scale: sp.base, duration: 360, ease: 'Back.easeOut' }); }
        this.particles(x, y, { n: 7, colors: ['#5d7a2a', '#8fb84a'], tex: 'chip', speed: 180, lift: 80, size: 0.45, gravity: 600, life: 500, depth: 9 });
        Sound.grow();
        toast('¡Creció la maleza!');
        this.syncState(); this.cfg.onUpdate(this.state);
        await this.wait(380);
      }
    }
    this.moved = false; this.weedBroken = false;
    won = this.state.goals.every((g) => g.got >= g.n);
    if (won) {
      this.ended = true; this.busy = false;
      const left = this.state.moves;
      toast('¡Lo lograste!');
      await this.wait(700);
      await this.finalRush();
      this.cfg.onEnd(true, { left });
      return;
    }
    if (this.state.moves <= 0) {
      this.ended = true; this.busy = false;
      await this.wait(500);
      this.cfg.onEnd(false);
      return;
    }
    await this.ensureMove();
    this.busy = false;
    this.armHint();
  }

  // Siempre tiene que quedar una jugada que se vea. Si la niebla las tapa todas, se mezclan las fichas visibles;
  // si aun así no hay, se despeja la niebla de una jugada. Si la maleza dejó el tablero trabado, se arranca una.
  async ensureMove() {
    const hasFog = this.fog && this.fog.some((row) => row.some((v) => v > 0));
    if (findVisibleMove(this.g, this.fog)) return;
    if (hasFog && findMove(this.g)) {
      if (reshuffleVisible(this.g, this.fog, this.rand)) { await this.redraw(); return; }
      const m = findMove(this.g);
      const cells = new Set();
      m.forEach(([r, c]) => { cells.add(K(r, c)); });
      swapCells(this.g, m[0], m[1]);
      for (const run of [...findRuns(this.g), ...findSquares(this.g)]) if (run.cells.some(([a, b]) => m.some(([r, c]) => r === a && c === b))) run.cells.forEach(([a, b]) => cells.add(K(a, b)));
      swapCells(this.g, m[0], m[1]);
      let n = 0;
      cells.forEach((k) => { const [r, c] = RC(k); if (this.fog[r][c]) { this.fog[r][c] = 0; n++; this.clearFog(k, n * 60); } });
      const fg = this.state.goals.find((g) => g.t === 'fog'); if (fg) fg.got += n;
      this.cfg.onUpdate(this.state);
      await this.wait(500);
      return;
    }
    for (let i = 0; i < 6 && !findMove(this.g); i++) {
      if (reshuffle(this.g, this.rand)) break;
      const w = [];
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (this.g[r][c].t === WEED) w.push([r, c]);
      if (!w.length) break;
      const [r, c] = w[Math.floor(this.rand() * w.length)];
      this.g[r][c] = { t: Math.floor(this.rand() * this.cfg.types), s: null };
    }
    this.syncState(); this.cfg.onUpdate(this.state);
    await this.redraw();
    if (hasFog && !findVisibleMove(this.g, this.fog)) await this.ensureMove();
  }

  // Jugadas que sobran: se vuelven Zondas que barren el tablero
  async finalRush() {
    const n = Math.min(this.state.moves, 10);
    if (n <= 0) return;
    toast('¡Jugadas extra!');
    this.rushing = true;
    const placed = placeSpecials(this.g, Array(n).fill('zonda'), this.rand);
    for (const o of placed) {
      this.setPieceTex(o.r, o.c);
      const s = this.sprites[o.r][o.c];
      if (s) this.tweens.add({ targets: s, scale: s.base * 1.3, duration: 120, yoyo: true });
      this.state.moves--; this.cfg.onUpdate(this.state);
      Sound.tick();
      await this.wait(90);
    }
    this.state.moves = 0; this.cfg.onUpdate(this.state);
    await this.wait(250);
    await this.cascade(activateAt(this.g, placed.map((o) => [o.r, o.c]), this.ctx()), null);
    this.rushing = false;
  }

  blast(t) {
    const g = this.fx, W = COLS * CELL, H = ROWS * CELL;
    const row = (r) => { if (r >= 0 && r < ROWS) { g.fillStyle(0xfff3c8, 0.8); g.fillRoundedRect(0, r * CELL + CELL * 0.28, W, CELL * 0.44, 14); } };
    const col = (c) => { if (c >= 0 && c < COLS) { g.fillStyle(0xfff3c8, 0.8); g.fillRoundedRect(c * CELL + CELL * 0.28, 0, CELL * 0.44, H, 14); } };
    const [x, y] = this.xy(t.r, t.c);
    const big = FX.on && this.bigFx > 0;
    if (big && t.s !== 'b') this.bigFx--;
    const wind = (v) => (big ? FX.gust(t.r, t.c, v) : this.windFly(x, y, v));
    if (t.s === 'h') { row(t.r); wind(0); }
    else if (t.s === 'v') { col(t.c); wind(1); }
    else if (t.s === 'x') { row(t.r); col(t.c); wind(0); wind(1); }
    else if (t.s === 'xo') { for (let d = -1; d <= 1; d++) { row(t.r + d); col(t.c + d); } wind(0); wind(1); if (big) FX.volcano(t.r, t.c, false); else this.cameras.main.shake(220, 0.01); }
    else if (t.s === 'o' || t.s === 'o2') {
      const R = (t.s === 'o' ? 2.6 : 3.8) * CELL;
      g.fillStyle(0xff8a2a, 0.45); g.fillCircle(x, y, R);
      g.fillStyle(0xffd27a, 0.6); g.fillCircle(x, y, R * 0.55);
      if (big) FX.volcano(t.r, t.c, t.s === 'o2'); else this.cameras.main.shake(260, t.s === 'o' ? 0.012 : 0.02);
    } else if (t.s === 'all') { g.fillStyle(0xf2b632, 0.45); g.fillRect(0, 0, W, H); if (big) FX.key(t.r, t.c, true); else this.cameras.main.shake(300, 0.015); }
    else if (t.s === 'b' && FX.on) FX.key(t.r, t.c, false);
  }
  windFly(x, y, vertical) {
    const W = COLS * CELL, H = ROWS * CELL;
    for (const dir of [-1, 1]) {
      const s = this.add.image(x, y, 'sp_h').setDisplaySize(CELL * 1.1, CELL * 1.1).setDepth(7).setAngle(vertical ? 90 : 0);
      const to = vertical ? { y: dir < 0 ? -CELL : H + CELL } : { x: dir < 0 ? -CELL : W + CELL };
      this.tweens.add({ targets: s, ...to, duration: 380, ease: 'Quad.easeIn', onComplete: () => s.destroy() });
    }
  }
  flyCondor(f) {
    if (FX.on) return FX.condor(f.from, f.to, f.carry).then(() => { if (f.carry) this.blast({ r: f.to[0], c: f.to[1], s: f.carry }); });
    const [fx, fy] = this.xy(...f.from), [tx, ty] = this.xy(...f.to);
    const s = this.add.image(fx, fy, 'sp_c').setDisplaySize(CELL * 1.25, CELL * 1.25).setDepth(8);
    s.setFlipX(tx < fx);
    const base = s.scaleX;
    let carry = null;
    if (f.carry) carry = this.add.image(fx, fy + CELL * 0.35, `sp_${f.carry}`).setDisplaySize(CELL * 0.6, CELL * 0.6).setDepth(7);
    const dur = 360 + Math.hypot(tx - fx, ty - fy) * 0.35;
    this.tweens.add({ targets: s, scale: base * 1.35, duration: dur / 2, yoyo: true });
    if (carry) this.tweens.add({ targets: carry, x: tx, y: ty + CELL * 0.35, duration: dur, ease: 'Sine.easeInOut', onComplete: () => carry.destroy() });
    return this.tween({ targets: s, x: tx, y: ty, duration: dur, ease: 'Sine.easeInOut' }).then(() => {
      if (f.carry) this.blast({ r: f.to[0], c: f.to[1], s: f.carry });
      this.tweens.add({ targets: s, alpha: 0, duration: 160, onComplete: () => s.destroy() });
    });
  }
  drawBeams(beams) {
    const g = this.fx;
    for (const b of beams) {
      const [x0, y0] = this.xy(...b.from);
      g.lineStyle(6, 0xffd65a, 0.9);
      for (const t of b.to) { const [x1, y1] = this.xy(...t); g.lineBetween(x0, y0, x1, y1); }
      g.fillStyle(0xfff3c8, 0.9);
      for (const t of b.to) { const [x1, y1] = this.xy(...t); g.fillCircle(x1, y1, CELL * 0.32); }
    }
  }

  // Partículas con gravedad (polvo, chispas, pedazos)
  particles(x, y, o) {
    const n = o.n || 8;
    for (let i = 0; i < n; i++) {
      const a = o.angle !== undefined ? o.angle + (Math.random() - 0.5) * (o.spread || 1) : Math.random() * Math.PI * 2;
      const sp = (o.speed || 240) * (0.45 + Math.random() * 0.75);
      const vx = Math.cos(a) * sp, vy = Math.sin(a) * sp - (o.lift || 0);
      const img = this.add.image(x, y, o.tex || 'dot').setDepth(o.depth || 8);
      const col = o.colors[Math.floor(Math.random() * o.colors.length)];
      img.setTint(Phaser.Display.Color.HexStringToColor(col).color);
      const sc = (o.size || 0.6) * (0.6 + Math.random() * 0.7);
      img.setScale(sc).setRotation(Math.random() * 6.28);
      if (o.add) img.setBlendMode(Phaser.BlendModes.ADD);
      const life = (o.life || 600) * (0.7 + Math.random() * 0.6), g = o.gravity === undefined ? 900 : o.gravity, spin = (Math.random() - 0.5) * (o.spin || 0);
      this.tweens.addCounter({ from: 0, to: 1, duration: life, delay: o.delay || 0,
        onUpdate: (tw) => { const t = tw.getValue(), s = (t * life) / 1000; img.x = x + vx * s; img.y = y + vy * s + 0.5 * g * s * s; img.alpha = 1 - t * t; img.rotation += spin; if (o.grow) img.setScale(sc * (1 + t * o.grow)); },
        onComplete: () => img.destroy() });
    }
  }
  ring(x, y, color, to, delay) {
    const g = this.add.graphics().setDepth(7);
    const c = Phaser.Display.Color.HexStringToColor(color).color;
    this.tweens.addCounter({ from: 0, to: 1, duration: 420, delay: delay || 0, ease: 'Cubic.easeOut',
      onUpdate: (tw) => { const t = tw.getValue(); g.clear(); g.lineStyle(8 * (1 - t) + 2, c, 1 - t); g.strokeCircle(x, y, CELL * (0.2 + t * to)); },
      onComplete: () => g.destroy() });
  }
  pieceColor(tex) {
    const m = /^p_(\w+)_(\d)$/.exec(tex);
    if (!m) return ['#fff3c4', '#f2b632'];
    return [PIECE_COLOR[m[1]][+m[2]], '#ffffff'];
  }
  // Ficha que se junta: crece, gira y se deshace en brillitos
  popPiece(s, r, c, delay, few) {
    const [x, y] = this.xy(r, c), cols = this.pieceColor(s.texture.key);
    return this.tween({ targets: s, scale: s.base * 1.28, angle: (Math.random() - 0.5) * 16, duration: 90, delay, ease: 'Quad.easeOut' }).then(() => {
      this.particles(x, y, { n: few ? 3 : 7, colors: cols, tex: few ? 'dot' : 'star', speed: 260, size: 0.55, gravity: 500, life: 480, spin: 0.3 });
      return this.tween({ targets: s, scale: 0, alpha: 0, angle: s.angle * 4, duration: 190, ease: 'Back.easeIn' });
    }).then(() => s.destroy());
  }
  // Ficha alcanzada por una explosión: sale volando desde el centro
  flyAway(s, r, c, o, delay) {
    let dx = c - o.c, dy = r - o.r;
    if (o.s === 'h') { dx = c - o.c || 0.01; dy = -0.35; } else if (o.s === 'v') { dx = 0.35 * (c % 2 ? 1 : -1); dy = r - o.r || 0.01; }
    const len = Math.hypot(dx, dy) || 1, dist = CELL * (0.8 + Math.random() * 0.8);
    const [x, y] = this.xy(r, c);
    s.setDepth(4);
    const ready = this.wait(delay + 250);
    this.tween({ targets: s, scale: s.base * 1.2, duration: 70, delay, ease: 'Quad.easeOut' }).then(() => {
      this.particles(x, y, { n: 3, colors: this.pieceColor(s.texture.key), speed: 200, size: 0.5, gravity: 400, life: 400 });
      return this.tween({ targets: s, x: s.x + (dx / len) * dist, y: s.y + (dy / len) * dist - CELL * 0.3, angle: (Math.random() < 0.5 ? -1 : 1) * (120 + Math.random() * 160), scale: s.base * 0.35, alpha: 0, duration: 380, ease: 'Cubic.easeOut' });
    }).then(() => s.destroy());
    return ready;
  }
  // Piedra que se rompe: destello, se parte en pedazos y deja polvo
  breakRock(s, r, c, delay) {
    const [x, y] = this.xy(r, c), k = ROCK_SKIN[this.lv.rskin] || ROCK_SKIN.piedra;
    const kind = s.texture.key.startsWith('barril_') ? 'barril' : s.texture.key === 'maleza_t' ? 'maleza' : 'rock';
    let cols = this.lv.rskin === 'lava' ? [k.base, k.dark, '#ff7a2a', '#ffb347'] : this.lv.rskin === 'hielo' ? ['#ffffff', k.base, k.light] : [k.base, k.dark, k.light];
    if (kind === 'barril') cols = ['#a8642e', '#7a4420', '#c98a4a', '#3a3a40'];
    if (kind === 'maleza') cols = ['#5d7a2a', '#8fb84a', '#4a3a1e'];
    if (kind === 'barril') this.time.delayedCall(delay + 80, () => { this.particles(x, y, { n: 6, colors: ['#ffd65a', '#f2b632', '#fff3c4'], tex: 'star', speed: 280, lift: 260, size: 0.6, gravity: 900, life: 800, spin: 0.3, depth: 9 }); });
    s.setDepth(4);
    const ready = this.wait(delay + 200);
    this.tween({ targets: s, scale: s.base * 1.15, duration: 80, delay, ease: 'Quad.easeOut', onStart: () => s.setTintFill(0xffffff) }).then(() => {
      s.clearTint();
      Sound.crack();
      this.particles(x, y, { n: 12, colors: cols, tex: 'chip', speed: 330, lift: 160, size: 0.9, gravity: 1300, life: 750, spin: 0.35, depth: 9 });
      this.particles(x, y + CELL * 0.15, { n: 4, colors: this.lv.rskin === 'hielo' ? ['#e9f6ff'] : ['#d8cdbb', '#b9ad98'], tex: 'puff', speed: 60, size: 0.9, gravity: -40, life: 700, grow: 1.4, depth: 8 });
      if (this.lv.rskin === 'lava') this.particles(x, y, { n: 6, colors: ['#ffcf6a', '#ff7a2a'], speed: 220, lift: 120, size: 0.5, gravity: 700, life: 600, add: true });
      this.ring(x, y, this.lv.rskin === 'hielo' ? '#e9f6ff' : '#fff3dc', 0.6);
      return this.tween({ targets: s, scale: s.base * 0.4, alpha: 0, duration: 160, ease: 'Quad.easeIn' });
    }).then(() => s.destroy());
    return ready;
  }
  // Piedra reforzada que pierde una capa: saltan las cintas y chispas
  hitRock(r, c) {
    const s = this.sprites[r][c];
    const [x, y] = this.xy(r, c);
    const k = s && s.texture.key.startsWith('barril_') ? { base: '#a8642e', dark: '#7a4420' } : (ROCK_SKIN[this.lv.rskin] || ROCK_SKIN.piedra);
    Sound.crack();
    this.particles(x, y - CELL * 0.1, { n: 4, colors: ['#5a5f66', '#8a8f96'], tex: 'chip', speed: 300, lift: 220, size: 1.3, gravity: 1400, life: 800, spin: 0.4, depth: 9 });
    this.particles(x, y, { n: 8, colors: ['#ffe28a', '#ffffff'], speed: 320, size: 0.35, gravity: 600, life: 380, add: true });
    this.particles(x, y, { n: 5, colors: [k.base, k.dark], tex: 'chip', speed: 220, lift: 100, size: 0.6, gravity: 1200, life: 600, spin: 0.3, depth: 9 });
    if (!s) return;
    this.tweens.killTweensOf(s); s.setScale(s.base); s.setAngle(0);
    this.tweens.add({ targets: s, scaleX: s.base * 1.15, scaleY: s.base * 0.88, duration: 70, yoyo: true, ease: 'Quad.easeOut' });
    this.tweens.add({ targets: s, angle: { from: -7, to: 7 }, duration: 55, yoyo: true, repeat: 2, onComplete: () => s.setAngle(0) });
  }
  // Alambre que se corta: los pedazos saltan y la ficha queda suelta
  snapWire(r, c) {
    const [x, y] = this.xy(r, c), s = this.sprites[r][c];
    const w = this.add.image(x, y, 'wire').setDisplaySize(CELL * 0.9, CELL * 0.9).setDepth(6), b = w.scaleX;
    this.tweens.add({ targets: w, scale: b * 1.35, angle: (Math.random() < 0.5 ? -1 : 1) * 25, alpha: 0, duration: 360, ease: 'Cubic.easeOut', onComplete: () => w.destroy() });
    this.particles(x, y, { n: 9, colors: ['#8a4a22', '#b4683a', '#5e3018'], tex: 'chip', speed: 300, lift: 180, size: 0.55, gravity: 1200, life: 650, spin: 0.4, depth: 9 });
    this.particles(x, y, { n: 6, colors: ['#ffe28a', '#ffffff'], speed: 260, size: 0.3, gravity: 500, life: 320, add: true });
    if (s && s.active) {
      const k = this.g[r][c];
      if (k && !k.w && this.sprites[r][c] === s) { s.setTexture(this.key(k)); s.setDisplaySize(CELL * 0.9, CELL * 0.9); s.base = s.scaleX; }
      this.tweens.add({ targets: s, scaleX: s.base * 1.18, scaleY: s.base * 0.9, duration: 90, yoyo: true, ease: 'Quad.easeOut' });
    }
  }
  // Suelo limpio: la baldosa se levanta en polvo
  scrubFloor(r, c, delay) {
    const [x, y] = this.xy(r, c), skin = this.lv.fskin, f = FLOOR_SKIN[skin] || FLOOR_SKIN.tierra;
    let key = `suelo_${skin}`;
    if (!this.textures.exists(key)) key = `floor_${skin}`;
    if (!this.textures.exists(key)) {
      const t = this.textures.createCanvas(key, CELL, CELL), cx = t.getContext();
      cx.fillStyle = f.color; cx.beginPath(); cx.roundRect ? cx.roundRect(3, 3, CELL - 6, CELL - 6, 14) : cx.rect(3, 3, CELL - 6, CELL - 6); cx.fill();
      cx.fillStyle = f.dot; [[24, 24], [64, 30], [40, 60], [72, 70]].forEach(([a, b]) => { cx.beginPath(); cx.arc(a, b, 4, 0, Math.PI * 2); cx.fill(); });
      t.refresh();
    }
    const tile = this.add.image(x, y, key).setDisplaySize(CELL, CELL).setDepth(1.5), b = tile.scaleX;
    this.tweens.add({ targets: tile, scale: b * 1.25, alpha: 0, duration: 420, delay, ease: 'Quad.easeOut', onComplete: () => tile.destroy() });
    this.time.delayedCall(delay, () => {
      this.particles(x, y, { n: 6, colors: [f.color, f.dot], tex: 'puff', speed: 90, size: 0.55, gravity: -30, life: 650, grow: 1.2, depth: 7 });
      this.particles(x, y, { n: 5, colors: [f.color, f.dot], tex: 'chip', speed: 200, lift: 120, size: 0.45, gravity: 900, life: 520, spin: 0.3, depth: 7 });
    });
  }

  async animClear(res, combo, out) {
    Sound.pop(combo);
    const trig = res.triggered.map((t) => t.s);
    if (trig.some((s) => ['o', 'o2', 'xo', 'all'].includes(s))) Sound.boom();
    if (trig.some((s) => ['h', 'v', 'x', 'xo'].includes(s))) Sound.wind();
    if (res.flights.length) Sound.whoosh();
    if (res.beams.length || trig.includes('all')) Sound.bomb();
    if (res.created.length) Sound.special();
    if (res.converted.length) {
      for (const o of res.converted) {
        const s = this.sprites[o.r][o.c];
        if (s) { s.setTexture(this.texKey(null, -1, o.s)); s.setDisplaySize(CELL * 0.9, CELL * 0.9); s.base = s.scaleX; }
        if (s) this.tweens.add({ targets: s, scale: s.base * 1.3, duration: 140, yoyo: true });
      }
      this.drawBeams(res.beams);
      this.tweens.add({ targets: this.fx, alpha: { from: 1, to: 0 }, duration: 500, onComplete: () => { this.fx.clear(); this.fx.setAlpha(1); } });
      await this.wait(520);
    }
    this.fx.clear(); this.fx.setAlpha(1);
    // anticipación: los boosters que van a explotar se inflan y tiemblan antes
    const pre = res.triggered.filter((t) => this.sprites[t.r] && this.sprites[t.r][t.c] && t.s !== 'b' && t.s !== 'all').slice(0, 4);
    if (pre.length && FX.on) {
      const volc = pre.some((t) => t.s === 'o' || t.s === 'o2' || t.s === 'xo');
      pre.forEach((t) => { const sp = this.sprites[t.r][t.c]; this.tweens.killTweensOf(sp); sp.setDepth(6); this.tweens.add({ targets: sp, scale: sp.base * (volc ? 1.45 : 1.3), duration: volc ? 260 : 140, ease: 'Sine.easeOut' }); if (volc) this.tweens.add({ targets: sp, angle: { from: -9, to: 9 }, duration: 45, yoyo: true, repeat: 2 }); });
      if (volc) { Sound.rumble(); this.cameras.main.shake(260, 0.004); }
      await this.wait(volc ? 280 : 150);
    }
    this.bigFx = res.triggered.length > 6 ? 3 : 6;
    const keyTrig = res.triggered.find((t) => t.s === 'b' || t.s === 'all');
    if (keyTrig && FX.on) { this.blast(keyTrig); await this.wait(420); }
    if (!res.converted.length) this.drawBeams(res.beams);
    res.triggered.forEach((t) => { if (t !== keyTrig && t.s !== 'c' && t.s !== 'c3') this.blast(t); });
    this.tweens.add({ targets: this.fx, alpha: { from: 1, to: 0 }, duration: 420, onComplete: () => { this.fx.clear(); this.fx.setAlpha(1); } });
    if (res.flights.length) await Promise.all(res.flights.map((f) => this.flyCondor(f)));
    const jobs = [];
    const origins = res.triggered.filter((t) => t.s !== 'c' && t.s !== 'c3');
    const many = out.removed.length > 18;
    for (const k of out.damaged) { const [r, c] = RC(k); this.setPieceTex(r, c); this.hitRock(r, c); }
    if (out.unwired && out.unwired.length) { Sound.snip(); out.unwired.forEach((k) => { const [r, c] = RC(k); this.snapWire(r, c); }); }
    if (out.fogHit && out.fogHit.length) { Sound.whoosh(); out.fogHit.forEach((k, i) => this.clearFog(k, i * 25)); }
    if (out.floorHit.length) {
      this.drawFloor();
      out.floorHit.forEach((k) => { const [r, c] = RC(k); this.scrubFloor(r, c, 0); });
    }
    for (const k of out.removed) {
      const [r, c] = RC(k);
      const s = this.sprites[r][c];
      this.sprites[r][c] = null;
      if (!s) continue;
      this.tweens.killTweensOf(s); s.setScale(s.base); s.setAngle(0);
      let o = null, d = 0;
      for (const t of origins) { const dd = t.s === 'h' ? Math.abs(t.c - c) + (t.r === r ? 0 : 9) : t.s === 'v' ? Math.abs(t.r - r) + (t.c === c ? 0 : 9) : Math.hypot(t.r - r, t.c - c); if (!o || dd < d) { o = t; d = dd; } }
      const delay = o ? Math.min(d, 7) * (o.s === 'h' || o.s === 'v' ? 32 : 45) : 0;
      if (s.texture.key.startsWith('rock_') || s.texture.key.startsWith('barril_') || s.texture.key === 'maleza_t') jobs.push(this.breakRock(s, r, c, delay));
      else if (o && d > 0.1 && FX.on) jobs.push(this.flyAway(s, r, c, o, delay));
      else jobs.push(this.popPiece(s, r, c, delay, many));
    }
    for (const o of res.created) {
      const s = this.sprites[o.r][o.c];
      if (!s) continue;
      s.setTexture(this.key(o.piece));
      s.setDisplaySize(CELL * 0.9, CELL * 0.9); s.base = s.scaleX;
      jobs.push(this.tween({ targets: s, scale: s.base * 1.3, duration: 140, yoyo: true }));
    }
    await Promise.all(jobs);
    if (res.created.length && FX.on && !this.rushing) {
      res.created.slice(0, 2).forEach((o) => FX.born(o.r, o.c, o.piece.s));
      await this.wait(560);
    }
  }

  async animGravity(grav) {
    const jobs = [];
    const moved = grav.moves.map((m) => ({ ...m, s: this.sprites[m.from[0]][m.from[1]] }));
    moved.forEach((m) => { this.sprites[m.from[0]][m.from[1]] = null; });
    moved.forEach((m) => {
      this.sprites[m.to[0]][m.to[1]] = m.s;
      if (!m.s) return;
      const d = Math.max(1, m.to[0] - m.from[0]), [tx, ty] = this.xy(...m.to);
      jobs.push(this.tween({ targets: m.s, x: tx, y: ty, duration: 110 + d * 60, ease: 'Cubic.easeIn' }).then(() => this.land(m.s)));
    });
    grav.spawns.forEach((sp) => {
      const s = this.makeSprite(sp.r, sp.c, this.g[sp.r][sp.c], sp.fromRow);
      this.sprites[sp.r][sp.c] = s;
      const d = sp.r - sp.fromRow;
      jobs.push(this.tween({ targets: s, y: this.xy(sp.r, sp.c)[1], duration: 110 + d * 60, ease: 'Cubic.easeIn', delay: (ROWS - 1 - sp.r) * 12 }).then(() => this.land(s)));
    });
    await Promise.all(jobs);
  }
  land(s) {
    if (!s || !s.active) return;
    this.tweens.add({ targets: s, scaleY: s.base * 0.84, scaleX: s.base * 1.1, duration: 70, yoyo: true, ease: 'Quad.easeOut', onComplete: () => { if (s.active) s.setScale(s.base); } });
  }

  async redraw() {
    this.sprites.flat().forEach((s) => s && s.destroy());
    this.sprites = [];
    for (let r = 0; r < ROWS; r++) {
      this.sprites.push([]);
      for (let c = 0; c < COLS; c++) { const s = this.makeSprite(r, c, this.g[r][c]); s.setScale(0); this.sprites[r].push(s); this.tweens.add({ targets: s, scale: s.base, duration: 260, delay: (r + c) * 15 }); }
    }
    toast('Mezclando');
    await this.wait(320);
  }
}

let game;
imagesReady.then(() => {
  game = new Phaser.Game({
    type: Phaser.AUTO,
    parent: 'board',
    transparent: true,
    audio: { noAudio: true },
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH, width: COLS * CELL, height: ROWS * CELL },
    scene: BoardScene,
    banner: false,
  });
});

/* ===== Botones ===== */
$('btn-play').addEventListener('click', async () => {
  Sound.unlock(); Sound.music('game'); Sound.tick();
  if (!save.profile) await askProfile(false);
  if (!save.seenHelp) { await showHowTo(); renderMap(); playPlace(0); return; }
  renderMap();
});
$('btn-howto').addEventListener('click', async () => { Sound.unlock(); Sound.tick(); await showHowTo(); openTitle(); });
$('btn-back').addEventListener('click', async () => {
  Sound.tick();
  const sc = await boardReady;
  if (sc.movesUsed > 0 && !sc.ended) {
    const v = await modal('<span class="kicker">¿Salir del nivel?</span><div class="icon small"><img src="img/ui_corazon.png" alt=""></div><h3>Vas a perder una vida</h3><p>Si salís ahora, el nivel cuenta como perdido.</p>', [['Seguir jugando', 'stay'], ['Salir', 'leave', 1]]);
    if (v !== 'leave') return;
    loseLife();
  }
  sc.ended = true; sc.setTool(null); sc.hideHand();
  $('game').classList.remove('special', 'night');
  NIGHT = false;
  app.classList.remove('memory');
  renderMap();
});
document.querySelectorAll('[data-shop]').forEach((b) => b.addEventListener('click', openShop));
$('btn-shop-close').addEventListener('click', () => { Sound.tick(); renderMap(); });
$('btn-daily').addEventListener('click', () => { Sound.tick(); openDaily(); });
document.querySelectorAll('.tool').forEach((b) => b.addEventListener('click', () => onToolButton(b.dataset.tool)));
$('btn-more').addEventListener('click', openMore);
$('btn-bag').addEventListener('click', openBag);
document.querySelectorAll('.snd').forEach((b) => b.addEventListener('click', () => { Sound.unlock(); Sound.toggle(); if (!Sound.muted) Sound.music('game'); syncSoundButtons(); }));
syncSoundButtons();
setInterval(refreshStats, 1000);

/* ===== Instalar como app ===== */
let installPrompt = null;
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function updateInstall() { const showIt = !standalone() && (!!installPrompt || isIOS); document.querySelectorAll('.install').forEach((b) => { b.hidden = !showIt; }); }
addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installPrompt = e; updateInstall(); });
addEventListener('appinstalled', () => { installPrompt = null; updateInstall(); });
document.querySelectorAll('.install').forEach((b) => b.addEventListener('click', async () => {
  Sound.tick();
  if (installPrompt) {
    installPrompt.prompt();
    try { await installPrompt.userChoice; } catch (e) {}
    installPrompt = null; updateInstall();
  } else if (isIOS) {
    await modal('<span class="kicker">Instalar en iPhone</span><h3>Agregalo a tu inicio</h3><p>Tocá el botón Compartir de Safari (el cuadrado con la flecha para arriba) y elegí "Agregar a inicio".</p>', [['Entendido', 1]]);
  }
}));
updateInstall();
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));

refreshStats();
openTitle();
</script>
